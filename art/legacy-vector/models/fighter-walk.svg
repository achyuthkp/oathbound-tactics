<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" class="figure pose-walk w-axe right   " aria-hidden="true"><style><![CDATA[/* ===== 2D character rig =====
   Limbs sit inside translated <g> groups, so rotating a limb pivots on its joint
   (transform-origin 0 0 = the joint). Rest angles are CSS variables per weapon. */
.figure { display: block; overflow: visible; --af: -55deg; --ab: 14deg; }
.figure.left { transform: scaleX(-1); }
.figure.w-bow { --af: -90deg; --ab: -86deg; }
.figure.w-staff { --af: -35deg; }
.figure.w-none { --af: 10deg; }

.figure .arm, .figure .leg, .figure .hleg, .figure .wing, .figure .head, .figure .forearm, .figure .shin, .figure .f-eyes { transform-origin: 0 0; }
.figure .ink { stroke: rgba(36,22,18,.85); stroke-width: .9px; stroke-linejoin: round; }
.figure .fm-open { opacity: 0; }
.figure .f-eyes { animation: blink 4.6s infinite; }
.figure .arm-front .forearm { transform: rotate(var(--ff, -8deg)); }
.figure.w-bow .arm-front .forearm { --ff: 0deg; }
.figure.w-staff .arm-front .forearm { --ff: 35deg; }
.figure .arm-back .forearm { transform: rotate(-14deg); }
.figure.w-bow .arm-back .forearm { transform: rotate(-4deg); }
.figure .arm-front { transform: rotate(var(--af)); }
.figure .arm-back { transform: rotate(var(--ab)); }
.figure .fig-root { transform-origin: 80px 158px; }
.figure .upper { transform-origin: 80px 106px; }
.figure .cape { transform-origin: 80px 74px; animation: capeSway 3.2s ease-in-out infinite; }
.figure .str-drawn { opacity: 0; }
.figure .hair { stroke: rgba(255,255,255,.18); stroke-width: .7px; }
.figure .wing { transform: rotate(-6deg); }
.figure .mtail { transform-origin: 52px 112px; animation: tailSwish 2.4s ease-in-out infinite; }
.figure .mhead { animation: headNod 3s ease-in-out infinite; }

@keyframes capeSway { 50% { transform: rotate(3deg); } }
@keyframes tailSwish { 50% { transform: rotate(-8deg); } }
@keyframes headNod { 50% { transform: translate(118px, 85.5px); } 0%, 100% { transform: translate(118px, 84px); } }

/* idle: breathing + slight guard sway */
.figure.pose-idle .upper { animation: breathe 2.8s ease-in-out infinite; }
.figure.pose-idle .arm-front { animation: armIdle 2.8s ease-in-out infinite; }
@keyframes breathe { 50% { transform: translateY(1.3px); } }
@keyframes armIdle { 50% { transform: rotate(calc(var(--af) + 5deg)); } }

/* flyers hover and flap */
.figure.flying .fig-float { animation: hoverY 1.8s ease-in-out infinite; }
.figure.flying .wing { animation: flap 1.1s ease-in-out infinite alternate; }
@keyframes hoverY { 50% { transform: translateY(-4px); } }
@keyframes flap { from { transform: rotate(-16deg); } to { transform: rotate(22deg); } }

/* walk */
.figure.pose-walk .leg-back { animation: stride .56s ease-in-out infinite alternate; }
.figure.pose-walk .leg-front { animation: stride .56s ease-in-out infinite alternate-reverse; }
.figure.pose-walk .arm-back { animation: swingArm .56s ease-in-out infinite alternate; }
.figure.pose-walk .upper { animation: bob .28s ease-in-out infinite alternate; }
.figure.pose-walk .cape { animation-duration: .9s; }
@keyframes stride { from { transform: rotate(26deg); } to { transform: rotate(-26deg); } }
.figure.pose-walk .leg-back .shin { animation: knee .56s ease-in-out infinite alternate; }
.figure.pose-walk .leg-front .shin { animation: knee .56s ease-in-out infinite alternate-reverse; }
.figure.pose-walk .arm-back .forearm { animation: elbowSwing .56s ease-in-out infinite alternate; }
@keyframes knee { from { transform: rotate(34deg); } to { transform: rotate(3deg); } }
@keyframes elbowSwing { from { transform: rotate(-30deg); } to { transform: rotate(-6deg); } }

/* talk: head bob, mouth flaps, open-hand gesture */
.figure.pose-talk .upper { animation: breathe 1.6s ease-in-out infinite; }
.figure.pose-talk .head { animation: talkNod .5s ease-in-out infinite alternate; }
.figure.pose-talk .fm-closed { animation: mClosed .38s step-end infinite; }
.figure.pose-talk .fm-open { animation: mOpen1 .38s step-end infinite; }
.figure.pose-talk .arm-back { animation: gesture 1.4s ease-in-out infinite; }
.figure.pose-talk .arm-back .forearm { animation: gestureFore 1.4s ease-in-out infinite; }
@keyframes talkNod { from { transform: rotate(-3deg); } to { transform: rotate(3deg) translateY(.6px); } }
@keyframes gesture { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(-48deg); } }
@keyframes gestureFore { 0%, 100% { transform: rotate(-50deg); } 50% { transform: rotate(-80deg); } }
@keyframes swingArm { from { transform: rotate(-22deg); } to { transform: rotate(30deg); } }
@keyframes bob { to { transform: translateY(-1.8px); } }

/* galloping legs whenever a mounted unit moves or charges */
.figure.mounted.pose-walk .hleg, .figure.mounted.pose-slash .hleg, .figure.mounted.pose-thrust .hleg, .figure.mounted.pose-chop .hleg {
  animation: gallop .32s ease-in-out infinite alternate;
}
.figure.mounted .hleg.h2, .figure.mounted .hleg.h3 { animation-direction: alternate-reverse; }
@keyframes gallop { from { transform: rotate(26deg); } to { transform: rotate(-26deg); } }

/* sword: overhead slash */
.figure.pose-slash .arm-front { animation: slash .62s cubic-bezier(.3, .1, .3, 1) forwards; }
.figure.pose-slash .upper, .figure.pose-chop .upper { animation: lean .62s ease-in-out forwards; }
@keyframes slash {
  0% { transform: rotate(var(--af)); }
  38% { transform: rotate(-210deg); }
  56% { transform: rotate(-12deg); }
  100% { transform: rotate(-40deg); }
}
@keyframes lean { 38% { transform: rotate(-6deg); } 56% { transform: rotate(8deg); } 100% { transform: none; } }
.figure.pose-slash .arm-front .forearm { animation: elbowSlash .62s cubic-bezier(.3, .1, .3, 1) forwards; }
.figure.pose-chop .arm-front .forearm { animation: elbowChop .7s cubic-bezier(.4, 0, .2, 1) forwards; }
.figure.pose-thrust .arm-front .forearm { animation: elbowThrust .6s cubic-bezier(.3, .1, .3, 1) forwards; }
.figure.pose-slash .leg-front .shin, .figure.pose-chop .leg-front .shin, .figure.pose-thrust .leg-front .shin { animation: braceKnee .65s ease-in-out forwards; }
@keyframes elbowSlash { 0% { transform: rotate(-8deg); } 38% { transform: rotate(-55deg); } 56% { transform: rotate(4deg); } 100% { transform: rotate(-8deg); } }
@keyframes elbowChop { 0% { transform: rotate(-8deg); } 42% { transform: rotate(-70deg); } 58% { transform: rotate(6deg); } 100% { transform: rotate(-8deg); } }
@keyframes elbowThrust { 0% { transform: rotate(-8deg); } 35% { transform: rotate(-60deg); } 55% { transform: rotate(0deg); } 100% { transform: rotate(-8deg); } }
@keyframes braceKnee { 40%, 60% { transform: rotate(16deg); } 100% { transform: none; } }

/* lance: pull back, thrust */
.figure.pose-thrust .arm-front { animation: thrust .6s cubic-bezier(.3, .1, .3, 1) forwards; }
.figure.pose-thrust .upper { animation: lunge .6s ease-in-out forwards; }
@keyframes thrust {
  0% { transform: rotate(var(--af)); }
  35% { transform: translateX(-9px) rotate(-42deg); }
  55% { transform: translateX(13px) rotate(-82deg); }
  100% { transform: rotate(var(--af)); }
}
@keyframes lunge { 35% { transform: rotate(-4deg); } 55% { transform: rotate(9deg); } 100% { transform: none; } }

/* axe: big wind-up chop */
.figure.pose-chop .arm-front { animation: chop .7s cubic-bezier(.4, 0, .2, 1) forwards; }
@keyframes chop {
  0% { transform: rotate(var(--af)); }
  42% { transform: rotate(-222deg); }
  58% { transform: rotate(-2deg); }
  100% { transform: rotate(-35deg); }
}

/* bow: draw and release */
.figure.pose-shoot .arm-back { animation: drawArm .7s ease-out forwards; }
.figure.pose-shoot .str-rest { animation: strRest .7s forwards; }
.figure.pose-shoot .str-drawn { animation: strDrawn .7s forwards; }
.figure.pose-shoot .nocked { animation: nock .7s ease-out forwards; }
@keyframes drawArm { 0% { transform: rotate(var(--ab)); } 50%, 56% { transform: translateX(-5px) rotate(-93deg); } 70%, 100% { transform: rotate(var(--ab)); } }
@keyframes strRest { 0%, 14% { opacity: 1; } 15%, 56% { opacity: 0; } 57%, 100% { opacity: 1; } }
@keyframes strDrawn { 0%, 14% { opacity: 0; } 15%, 56% { opacity: 1; } 57%, 100% { opacity: 0; } }
@keyframes nock { 0% { transform: none; opacity: 1; } 50%, 56% { transform: translateX(-13px); opacity: 1; } 57%, 100% { transform: translateX(-13px); opacity: 0; } }

/* staff: raise and glow */
.figure.pose-cast .arm-front { animation: cast .9s ease-in-out forwards; }
.figure.pose-cast .orb { animation: glow .9s ease-in-out forwards; }
@keyframes cast { 0% { transform: rotate(var(--af)); } 40%, 75% { transform: rotate(-150deg); } 100% { transform: rotate(var(--af)); } }
@keyframes glow { 40%, 75% { fill: #ffffff; filter: drop-shadow(0 0 6px #9fe0ff); } }

/* reactions */
.figure.pose-hit .fig-root { animation: recoil .45s ease-out; }
.figure.pose-dodge .fig-root { animation: sidestep .6s ease-in-out; }
.figure.pose-die .fig-root { animation: fall 1s ease-in forwards; }
@keyframes recoil { 25% { transform: translateX(-12px) rotate(-7deg); } 100% { transform: none; } }
@keyframes sidestep { 30%, 65% { transform: translate(-24px, -4px) rotate(-4deg); } 100% { transform: none; } }
@keyframes fall {
  0% { transform: none; opacity: 1; }
  30% { transform: translateX(-8px) rotate(-10deg); opacity: 1; }
  100% { transform: translateY(3px) rotate(-84deg); opacity: .3; }
}

@media (prefers-reduced-motion: reduce) {
  .figure * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

/* ===== Portrait busts: blink, breathe, lip-sync ===== */
.bust { display: block; overflow: visible; }
.bust .ink { stroke: #2a1a18; stroke-width: 1.8px; stroke-linejoin: round; }
.bust .breath { animation: bustBreath 3.6s ease-in-out infinite; }
.bust .eyes { transform-origin: 0 0; animation: blink 5s infinite; animation-delay: var(--blink-delay, 0s); }
.bust .head { transform-origin: 0 40px; }
.bust .m-open1, .bust .m-open2 { opacity: 0; }
.bust .hair-sway { transform-origin: 30px -40px; animation: sway 3.4s ease-in-out infinite; }
.bust.talking .head { animation: nod .55s ease-in-out infinite alternate; }
.bust.talking .m-closed { animation: mClosed .42s step-end infinite; }
.bust.talking .m-open1 { animation: mOpen1 .42s step-end infinite; }
.bust.talking .m-open2 { animation: mOpen2 .42s step-end infinite; }
.bust.still .breath, .bust.still .eyes, .bust.still .hair-sway { animation: none; }
@keyframes bustBreath { 50% { transform: translateY(1.6px); } }
@keyframes blink { 0%, 95% { transform: scaleY(1); } 97% { transform: scaleY(.08); } 99%, 100% { transform: scaleY(1); } }
@keyframes nod { from { transform: rotate(-1.4deg); } to { transform: rotate(1.2deg) translateY(1px); } }
@keyframes sway { 50% { transform: rotate(3deg); } }
@keyframes mClosed { 0% { opacity: 1; } 25% { opacity: 0; } 75% { opacity: 1; } }
@keyframes mOpen1 { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } 75% { opacity: 1; } }
@keyframes mOpen2 { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } }
]]></style><ellipse class="fig-shadow" cx="80" cy="160" rx="22" ry="5" fill="rgba(0,0,0,.35)"></ellipse><g class="fig-root"><g class="fig-float"><g transform="translate(75 104)"><g class="leg leg-back"><rect class="ink" x="-4.4" y="-2" width="8.8" height="26" rx="4.2" fill="#3a3446"></rect><g transform="translate(0 22)"><g class="shin"><rect class="ink" x="-4" y="-2" width="8" height="22" rx="3.8" fill="#3a3446"></rect><path class="ink" d="M-5 16 H5 V23 H11 Q13 23 13 26 V28 H-5 Z" fill="#3b2a1e"></path></g></g></g></g><g transform="translate(85 104)"><g class="leg leg-front"><rect class="ink" x="-4.4" y="-2" width="8.8" height="26" rx="4.2" fill="#3a3446"></rect><g transform="translate(0 22)"><g class="shin"><rect class="ink" x="-4" y="-2" width="8" height="22" rx="3.8" fill="#3a3446"></rect><path class="ink" d="M-5 16 H5 V23 H11 Q13 23 13 26 V28 H-5 Z" fill="#3b2a1e"></path></g></g></g></g><g class="upper"><g transform="translate(75 72)"><g class="arm arm-back"><rect class="ink" x="-4" y="-3" width="8" height="19" rx="4" fill="#d6a27c"></rect><g transform="translate(0 15)"><g class="forearm"><rect class="ink" x="-3.7" y="-2" width="7.4" height="15" rx="3.6" fill="#d6a27c"></rect><circle class="ink" cx="0" cy="13.5" r="4" fill="#d6a27c"></circle></g></g></g></g><path class="ink" d="M66 75 Q80 67 94 75 L91 107 L69 107 Z" fill="#7a4422"></path><path d="M73 75 L77 106 M87 75 L83 106" stroke="#3a2416" stroke-width="2.6"></path><path d="M75 71 L80 79 L85 71" stroke="#8a2a20" stroke-width="2.4" fill="none"></path><rect x="69" y="101" width="22" height="5" fill="#2a2018"></rect><rect x="78" y="101" width="4" height="5" fill="#8a2a20"></rect><g transform="translate(80 52)"><g class="head"><rect x="-4" y="8" width="8" height="12" fill="#d6a27c"></rect><rect x="-4" y="8" width="8" height="4" fill="rgba(60,20,20,.18)"></rect><path class="ink" d="M-11 -2 Q-11 -14 0 -14 Q11 -14 11 -2 Q11 8 6 11.5 Q1 14 -4 12 Q-11 8 -11 -2 Z" fill="#d6a27c"></path><ellipse class="ink" cx="-8.3" cy="1" rx="2.3" ry="3.2" fill="#d6a27c"></ellipse><path d="M10.6 0.5 L12.6 4.5 L10.2 5" fill="#d6a27c" stroke="rgba(80,40,30,.35)" stroke-width=".7"></path><g transform="translate(0 0.6)"><g class="f-eyes"><ellipse cx="3" cy="0" rx="1.25" ry="1.6" fill="#1d1a26"></ellipse><ellipse cx="8.2" cy="0" rx="1.15" ry="1.5" fill="#1d1a26"></ellipse><circle cx="2.6" cy="-0.6" r=".45" fill="#fff"></circle></g></g><path d="M1 -3.2 L5 -3.9 M6.8 -3.9 L10 -3.2" stroke="#4a2a1a" stroke-width="1.3" stroke-linecap="round"></path><path d="M2 3.4 Q3.5 4.2 5 3.6" stroke="rgba(120,60,50,.28)" stroke-width=".6" fill="none"></path><path class="fm-closed" d="M5 8.2 Q7 9 9 8.2" stroke="#8a4a40" stroke-width="1" fill="none" stroke-linecap="round"></path><path class="fm-open" d="M5 7.8 Q7 8.4 9 7.8 Q7 11.4 5 7.8 Z" fill="#5a2028"></path><path d="M-12 2 Q-15 -12 -6 -15 Q2 -19 9 -14 Q14 -10 12 -4 Q8 -9 2 -8 Q-4 -9 -7 -4 Q-10 -2 -12 2 Z" fill="#4a2a1a" class="hair"></path><path d="M-7 5 Q-6 15.5 3 15.5 Q10 13.5 11.6 4 Q9 9 4 9.5 Q-1 9.5 -7 5 Z" fill="#4a2a1a" class="hair"></path></g></g><g transform="translate(86 72)"><g class="arm arm-front"><rect class="ink" x="-4" y="-3" width="8" height="19" rx="4" fill="#d6a27c"></rect><g transform="translate(0 15)"><g class="forearm"><g transform="translate(0 14) rotate(-27)"><rect x="-1.8" y="-8" width="3.6" height="46" rx="1.5" fill="#7a5a34"></rect><path d="M-1 25 L-8 23 Q-22 25 -23 36 Q-22 47 -8 48 L-1 44 Z" fill="#aab3c2" stroke="#6f7787" stroke-width=".8"></path><path d="M-20 27 Q-24.5 36 -20 46" fill="none" stroke="#eef2f7" stroke-width="1.6"></path></g><rect class="ink" x="-3.7" y="-2" width="7.4" height="15" rx="3.6" fill="#d6a27c"></rect><circle class="ink" cx="0" cy="13.5" r="4" fill="#d6a27c"></circle></g></g></g></g></g></g></g></svg>