" stroke-width="1.8" fill="none" stroke-linecap="round"></path><path d="M-36 18 Q-30 48 0 58 Q30 48 36 18 Q24 40 0 44 Q-24 40 -36 18 Z" fill="#333" opacity=".22"></path><path d="M-14 31 Q0 27 14 31 Q0 34 -14 31 Z" fill="#333" opacity=".26"></path><path class="ink" d="M0 -68 Q30 -106 76 -92 Q36 -82 18 -62 Z" fill="#c23b3b"></path><path class="ink" d="M-48 6 Q-50 -70 0 -70 Q50 -70 48 6 L48 -6 Q30 -20 0 -20 Q-30 -20 -48 -6 Z" fill="#a3acbb"></path><path class="ink" d="M-48 -6 Q0 -26 48 -6 L48 3 Q0 -17 -48 3 Z" fill="#7e8798"></path><path d="M-30 -56 Q-10 -64 10 -62" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none" stroke-linecap="round"></path><circle cx="-34" cy="-6.6" r="2" fill="#4e5666"></circle><circle cx="-12" cy="-8.8" r="2" fill="#4e5666"></circle><circle cx="12" cy="-8.8" r="2" fill="#4e5666"></circle><circle cx="34" cy="-6.6" r="2" fill="#4e5666"></circle><path class="ink" d="M-4 -18 L4 -18 L3 16 L-3 16 Z" fill="#8e97a8"></path><g transform="translate(0 37)"><g class="m-closed"><path d="M-9 0 Q0 2.6 9 0" fill="none" stroke="#8a3a36" stroke-width="2.4" stroke-linecap="round"></path></g><path class="m-open1" d="M-9 -1 Q0 2 9 -1 Q0 8 -9 -1 Z" fill="#5a2028" stroke="#8a3a36" stroke-width="1.4"></path><g class="m-open2"><path d="M-10 -2 Q0 1 10 -2 Q0 13 -10 -2 Z" fill="#5a2028" stroke="#8a3a36" stroke-width="1.4"></path><path d="M-7 -0.6 Q0 1.6 7 -0.6" stroke="#f4eee4" stroke-width="2" fill="none"></path></g></g></g></g></g></svg>