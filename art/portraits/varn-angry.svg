<svg xmlns="http://www.w3.org/2000/svg" class="bust   " viewBox="0 0 200 240" width="400" height="480" shape-rendering="crispEdges" aria-hidden="true" style="--blink-delay:-0.79s"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><path fill="#1b1424" d="M100 0h30v5h-30zM90 5h10v5h-10zM130 5h15v5h-15zM85 10h5v5h-5zM145 10h5v5h-5zM85 15h5v5h-5zM145 15h5v5h-5zM85 20h5v5h-5zM110 20h35v5h-35zM150 20h5v5h-5zM70 25h20v5h-20zM110 25h20v5h-20zM145 25h5v5h-5zM60 30h10v5h-10zM130 30h10v5h-10zM55 35h5v5h-5zM140 35h5v5h-5zM50 40h10v5h-10zM140 40h10v5h-10zM45 45h5v5h-5zM150 45h5v5h-5zM45 50h5v5h-5zM150 50h5v5h-5zM45 55h5v5h-5zM150 55h5v5h-5zM45 60h5v5h-5zM150 60h5v5h-5zM45 65h5v5h-5zM150 65h5v5h-5zM40 70h5v5h-5zM155 70h5v5h-5zM40 75h5v5h-5zM155 75h5v5h-5zM45 80h5v5h-5zM75 80h20v5h-20zM105 80h20v5h-20zM150 80h5v5h-5zM45 85h5v5h-5zM60 85h5v5h-5zM90 85h5v5h-5zM105 85h5v5h-5zM135 85h5v5h-5zM150 85h5v5h-5zM40 90h10v5h-10zM60 90h25v5h-25zM90 90h5v5h-5zM105 90h5v5h-5zM115 90h25v5h-25zM150 90h10v5h-10zM40 95h10v5h-10zM60 95h5v5h-5zM80 95h5v5h-5zM90 95h5v5h-5zM105 95h5v5h-5zM115 95h5v5h-5zM135 95h5v5h-5zM150 95h10v5h-10zM40 100h10v5h-10zM60 100h5v5h-5zM90 100h5v5h-5zM105 100h5v5h-5zM135 100h5v5h-5zM150 100h10v5h-10zM40 105h10v5h-10zM60 105h5v5h-5zM90 105h5v5h-5zM105 105h5v5h-5zM135 105h5v5h-5zM150 105h10v5h-10zM45 110h5v5h-5zM60 110h5v5h-5zM95 110h10v5h-10zM135 110h5v5h-5zM150 110h5v5h-5zM45 115h5v5h-5zM60 115h5v5h-5zM135 115h5v5h-5zM150 115h5v5h-5zM45 120h5v5h-5zM60 120h5v5h-5zM135 120h5v5h-5zM150 120h5v5h-5zM50 125h10v5h-10zM140 125h10v5h-10zM55 130h5v5h-5zM140 130h5v5h-5zM60 135h5v5h-5zM135 135h5v5h-5zM65 140h5v5h-5zM130 140h5v5h-5zM70 145h5v5h-5zM125 145h5v5h-5zM75 150h10v5h-10zM115 150h10v5h-10zM75 155h5v5h-5zM85 155h30v5h-30zM120 155h5v5h-5zM75 160h5v5h-5zM120 160h5v5h-5zM75 165h5v5h-5zM120 165h5v5h-5zM65 170h15v5h-15zM120 170h15v5h-15zM50 175h15v5h-15zM135 175h15v5h-15zM30 180h20v5h-20zM150 180h20v5h-20zM20 185h10v5h-10zM170 185h10v5h-10zM10 190h10v5h-10zM180 190h10v5h-10zM5 195h5v5h-5zM190 195h5v5h-5zM5 200h5v5h-5zM190 200h5v5h-5zM5 205h5v5h-5zM190 205h5v5h-5zM5 210h5v5h-5zM190 210h5v5h-5zM5 215h5v5h-5zM190 215h5v5h-5zM5 220h5v5h-5zM190 220h5v5h-5zM5 225h5v5h-5zM190 225h5v5h-5zM5 230h5v5h-5zM190