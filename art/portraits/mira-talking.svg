<svg xmlns="http://www.w3.org/2000/svg" class="bust talking  " viewBox="0 0 200 240" width="400" height="480" shape-rendering="crispEdges" aria-hidden="true" style="--blink-delay:-4.152s"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><path fill="#1b1424" d="M70 10h60v5h-60zM55 15h15v5h-15zM130 15h15v5h-15zM45 20h10v5h-10zM145 20h10v5h-10zM35 25h10v5h-10zM155 25h10v5h-10zM30 30h5v5h-5zM40 30h5v5h-5zM155 30h5v5h-5zM165 30h5v5h-5zM30 35h5v5h-5zM40 35h5v5h-5zM155 35h5v5h-5zM165 35h5v5h-5zM30 40h15v5h-15zM155 40h15v5h-15zM30 45h5v5h-5zM165 45h5v5h-5zM30 50h5v5h-5zM165 50h5v5h-5zM30 55h5v5h-5zM80 55h40v5h-40zM165 55h5v5h-5zM30 60h5v5h-5zM65 60h15v5h-15zM120 60h15v5h-15zM165 60h5v5h-5zM30 65h5v5h-5zM55 65h10v5h-10zM135 65h10v5h-10zM165 65h5v5h-5zM30 70h5v5h-5zM55 70h5v5h-5zM140 70h5v5h-5zM165 70h5v5h-5zM30 75h5v5h-5zM55 75h5v5h-5zM140 75h5v5h-5zM165 75h5v5h-5zM30 80h5v5h-5zM55 80h5v5h-5zM140 80h5v5h-5zM165 80h5v5h-5zM30 85h5v5h-5zM55 85h5v5h-5zM140 85h5v5h-5zM165 85h5v5h-5zM30 90h5v5h-5zM55 90h30v5h-30zM115 90h30v5h-30zM165 90h5v5h-5zM30 95h5v5h-5zM55 95h10v5h-10zM135 95h10v5h-10zM165 95h5v5h-5zM30 100h5v5h-5zM55 100h5v5h-5zM140 100h5v5h-5zM165 100h5v5h-5zM30 105h5v5h-5zM55 105h5v5h-5zM140 105h5v5h-5zM165 105h5v5h-5zM30 110h5v5h-5zM55 110h5v5h-5zM140 110h5v5h-5zM165 110h5v5h-5zM30 115h5v5h-5zM55 115h5v5h-5zM140 115h5v5h-5zM165 115h5v5h-5zM30 120h5v5h-5zM55 120h5v5h-5zM140 120h5v5h-5zM165 120h5v5h-5zM30 125h5v5h-5zM55 125h5v5h-5zM140 125h5v5h-5zM165 125h5v5h-5zM30 130h5v5h-5zM55 130h5v5h-5zM140 130h5v5h-5zM165 130h5v5h-5zM30 135h5v5h-5zM55 135h10v5h-10zM135 135h10v5h-10zM165 135h5v5h-5zM30 140h5v5h-5zM55 140h5v5h-5zM65 140h5v5h-5zM130 140h5v5h-5zM140 140h5v5h-5zM165 140h5v5h-5zM30 145h5v5h-5zM55 145h5v5h-5zM70 145h5v5h-5zM125 145h5v5h-5zM140 145h5v5h-5zM165 145h5v5h-5zM30 150h5v5h-5zM55 150h5v5h-5zM75 150h10v5h-10zM115 150h10v5h-10zM140 150h5v5h-5zM165 150h5v5h-5zM30 155h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM85 155h30v5h-30zM120 155h5v5h-5zM140 155h5v5h-5zM165 155h5v5h-5zM30 160h5v5h-5zM55 160h5v5h-5zM75 160h5v5h-5zM120 160h5v5h-5zM140 160h5v5h-5zM165 160h5v5h-5zM30 165h5v5h-5zM55 165h5v5h-5zM75 165h5v5h-5zM120 165h5v5h-5zM140 165h5v5h-5zM165 165h5v5h-5zM30 170h5v5h-5zM55 170h5v5h-5zM75 170h5