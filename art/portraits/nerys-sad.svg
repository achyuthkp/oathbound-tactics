<svg xmlns="http://www.w3.org/2000/svg" class="bust   " viewBox="0 0 200 240" width="400" height="480" shape-rendering="crispEdges" aria-hidden="true" style="--blink-delay:-4.654s"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><path fill="#1b1424" d="M45 5h10v5h-10zM145 5h10v5h-10zM40 10h5v5h-5zM55 10h5v5h-5zM140 10h5v5h-5zM155 10h5v5h-5zM40 15h5v5h-5zM60 15h5v5h-5zM135 15h5v5h-5zM155 15h5v5h-5zM45 20h5v5h-5zM60 20h5v5h-5zM135 20h5v5h-5zM150 20h5v5h-5zM45 25h5v5h-5zM65 25h70v5h-70zM150 25h5v5h-5zM50 30h5v5h-5zM65 30h5v5h-5zM130 30h5v5h-5zM145 30h5v5h-5zM50 35h5v5h-5zM145 35h5v5h-5zM50 40h10v5h-10zM140 40h10v5h-10zM40 45h10v5h-10zM150 45h10v5h-10zM35 50h5v5h-5zM45 50h5v5h-5zM150 50h5v5h-5zM160 50h5v5h-5zM35 55h5v5h-5zM45 55h5v5h-5zM95 55h15v5h-15zM150 55h5v5h-5zM160 55h5v5h-5zM35 60h10v5h-10zM85 60h10v5h-10zM110 60h10v5h-10zM155 60h10v5h-10zM35 65h10v5h-10zM75 65h10v5h-10zM120 65h10v5h-10zM155 65h10v5h-10zM35 70h10v5h-10zM65 70h10v5h-10zM130 70h10v5h-10zM155 70h10v5h-10zM35 75h10v5h-10zM60 75h5v5h-5zM135 75h5v5h-5zM155 75h10v5h-10zM35 80h10v5h-10zM60 80h5v5h-5zM135 80h5v5h-5zM155 80h10v5h-10zM35 85h10v5h-10zM155 85h10v5h-10zM35 90h10v5h-10zM60 90h25v5h-25zM115 90h25v5h-25zM155 90h10v5h-10zM35 95h10v5h-10zM60 95h10v5h-10zM130 95h10v5h-10zM155 95h10v5h-10zM35 100h10v5h-10zM60 100h5v5h-5zM135 100h5v5h-5zM155 100h10v5h-10zM35 105h10v5h-10zM60 105h5v5h-5zM135 105h5v5h-5zM155 105h10v5h-10zM35 110h10v5h-10zM60 110h5v5h-5zM135 110h5v5h-5zM155 110h10v5h-10zM35 115h10v5h-10zM60 115h5v5h-5zM135 115h5v5h-5zM155 115h10v5h-10zM35 120h10v5h-10zM60 120h5v5h-5zM135 120h5v5h-5zM155 120h10v5h-10zM35 125h10v5h-10zM60 125h5v5h-5zM135 125h5v5h-5zM155 125h10v5h-10zM35 130h10v5h-10zM60 130h5v5h-5zM135 130h5v5h-5zM155 130h10v5h-10zM35 135h10v5h-10zM60 135h5v5h-5zM135 135h5v5h-5zM155 135h10v5h-10zM35 140h10v5h-10zM60 140h10v5h-10zM130 140h10v5h-10zM155 140h10v5h-10zM35 145h10v5h-10zM60 145h5v5h-5zM70 145h5v5h-5zM125 145h5v5h-5zM135 145h5v5h-5zM155 145h10v5h-10zM35 150h10v5h-10zM60 150h5v5h-5zM75 150h10v5h-10zM115 150h10v5h-10zM135 150h5v5h-5zM155 150h10v5h-10zM35 155h10v5h-10zM60 155h5v5h-5zM75 155h5v5h-5zM85 155h30v5h-30zM120 155h5v5h-5zM135 155h5v5h-5zM155 155h10v5h-10zM35 160h10v5h-10zM60 160h5v5h-5zM