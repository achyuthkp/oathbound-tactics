<svg xmlns="http://www.w3.org/2000/svg" class="bust   " viewBox="0 0 200 240" width="400" height="480" shape-rendering="crispEdges" aria-hidden="true" style="--blink-delay:-2.604s"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><path fill="#1b1424" d="M80 20h5v5h-5zM90 20h5v5h-5zM105 20h5v5h-5zM115 20h5v5h-5zM65 25h15v5h-15zM85 25h5v5h-5zM95 25h10v5h-10zM110 25h5v5h-5zM120 25h15v5h-15zM60 30h5v5h-5zM135 30h5v5h-5zM55 35h5v5h-5zM140 35h5v5h-5zM50 40h5v5h-5zM145 40h5v5h-5zM45 45h5v5h-5zM150 45h5v5h-5zM45 50h5v5h-5zM150 50h5v5h-5zM45 55h5v5h-5zM150 55h5v5h-5zM45 60h5v5h-5zM75 60h5v5h-5zM90 60h5v5h-5zM100 60h5v5h-5zM115 60h5v5h-5zM150 60h5v5h-5zM45 65h5v5h-5zM60 65h5v5h-5zM70 65h10v5h-10zM85 65h5v5h-5zM95 65h5v5h-5zM105 65h5v5h-5zM115 65h10v5h-10zM130 65h5v5h-5zM150 65h5v5h-5zM45 70h5v5h-5zM60 70h10v5h-10zM110 70h5v5h-5zM125 70h5v5h-5zM135 70h5v5h-5zM150 70h5v5h-5zM45 75h5v5h-5zM55 75h5v5h-5zM140 75h5v5h-5zM150 75h5v5h-5zM45 80h5v5h-5zM55 80h5v5h-5zM140 80h5v5h-5zM150 80h5v5h-5zM45 85h5v5h-5zM55 85h5v5h-5zM140 85h5v5h-5zM150 85h5v5h-5zM40 90h10v5h-10zM55 90h5v5h-5zM65 90h20v5h-20zM115 90h20v5h-20zM140 90h5v5h-5zM150 90h10v5h-10zM40 95h10v5h-10zM55 95h15v5h-15zM130 95h15v5h-15zM150 95h10v5h-10zM40 100h10v5h-10zM55 100h5v5h-5zM140 100h5v5h-5zM150 100h10v5h-10zM40 105h10v5h-10zM55 105h10v5h-10zM135 105h10v5h-10zM150 105h10v5h-10zM45 110h5v5h-5zM65 110h5v5h-5zM130 110h5v5h-5zM150 110h5v5h-5zM45 115h5v5h-5zM65 115h5v5h-5zM130 115h5v5h-5zM150 115h5v5h-5zM50 120h5v5h-5zM65 120h70v5h-70zM145 120h5v5h-5zM55 125h5v5h-5zM140 125h5v5h-5zM55 130h5v5h-5zM80 130h40v5h-40zM140 130h5v5h-5zM60 135h5v5h-5zM80 135h10v5h-10zM110 135h10v5h-10zM135 135h5v5h-5zM65 140h5v5h-5zM130 140h5v5h-5zM70 145h5v5h-5zM125 145h5v5h-5zM75 150h10v5h-10zM115 150h10v5h-10zM75 155h10v5h-10zM115 155h10v5h-10zM75 160h5v5h-5zM85 160h30v5h-30zM120 160h5v5h-5zM75 165h5v5h-5zM120 165h5v5h-5zM75 170h5v5h-5zM120 170h5v5h-5zM50 175h30v5h-30zM120 175h30v5h-30zM30 180h20v5h-20zM150 180h20v5h-20zM20 185h10v5h-10zM170 185h10v5h-10zM10 190h10v5h-10zM180 190h10v5h-10zM5 195h5v5h-5zM190 195h5v5h-5zM5 200h5v5h-5zM190 200h5v5h-5zM5 205h5v5h-5zM190 205h5v5h-5zM5 210h5v5h-5zM190 210h5v5h-5zM5 215h5v5h-5zM190 215h5v5h-5zM5 220h5v5h-5zM190 220h5