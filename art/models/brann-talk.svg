<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-talk right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 0.38s step-end 0.000s infinite"><path fill="#1b1424" d="M60 35h10v5h-10zM75 35h15v5h-15zM55 40h5v5h-5zM70 40h5v5h-5zM90 40h10v5h-10zM50 45h5v5h-5zM100 45h5v5h-5zM45 50h5v5h-5zM100 50h5v5h-5zM50 55h5v5h-5zM100 55h5v5h-5zM45 60h5v5h-5zM100 60h5v5h-5zM50 65h5v5h-5zM100 65h5v5h-5zM145 65h10v5h-10zM50 70h5v5h-5zM100 70h5v5h-5zM140 70h5v5h-5zM155 70h5v5h-5zM50 75h5v5h-5zM100 75h5v5h-5zM135 75h5v5h-5zM160 75h5v5h-5zM55 80h5v5h-5zM95 80h5v5h-5zM130 80h5v5h-5zM165 80h5v5h-5zM55 85h10v5h-10zM90 85h10v5h-10zM125 85h5v5h-5zM160 85h5v5h-5zM50 90h5v5h-5zM65 90h5v5h-5zM85 90h10v5h-10zM100 90h5v5h-5zM120 90h5v5h-5zM165 90h5v5h-5zM45 95h10v5h-10zM70 95h15v5h-15zM95 95h10v5h-10zM115 95h5v5h-5zM130 95h10v5h-10zM160 95h5v5h-5zM45 100h10v5h-10zM80 100h5v5h-5zM100 100h5v5h-5zM110 100h5v5h-5zM125 100h5v5h-5zM140 100h20v5h-20zM45 105h10v5h-10zM85 105h5v5h-5zM105 105h5v5h-5zM120 105h5v5h-5zM45 110h10v5h-10zM90 110h5v5h-5zM110 110h10v5h-10zM40 115h5v5h-5zM50 115h5v5h-5zM95 115h5v5h-5zM110 115h5v5h-5zM40 120h5v5h-5zM50 120h5v5h-5zM90 120h5v5h-5zM100 120h10v5h-10zM45 125h60v5h-60zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#5a3a22" d="M60 40h10v5h-10zM75 40h15v5h-15zM55 45h45v5h-45zM50 50h15v5h-15zM75 50h25v5h-25zM55 55h45v5h-45zM50 60h25v5h-25zM80 60h15v5h-15zM60 65h10v5h-10zM60 70h5v5h-5zM85 75h15v5h-15zM70 80h25v5h-25zM65 85h25v5h-25zM70 90h15v5h-15z"></path><path fill="#8c7564" d="M65 50h10v5h-10z"></path><path fill="#d9a47c" d="M75 60h5v5h-5zM95 60h5v5h-5zM70 65h5v5h-5zM80 65h10v5h-10zM95 65h5v5h-5zM65 70h10v5h-10zM80 70h10v5h-10zM95 70h5v5h-5zM60 75h25v5h-25zM65 80h5