<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-hit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M60 35h25v5h-25zM55 40h5v5h-5zM85 40h10v5h-10zM40 45h15v5h-15zM95 45h5v5h-5zM35 50h5v5h-5zM95 50h5v5h-5zM30 55h5v5h-5zM95 55h5v5h-5zM30 60h5v5h-5zM45 60h5v5h-5zM95 60h5v5h-5zM30 65h5v5h-5zM45 65h5v5h-5zM95 65h5v5h-5zM30 70h5v5h-5zM45 70h5v5h-5zM95 70h5v5h-5zM130 70h10v5h-10zM30 75h5v5h-5zM45 75h5v5h-5zM95 75h5v5h-5zM125 75h5v5h-5zM140 75h5v5h-5zM35 80h5v5h-5zM45 80h10v5h-10zM90 80h5v5h-5zM120 80h5v5h-5zM135 80h5v5h-5zM35 85h5v5h-5zM45 85h5v5h-5zM55 85h5v5h-5zM85 85h5v5h-5zM115 85h5v5h-5zM130 85h5v5h-5zM40 90h5v5h-5zM50 90h5v5h-5zM60 90h25v5h-25zM90 90h5v5h-5zM110 90h5v5h-5zM125 90h5v5h-5zM45 95h10v5h-10zM70 95h5v5h-5zM85 95h15v5h-15zM105 95h5v5h-5zM120 95h5v5h-5zM45 100h10v5h-10zM70 100h5v5h-5zM90 100h5v5h-5zM100 100h5v5h-5zM115 100h5v5h-5zM45 105h10v5h-10zM75 105h5v5h-5zM95 105h5v5h-5zM105 105h10v5h-10zM45 110h10v5h-10zM80 110h5v5h-5zM100 110h5v5h-5zM110 110h5v5h-5zM40 115h5v5h-5zM50 115h5v5h-5zM85 115h5v5h-5zM100 115h10v5h-10zM40 120h5v5h-5zM50 120h5v5h-5zM90 120h10v5h-10zM45 125h45v5h-45zM95 125h5v5h-5zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#1c1b2b" d="M60 40h25v5h-25zM55 45h10v5h-10zM75 45h20v5h-20zM40 50h55v5h-55zM35 55h10v5h-10zM50 55h45v5h-45zM35 60h10v5h-10zM50 60h20v5h-20zM80 60h10v5h-10zM35 65h10v5h-10zM55 65h10v5h-10zM40 70h5v5h-5zM60 70h5v5h-5zM40 75h5v5h-5z"></path><path fill="#605f6b" d="M65 45h10v5h-10z"></path><path fill="#191526" d="M45 55h5v5h-5zM50 65h5v5h-5zM35 70h5v5h-5zM55 70h5v5h-5zM35 75h5v5h-5zM55 75h5v5h-5zM40 80h5v5h-5zM40 85h5v5h-5z"></path><path fill="#f1d3b6" d="M70 60h10v5h-10zM90