<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-victory right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 0.9s step-end 0.000s infinite"><path fill="#1b1424" d="M95 -10h5v5h-5zM90 -5h5v5h-5zM100 -5h5v5h-5zM60 0h25v5h-25zM90 0h5v5h-5zM100 0h5v5h-5zM55 5h5v5h-5zM85 5h10v5h-10zM100 5h5v5h-5zM50 10h5v5h-5zM90 10h5v5h-5zM100 10h5v5h-5zM45 15h5v5h-5zM90 15h5v5h-5zM100 15h5v5h-5zM45 20h5v5h-5zM90 20h5v5h-5zM100 20h5v5h-5zM45 25h5v5h-5zM90 25h5v5h-5zM100 25h5v5h-5zM45 30h5v5h-5zM90 30h5v5h-5zM100 30h5v5h-5zM45 35h5v5h-5zM85 35h15v5h-15zM105 35h5v5h-5zM45 40h5v5h-5zM85 40h5v5h-5zM100 40h5v5h-5zM50 45h5v5h-5zM85 45h5v5h-5zM100 45h10v5h-10zM120 45h5v5h-5zM130 45h5v5h-5zM55 50h5v5h-5zM80 50h5v5h-5zM100 50h5v5h-5zM110 50h10v5h-10zM125 50h5v5h-5zM135 50h5v5h-5zM50 55h5v5h-5zM60 55h20v5h-20zM95 55h5v5h-5zM135 55h10v5h-10zM45 60h10v5h-10zM70 60h5v5h-5zM90 60h5v5h-5zM145 60h5v5h-5zM45 65h10v5h-10zM70 65h5v5h-5zM85 65h10v5h-10zM150 65h5v5h-5zM45 70h10v5h-10zM75 70h10v5h-10zM90 70h5v5h-5zM155 70h5v5h-5zM45 75h10v5h-10zM90 75h5v5h-5zM155 75h5v5h-5zM40 80h5v5h-5zM50 80h5v5h-5zM65 80h15v5h-15zM90 80h5v5h-5zM120 80h10v5h-10zM150 80h5v5h-5zM30 85h15v5h-15zM50 85h5v5h-5zM60 85h5v5h-5zM80 85h5v5h-5zM90 85h5v5h-5zM120 85h5v5h-5zM130 85h20v5h-20zM10 90h20v5h-20zM40 90h25v5h-25zM85 90h10v5h-10zM115 90h5v5h-5zM5 95h5v5h-5zM40 95h5v5h-5zM60 95h5v5h-5zM85 95h10v5h-10zM115 95h5v5h-5zM5 100h5v5h-5zM40 100h5v5h-5zM65 100h5v5h-5zM90 100h5v5h-5zM115 100h5v5h-5zM0 105h5v5h-5zM40 105h5v5h-5zM65 105h5v5h-5zM90 105h5v5h-5zM115 105h5v5h-5zM0 110h5v5h-5zM45 110h30v5h-30zM90 110h5v5h-5zM115 110h5v5h-5zM0 115h5v5h-5zM75 115h5v5h-5zM90 115h10v5h-10zM115 115h5v5h-5zM0 120h5v5h-5zM15 120h5v5h-5zM75 120h5v5h-5zM100 120h5v5h-5zM115 120h5v5h-5zM0 125h5v5h-5zM15 125h10v5h-10zM70 125h5v5h-5zM105 125h5v5h-5zM115 125h5v5h-5zM0 130h5v5h-5zM15 130h5v5h-5zM25 130h10v5h-10zM50 130h55v5h-55zM115 130h5v5h-5zM0 135h5v5h-5zM15 135h5v5h-5zM30 135h5v5h-5zM50 135h5v5h-5zM60