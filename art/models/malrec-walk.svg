<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-walk right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl4 0.56s step-end 0.000s infinite"><path fill="#1b1424" d="M60 25h5v5h-5zM70 25h5v5h-5zM80 25h5v5h-5zM90 25h5v5h-5zM55 30h5v5h-5zM65 30h5v5h-5zM75 30h5v5h-5zM85 30h5v5h-5zM95 30h5v5h-5zM55 35h5v5h-5zM95 35h5v5h-5zM60 40h5v5h-5zM90 40h5v5h-5zM55 45h5v5h-5zM95 45h5v5h-5zM50 50h5v5h-5zM100 50h5v5h-5zM50 55h5v5h-5zM100 55h5v5h-5zM50 60h5v5h-5zM100 60h5v5h-5zM50 65h5v5h-5zM100 65h5v5h-5zM50 70h5v5h-5zM100 70h5v5h-5zM140 70h10v5h-10zM50 75h5v5h-5zM100 75h5v5h-5zM135 75h5v5h-5zM150 75h5v5h-5zM55 80h5v5h-5zM95 80h5v5h-5zM130 80h5v5h-5zM145 80h5v5h-5zM55 85h10v5h-10zM90 85h10v5h-10zM125 85h5v5h-5zM140 85h5v5h-5zM50 90h5v5h-5zM65 90h25v5h-25zM95 90h10v5h-10zM120 90h5v5h-5zM135 90h5v5h-5zM45 95h10v5h-10zM80 95h5v5h-5zM95 95h15v5h-15zM115 95h5v5h-5zM130 95h5v5h-5zM45 100h10v5h-10zM80 100h5v5h-5zM100 100h5v5h-5zM110 100h5v5h-5zM125 100h5v5h-5zM45 105h10v5h-10zM85 105h5v5h-5zM105 105h5v5h-5zM115 105h10v5h-10zM45 110h10v5h-10zM90 110h5v5h-5zM110 110h5v5h-5zM120 110h5v5h-5zM45 115h10v5h-10zM95 115h5v5h-5zM110 115h10v5h-10zM40 120h5v5h-5zM50 120h5v5h-5zM100 120h10v5h-10zM40 125h5v5h-5zM50 125h55v5h-55zM35 130h5v5h-5zM50 130h5v5h-5zM70 130h15v5h-15zM100 130h5v5h-5zM30 135h5v5h-5zM50 135h5v5h-5zM70 135h15v5h-15zM100 135h5v5h-5zM30 140h5v5h-5zM45 140h5v5h-5zM65 140h5v5h-5zM75 140h5v5h-5zM85 140h5v5h-5zM105 140h5v5h-5zM30 145h5v5h-5zM45 145h5v5h-5zM65 145h5v5h-5zM75 145h5v5h-5zM85 145h5v5h-5zM105 145h5v5h-5zM35 150h15v5h-15zM70 150h5v5h-5zM85 150h5v5h-5zM110 150h5v5h-5zM45 155h5v5h-5zM70 155h5v5h-5zM85 155h5v5h-5zM110 155h5v5h-5zM50 160h20v5h-20zM90 160h20v5h-20z"></path><path fill="#e2be55" d="M60 30h5v5h-5zM70 30h5v5h-5zM80 30h5v5h-5zM90 30h5v5h-5zM60 35h35v5h-35z"></path><path fill="#c4c4c4" d="M65 40h25v5h-25zM60 45h5v5h-5zM75 45h20v5h-20zM55 50h45v5h-45zM55 55h35v5h-35zM55 60h15v5h-15zM60 65h5v5h-5zM60 70h5v5h-5z"></path><pa