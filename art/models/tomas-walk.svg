<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-walk right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl4 0.56s step-end 0.000s infinite"><path fill="#1b1424" d="M75 25h15v5h-15zM65 30h10v5h-10zM90 30h5v5h-5zM110 30h5v5h-5zM60 35h5v5h-5zM85 35h5v5h-5zM105 35h5v5h-5zM115 35h5v5h-5zM60 40h5v5h-5zM90 40h10v5h-10zM105 40h5v5h-5zM115 40h5v5h-5zM55 45h5v5h-5zM100 45h5v5h-5zM120 45h5v5h-5zM50 50h5v5h-5zM100 50h10v5h-10zM115 50h5v5h-5zM50 55h5v5h-5zM100 55h5v5h-5zM115 55h5v5h-5zM50 60h5v5h-5zM95 60h5v5h-5zM115 60h5v5h-5zM50 65h5v5h-5zM100 65h10v5h-10zM115 65h5v5h-5zM50 70h5v5h-5zM100 70h10v5h-10zM115 70h5v5h-5zM50 75h5v5h-5zM100 75h10v5h-10zM115 75h5v5h-5zM55 80h5v5h-5zM95 80h5v5h-5zM105 80h5v5h-5zM115 80h5v5h-5zM55 85h10v5h-10zM80 85h20v5h-20zM105 85h5v5h-5zM115 85h5v5h-5zM50 90h5v5h-5zM65 90h15v5h-15zM100 90h10v5h-10zM115 90h5v5h-5zM45 95h10v5h-10zM75 95h5v5h-5zM100 95h10v5h-10zM115 95h5v5h-5zM45 100h10v5h-10zM80 100h5v5h-5zM105 100h15v5h-15zM50 105h5v5h-5zM85 105h5v5h-5zM115 105h5v5h-5zM50 110h5v5h-5zM90 110h10v5h-10zM115 110h5v5h-5zM50 115h5v5h-5zM100 115h20v5h-20zM50 120h5v5h-5zM100 120h10v5h-10zM115 120h5v5h-5zM50 125h60v5h-60zM115 125h5v5h-5zM50 130h5v5h-5zM70 130h5v5h-5zM80 130h5v5h-5zM100 130h10v5h-10zM115 130h5v5h-5zM50 135h5v5h-5zM70 135h5v5h-5zM80 135h5v5h-5zM100 135h10v5h-10zM115 135h5v5h-5zM45 140h5v5h-5zM65 140h5v5h-5zM85 140h5v5h-5zM105 140h5v5h-5zM115 140h5v5h-5zM45 145h5v5h-5zM65 145h5v5h-5zM85 145h5v5h-5zM105 145h5v5h-5zM115 145h5v5h-5zM45 150h5v5h-5zM70 150h5v5h-5zM85 150h5v5h-5zM110 150h5v5h-5zM45 155h5v5h-5zM70 155h5v5h-5zM85 155h5v5h-5zM110 155h5v5h-5zM50 160h20v5h-20zM90 160h20v5h-20z"></path><path fill="#2c4f9c" d="M75 30h15v5h-15zM65 35h20v5h-20zM105 55h5v5h-5zM100 60h10v5h-10zM75 100h5v5h-5zM75 105h5v5h-5zM75 110h5v5h-5zM75 115h5v5h-5zM75 120h5v5h-5z"></path><path fill="#e4ebf3" d="M110 35h5v5h-5zM110 40h5v5h-5zM105 45h15v5h-15z"></path><path fill="#aab3c2" d="M65 40h25v5h-25zM60 45h10v5h-10