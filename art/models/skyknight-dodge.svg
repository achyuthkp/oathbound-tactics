<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-dodge right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M45 -15h10v5h-10zM40 -10h5v5h-5zM55 -10h5v5h-5zM35 -5h5v5h-5zM60 -5h20v5h-20zM160 -5h10v5h-10zM35 0h5v5h-5zM80 0h10v5h-10zM145 0h5v5h-5zM155 0h5v5h-5zM170 0h5v5h-5zM40 5h5v5h-5zM90 5h5v5h-5zM140 5h5v5h-5zM150 5h5v5h-5zM165 5h5v5h-5zM40 10h5v5h-5zM90 10h5v5h-5zM125 10h5v5h-5zM135 10h5v5h-5zM145 10h5v5h-5zM160 10h5v5h-5zM40 15h5v5h-5zM90 15h5v5h-5zM120 15h5v5h-5zM130 15h5v5h-5zM140 15h5v5h-5zM160 15h5v5h-5zM40 20h5v5h-5zM90 20h5v5h-5zM125 20h5v5h-5zM135 20h5v5h-5zM150 20h10v5h-10zM40 25h5v5h-5zM90 25h5v5h-5zM130 25h5v5h-5zM145 25h5v5h-5zM40 30h5v5h-5zM90 30h5v5h-5zM125 30h5v5h-5zM140 30h5v5h-5zM15 35h5v5h-5zM40 35h5v5h-5zM90 35h5v5h-5zM120 35h5v5h-5zM135 35h5v5h-5zM10 40h5v5h-5zM20 40h5v5h-5zM45 40h5v5h-5zM85 40h5v5h-5zM115 40h5v5h-5zM130 40h5v5h-5zM10 45h5v5h-5zM25 45h10v5h-10zM50 45h5v5h-5zM80 45h5v5h-5zM110 45h5v5h-5zM125 45h5v5h-5zM10 50h5v5h-5zM35 50h5v5h-5zM45 50h5v5h-5zM55 50h25v5h-25zM85 50h5v5h-5zM105 50h5v5h-5zM120 50h5v5h-5zM130 50h10v5h-10zM15 55h5v5h-5zM40 55h10v5h-10zM55 55h5v5h-5zM65 55h5v5h-5zM80 55h10v5h-10zM100 55h5v5h-5zM115 55h5v5h-5zM140 55h5v5h-5zM15 60h5v5h-5zM40 60h10v5h-10zM55 60h5v5h-5zM65 60h5v5h-5zM85 60h5v5h-5zM95 60h5v5h-5zM110 60h5v5h-5zM145 60h5v5h-5zM20 65h5v5h-5zM40 65h10v5h-10zM55 65h5v5h-5zM70 65h5v5h-5zM90 65h5v5h-5zM105 65h5v5h-5zM120 65h5v5h-5zM145 65h5v5h-5zM20 70h5v5h-5zM40 70h10v5h-10zM60 70h5v5h-5zM75 70h5v5h-5zM95 70h10v5h-10zM130 70h15v5h-15zM25 75h5v5h-5zM35 75h5v5h-5zM45 75h5v5h-5zM60 75h5v5h-5zM80 75h5v5h-5zM95 75h10v5h-10zM130 75h5v5h-5zM30 80h10v5h-10zM45 80h5v5h-5zM65 80h5v5h-5zM75 80h5v5h-5zM85 80h15v5h-15zM130 80h5v5h-5zM35 85h40v5h-40zM85 85h15v5h-15zM125 85h5v5h-5zM25 90h10v5h-10zM45 90h15v5h-15zM65 90h5v5h-5zM80 90h5v5h-5zM90 90h5v5h-5zM125 90h5v5h-5zM20 95h5v5h-5zM70 95h20v5h-20zM120 95h5v5h-5zM20 100h5v5h-5zM120 100h5v5h