<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-dodge right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M70 25h15v5h-15zM60 30h10v5h-10zM85 30h5v5h-5zM105 30h5v5h-5zM55 35h5v5h-5zM80 35h5v5h-5zM100 35h5v5h-5zM110 35h5v5h-5zM55 40h5v5h-5zM85 40h10v5h-10zM100 40h5v5h-5zM110 40h5v5h-5zM50 45h5v5h-5zM95 45h5v5h-5zM115 45h5v5h-5zM45 50h5v5h-5zM95 50h10v5h-10zM110 50h5v5h-5zM45 55h5v5h-5zM95 55h5v5h-5zM110 55h5v5h-5zM45 60h5v5h-5zM90 60h5v5h-5zM110 60h5v5h-5zM45 65h5v5h-5zM95 65h10v5h-10zM110 65h5v5h-5zM45 70h5v5h-5zM95 70h10v5h-10zM110 70h5v5h-5zM45 75h5v5h-5zM95 75h10v5h-10zM110 75h5v5h-5zM50 80h5v5h-5zM90 80h5v5h-5zM100 80h5v5h-5zM110 80h5v5h-5zM50 85h10v5h-10zM75 85h20v5h-20zM100 85h5v5h-5zM110 85h5v5h-5zM45 90h5v5h-5zM60 90h15v5h-15zM95 90h10v5h-10zM110 90h5v5h-5zM40 95h10v5h-10zM70 95h5v5h-5zM95 95h10v5h-10zM110 95h5v5h-5zM40 100h10v5h-10zM75 100h5v5h-5zM100 100h15v5h-15zM40 105h10v5h-10zM80 105h5v5h-5zM110 105h5v5h-5zM40 110h10v5h-10zM85 110h10v5h-10zM110 110h5v5h-5zM35 115h5v5h-5zM45 115h5v5h-5zM95 115h20v5h-20zM35 120h5v5h-5zM45 120h5v5h-5zM95 120h10v5h-10zM110 120h5v5h-5zM40 125h65v5h-65zM110 125h5v5h-5zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h10v5h-10zM110 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h10v5h-10zM110 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h10v5h-10zM110 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h10v5h-10zM110 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h10v5h-10zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#c23b3b" d="M70 30h15v5h-15zM60 35h20v5h-20zM100 55h5v5h-5zM95 60h10v5h-10zM70 100h5v5h-5zM70 105h5v5h-5zM70 110h5v5h-5zM70 115h5v5h-5zM70 120h5v5h-5z"></path><path fill="#e4ebf3" d="M105 35h5v5h-5zM105 40h5v5h-5zM100 45h15v5h-15z"></path><path fill="#aab3c2" d="M60 40h25v5h-25zM55 45h10v5h-10zM70 45h25v5h-25zM50 50h45v5h-45zM50 55h45v5h-45zM50 65h10v5h-10zM50 70h10v5h-10zM55 90h5v5h-5zM55 95h10v5h-