<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-dodge right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M55 5h25v5h-25zM50 10h5v5h-5zM80 10h10v5h-10zM45 15h5v5h-5zM90 15h5v5h-5zM40 20h5v5h-5zM90 20h5v5h-5zM40 25h5v5h-5zM90 25h5v5h-5zM40 30h5v5h-5zM90 30h5v5h-5zM40 35h5v5h-5zM90 35h5v5h-5zM40 40h5v5h-5zM90 40h5v5h-5zM125 40h10v5h-10zM40 45h5v5h-5zM90 45h5v5h-5zM120 45h5v5h-5zM135 45h5v5h-5zM45 50h5v5h-5zM85 50h5v5h-5zM115 50h5v5h-5zM130 50h5v5h-5zM50 55h5v5h-5zM80 55h5v5h-5zM110 55h5v5h-5zM125 55h5v5h-5zM45 60h5v5h-5zM55 60h25v5h-25zM85 60h5v5h-5zM105 60h5v5h-5zM120 60h5v5h-5zM130 60h10v5h-10zM40 65h10v5h-10zM55 65h5v5h-5zM65 65h5v5h-5zM80 65h15v5h-15zM100 65h5v5h-5zM115 65h5v5h-5zM140 65h5v5h-5zM40 70h10v5h-10zM55 70h5v5h-5zM65 70h5v5h-5zM85 70h5v5h-5zM95 70h5v5h-5zM110 70h5v5h-5zM145 70h5v5h-5zM40 75h10v5h-10zM55 75h5v5h-5zM70 75h5v5h-5zM90 75h5v5h-5zM100 75h10v5h-10zM120 75h5v5h-5zM145 75h5v5h-5zM40 80h10v5h-10zM60 80h5v5h-5zM75 80h5v5h-5zM95 80h5v5h-5zM105 80h5v5h-5zM130 80h15v5h-15zM35 85h5v5h-5zM45 85h5v5h-5zM60 85h5v5h-5zM80 85h5v5h-5zM95 85h10v5h-10zM130 85h5v5h-5zM35 90h5v5h-5zM45 90h5v5h-5zM65 90h5v5h-5zM85 90h15v5h-15zM130 90h5v5h-5zM35 95h35v5h-35zM90 95h10v5h-10zM125 95h5v5h-5zM25 100h10v5h-10zM65 100h5v5h-5zM90 100h5v5h-5zM125 100h5v5h-5zM20 105h5v5h-5zM70 105h20v5h-20zM120 105h5v5h-5zM20 110h5v5h-5zM120 110h5v5h-5zM15 115h5v5h-5zM115 115h5v5h-5zM15 120h5v5h-5zM110 120h5v5h-5zM15 125h5v5h-5zM30 125h5v5h-5zM105 125h5v5h-5zM10 130h5v5h-5zM30 130h10v5h-10zM50 130h45v5h-45zM105 130h5v5h-5zM10 135h5v5h-5zM25 135h5v5h-5zM35 135h5v5h-5zM50 135h5v5h-5zM60 135h5v5h-5zM80 135h5v5h-5zM90 135h5v5h-5zM105 135h5v5h-5zM10 140h5v5h-5zM25 140h5v5h-5zM35 140h5v5h-5zM50 140h5v5h-5zM65 140h5v5h-5zM85 140h10v5h-10zM105 140h5v5h-5zM15 145h10v5h-10zM35 145h5v5h-5zM50 145h5v5h-5zM65 145h5v5h-5zM85 145h10v5h-10zM105 145h5v5h-5zM35 150h5v5h-5zM50 150h5v5h-5zM65 150h5v5h-5zM85 150h10v5h-10zM