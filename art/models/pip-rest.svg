<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-rest right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M70 55h25v5h-25zM60 60h10v5h-10zM95 60h10v5h-10zM55 65h5v5h-5zM105 65h5v5h-5zM50 70h5v5h-5zM110 70h5v5h-5zM50 75h5v5h-5zM110 75h5v5h-5zM50 80h5v5h-5zM105 80h5v5h-5zM50 85h5v5h-5zM105 85h5v5h-5zM135 85h10v5h-10zM50 90h5v5h-5zM105 90h5v5h-5zM130 90h5v5h-5zM145 90h5v5h-5zM50 95h5v5h-5zM105 95h5v5h-5zM125 95h5v5h-5zM140 95h5v5h-5zM50 100h5v5h-5zM100 100h5v5h-5zM120 100h5v5h-5zM135 100h5v5h-5zM50 105h10v5h-10zM80 105h10v5h-10zM95 105h5v5h-5zM115 105h5v5h-5zM130 105h5v5h-5zM50 110h10v5h-10zM75 110h5v5h-5zM90 110h15v5h-15zM110 110h5v5h-5zM125 110h5v5h-5zM45 115h35v5h-35zM95 115h5v5h-5zM105 115h5v5h-5zM120 115h5v5h-5zM40 120h5v5h-5zM50 120h10v5h-10zM80 120h5v5h-5zM100 120h5v5h-5zM110 120h10v5h-10zM40 125h5v5h-5zM50 125h10v5h-10zM85 125h5v5h-5zM105 125h5v5h-5zM115 125h5v5h-5zM40 130h10v5h-10zM55 130h5v5h-5zM90 130h5v5h-5zM105 130h10v5h-10zM45 135h5v5h-5zM55 135h5v5h-5zM95 135h10v5h-10zM50 140h50v5h-50zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#3a4a3a" d="M70 60h25v5h-25zM60 65h45v5h-45zM55 70h55v5h-55zM55 75h15v5h-15zM100 75h10v5h-10zM55 80h10v5h-10zM55 85h5v5h-5zM55 90h5v5h-5zM55 95h5v5h-5zM55 100h5v5h-5zM60 105h5v5h-5zM60 110h15v5h-15zM80 110h10v5h-10zM80 115h15v5h-15zM65 120h10v5h-10zM85 120h15v5h-15zM65 125h15v5h-15zM90 125h5v5h-5zM75 130h5v5h-5z"></path><path fill="#c9a45a" d="M70 75h30v5h-30zM65 80h5v5h-5zM100 80h5v5h-5zM65 85h5v5h-5zM65 90h5v5h-5zM65 95h5v5h-5zM70 100h5v5h-5zM75 105h5v5h-5zM100 115h5v5h-5zM105 120h5v5h-5zM110 125h5v5h-5zM75 135h5v5h-5z"></path><path fill="#6a4a2a" d="M70 80h20v5h-20zM95 80h5v5h-5z"></path><path fill="#e2b591" d="M90 80h5v5h-5zM70 85h10v5h-10zM85 85h10v5h-10zM100 85h5v5h-5zM70 90h10v5h-10zM85 90h10v5h-10zM100 90h5v5