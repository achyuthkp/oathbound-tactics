<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-hit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M60 35h25v5h-25zM50 40h10v5h-10zM85 40h10v5h-10zM45 45h5v5h-5zM95 45h5v5h-5zM40 50h5v5h-5zM100 50h5v5h-5zM40 55h5v5h-5zM100 55h5v5h-5zM40 60h5v5h-5zM95 60h5v5h-5zM40 65h5v5h-5zM95 65h5v5h-5zM40 70h5v5h-5zM95 70h5v5h-5zM40 75h5v5h-5zM95 75h5v5h-5zM40 80h5v5h-5zM90 80h25v5h-25zM45 85h5v5h-5zM85 85h5v5h-5zM115 85h5v5h-5zM45 90h5v5h-5zM70 90h20v5h-20zM115 90h5v5h-5zM45 95h30v5h-30zM85 95h20v5h-20zM115 95h5v5h-5zM45 100h10v5h-10zM70 100h5v5h-5zM105 100h10v5h-10zM45 105h10v5h-10zM75 105h5v5h-5zM105 105h5v5h-5zM45 110h10v5h-10zM80 110h25v5h-25zM40 115h5v5h-5zM50 115h5v5h-5zM90 115h5v5h-5zM40 120h5v5h-5zM50 120h5v5h-5zM90 120h5v5h-5zM45 125h15v5h-15zM95 125h5v5h-5zM55 130h5v5h-5zM95 130h5v5h-5zM50 135h5v5h-5zM100 135h5v5h-5zM50 140h5v5h-5zM100 140h5v5h-5zM50 145h5v5h-5zM100 145h5v5h-5zM45 150h5v5h-5zM105 150h5v5h-5zM45 155h5v5h-5zM105 155h5v5h-5zM50 160h55v5h-55z"></path><path fill="#2a2a34" d="M60 40h25v5h-25zM50 45h45v5h-45zM45 50h55v5h-55zM45 55h15v5h-15zM90 55h10v5h-10zM45 60h10v5h-10zM45 65h5v5h-5zM45 70h5v5h-5zM45 75h5v5h-5zM45 80h5v5h-5zM50 85h5v5h-5zM50 90h20v5h-20zM75 95h10v5h-10zM60 100h10v5h-10zM75 100h20v5h-20zM60 105h15v5h-15zM80 105h15v5h-15zM60 110h20v5h-20zM60 115h30v5h-30zM65 125h30v5h-30zM65 130h30v5h-30zM60 135h40v5h-40zM60 140h40v5h-40zM60 145h40v5h-40zM55 155h50v5h-50z"></path><path fill="#c46a2a" d="M60 55h30v5h-30zM55 60h5v5h-5zM90 60h5v5h-5zM55 65h5v5h-5zM55 70h5v5h-5zM55 75h5v5h-5zM60 80h5v5h-5zM65 85h5v5h-5zM70 120h5v5h-5zM55 150h50v5h-50z"></path><path fill="#2a2420" d="M60 60h20v5h-20zM85 60h5v5h-5z"></path><path fill="#e2b591" d="M80 60h5v5h-5zM60 65h35v5h-35zM60 70h5v5h-5zM75 70h5v5h-5zM90 70h5v5h-5zM60 75h35v5h-35zM65 80h10v5h-10zM85 80h5v5h-5zM70 85h15v5h-15zM95 100h10v5h-10zM95 105h10v5h-10z"></path><path fill="#23202d" d="M50 65h5v5h-5zM50 70h5v5h-5zM