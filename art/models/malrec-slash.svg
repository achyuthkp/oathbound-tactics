<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-slash right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr" style="animation:frShow 0.240s step-end 0s 1"><path fill="#1b1424" d="M55 25h5v5h-5zM65 25h5v5h-5zM75 25h5v5h-5zM85 25h5v5h-5zM50 30h5v5h-5zM60 30h5v5h-5zM70 30h5v5h-5zM80 30h5v5h-5zM90 30h5v5h-5zM50 35h5v5h-5zM65 35h10v5h-10zM90 35h5v5h-5zM55 40h10v5h-10zM75 40h5v5h-5zM85 40h5v5h-5zM50 45h5v5h-5zM65 45h5v5h-5zM80 45h5v5h-5zM90 45h5v5h-5zM45 50h5v5h-5zM70 50h5v5h-5zM85 50h5v5h-5zM95 50h5v5h-5zM45 55h5v5h-5zM75 55h5v5h-5zM90 55h10v5h-10zM45 60h5v5h-5zM80 60h5v5h-5zM95 60h10v5h-10zM45 65h5v5h-5zM85 65h5v5h-5zM105 65h5v5h-5zM45 70h5v5h-5zM90 70h15v5h-15zM45 75h5v5h-5zM85 75h10v5h-10zM105 75h5v5h-5zM50 80h5v5h-5zM90 80h5v5h-5zM105 80h10v5h-10zM50 85h10v5h-10zM85 85h5v5h-5zM105 85h5v5h-5zM45 90h5v5h-5zM60 90h25v5h-25zM100 90h5v5h-5zM40 95h10v5h-10zM75 95h5v5h-5zM95 95h5v5h-5zM40 100h10v5h-10zM75 100h5v5h-5zM90 100h10v5h-10zM40 105h10v5h-10zM80 105h10v5h-10zM95 105h5v5h-5zM40 110h10v5h-10zM95 110h5v5h-5zM35 115h5v5h-5zM45 115h5v5h-5zM95 115h5v5h-5zM35 120h5v5h-5zM45 120h5v5h-5zM95 120h5v5h-5zM35 125h65v5h-65zM35 130h5v5h-5zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h5v5h-5zM30 135h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM30 140h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM30 145h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM35 150h25v5h-25zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#e2be55" d="M55 30h5v5h-5zM65 30h5v5h-5zM75 30h5v5h-5zM85 30h5v5h-5zM55 35h10v5h-10zM75 35h15v5h-15z"></path><path fill="#e4ebf3" d="M65 40h10v5h-10zM70 45h10v5h-10zM75 50h10v5h-10zM80 55h10v5h-10zM85 60h10v5h-10zM90 65h10v5h-10z"></path><path fill="#c4c4c4" d="M80 40h5v5h-5zM55 45h5v5h-5zM85 45h5v5h-5zM50 50h20v5h-20zM90 50h5v5h-5zM50 55h25v5h-25zM50 60h15v5h-15zM55 65h5v5h-5zM55 70h5v5h-5z"></path><path fill="#d6d6d6" d="M60 45h5v5h-5z"></path><path fill="#e0c0a8" d=