<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-thrust right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr" style="animation:frShow 0.220s step-end 0s 1"><path fill="#1b1424" d="M45 -15h10v5h-10zM40 -10h5v5h-5zM55 -10h5v5h-5zM35 -5h5v5h-5zM60 -5h20v5h-20zM35 0h5v5h-5zM80 0h10v5h-10zM40 5h5v5h-5zM90 5h5v5h-5zM40 10h5v5h-5zM90 10h5v5h-5zM40 15h5v5h-5zM90 15h5v5h-5zM40 20h5v5h-5zM90 20h5v5h-5zM40 25h5v5h-5zM90 25h5v5h-5zM40 30h5v5h-5zM90 30h5v5h-5zM15 35h5v5h-5zM40 35h5v5h-5zM90 35h5v5h-5zM10 40h5v5h-5zM20 40h5v5h-5zM45 40h5v5h-5zM85 40h5v5h-5zM120 40h5v5h-5zM10 45h5v5h-5zM25 45h10v5h-10zM50 45h5v5h-5zM80 45h5v5h-5zM115 45h5v5h-5zM125 45h5v5h-5zM10 50h5v5h-5zM35 50h5v5h-5zM45 50h5v5h-5zM55 50h25v5h-25zM85 50h5v5h-5zM110 50h10v5h-10zM130 50h10v5h-10zM15 55h5v5h-5zM40 55h10v5h-10zM55 55h5v5h-5zM65 55h5v5h-5zM80 55h10v5h-10zM110 55h5v5h-5zM120 55h5v5h-5zM130 55h5v5h-5zM140 55h5v5h-5zM15 60h5v5h-5zM30 60h40v5h-40zM80 60h35v5h-35zM125 60h5v5h-5zM135 60h15v5h-15zM20 65h10v5h-10zM60 65h5v5h-5zM80 65h5v5h-5zM145 65h5v5h-5zM20 70h5v5h-5zM30 70h35v5h-35zM75 70h55v5h-55zM135 70h10v5h-10zM25 75h5v5h-5zM35 75h5v5h-5zM45 75h5v5h-5zM60 75h15v5h-15zM85 75h5v5h-5zM100 75h5v5h-5zM130 75h5v5h-5zM30 80h10v5h-10zM45 80h5v5h-5zM65 80h5v5h-5zM85 80h5v5h-5zM95 80h5v5h-5zM130 80h5v5h-5zM35 85h35v5h-35zM90 85h10v5h-10zM125 85h5v5h-5zM25 90h10v5h-10zM45 90h15v5h-15zM65 90h5v5h-5zM90 90h5v5h-5zM125 90h5v5h-5zM20 95h5v5h-5zM70 95h20v5h-20zM120 95h5v5h-5zM20 100h5v5h-5zM120 100h5v5h-5zM15 105h5v5h-5zM115 105h5v5h-5zM15 110h5v5h-5zM110 110h5v5h-5zM15 115h5v5h-5zM30 115h5v5h-5zM105 115h5v5h-5zM10 120h5v5h-5zM30 120h5v5h-5zM45 120h55v5h-55zM110 120h5v5h-5zM10 125h5v5h-5zM25 125h10v5h-10zM45 125h5v5h-5zM55 125h5v5h-5zM90 125h10v5h-10zM110 125h5v5h-5zM10 130h5v5h-5zM25 130h10v5h-10zM45 130h5v5h-5zM55 130h5v5h-5zM90 130h10v5h-10zM110 130h5v5h-5zM15 135h15v5h-15zM40 135h5v5h-5zM55 135h5v5h-5zM95 135h10v5h-10zM115 135h5v5h-5zM25 140h5v5h-5zM40 140h5v5h-5zM55 140h5v5h-5zM95 140