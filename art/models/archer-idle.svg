<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-idle right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 1.2s step-end 0.000s infinite"><path fill="#1b1424" d="M65 35h25v5h-25zM55 40h10v5h-10zM90 40h10v5h-10zM50 45h5v5h-5zM100 45h5v5h-5zM45 50h5v5h-5zM105 50h5v5h-5zM45 55h5v5h-5zM105 55h5v5h-5zM45 60h5v5h-5zM100 60h5v5h-5zM45 65h5v5h-5zM100 65h5v5h-5zM45 70h5v5h-5zM100 70h10v5h-10zM45 75h5v5h-5zM100 75h5v5h-5zM110 75h5v5h-5zM40 80h10v5h-10zM95 80h10v5h-10zM115 80h5v5h-5zM45 85h10v5h-10zM90 85h5v5h-5zM100 85h5v5h-5zM115 85h5v5h-5zM40 90h5v5h-5zM50 90h20v5h-20zM75 90h30v5h-30zM110 90h5v5h-5zM120 90h5v5h-5zM40 95h5v5h-5zM50 95h5v5h-5zM70 95h10v5h-10zM95 95h30v5h-30zM40 100h5v5h-5zM50 100h5v5h-5zM75 100h5v5h-5zM120 100h5v5h-5zM40 105h5v5h-5zM55 105h10v5h-10zM80 105h10v5h-10zM120 105h5v5h-5zM40 110h5v5h-5zM55 110h5v5h-5zM65 110h20v5h-20zM90 110h35v5h-35zM40 115h5v5h-5zM55 115h5v5h-5zM85 115h20v5h-20zM115 115h5v5h-5zM45 120h15v5h-15zM95 120h10v5h-10zM115 120h5v5h-5zM55 125h50v5h-50zM110 125h5v5h-5zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h5v5h-5zM105 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#5a3a28" d="M65 40h25v5h-25zM55 45h45v5h-45zM50 50h55v5h-55zM50 55h15v5h-15zM95 55h10v5h-10zM50 60h10v5h-10zM50 65h5v5h-5zM50 70h5v5h-5zM50 75h5v5h-5zM50 80h5v5h-5zM55 85h5v5h-5zM70 90h5v5h-5zM80 95h15v5h-15zM80 100h30v5h-30zM90 105h20v5h-20zM65 115h20v5h-20z"></path><path fill="#c23b3b" d="M65 55h30v5h-30zM60 60h5v5h-5zM95 60h5v5h-5zM60 65h5v5h-5zM60 70h5v5h-5zM60 75h5v5h-5zM65 80h5v5h-5zM70 85h5v5h-5zM75 120h5v5h-5z"></path><path fill="#3a2a1e" d="M65 60h20v5h-20zM90 60h5v5h-5z"></path><path fill="#d8b08c" d="M85 60h5v5h-5zM65 65h10v5h-10zM80 65h10v5h-10zM95 65h5v5h-5zM65 70h10v5h-10zM80 70h10v5h-10z