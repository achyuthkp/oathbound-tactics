<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-rest right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M65 55h10v5h-10zM80 55h15v5h-15zM60 60h5v5h-5zM75 60h5v5h-5zM95 60h10v5h-10zM55 65h5v5h-5zM105 65h5v5h-5zM50 70h5v5h-5zM105 70h5v5h-5zM55 75h5v5h-5zM105 75h5v5h-5zM50 80h5v5h-5zM105 80h5v5h-5zM145 80h10v5h-10zM55 85h5v5h-5zM105 85h5v5h-5zM140 85h5v5h-5zM155 85h5v5h-5zM55 90h5v5h-5zM105 90h5v5h-5zM135 90h5v5h-5zM160 90h5v5h-5zM55 95h5v5h-5zM105 95h5v5h-5zM130 95h5v5h-5zM165 95h5v5h-5zM55 100h10v5h-10zM100 100h5v5h-5zM125 100h5v5h-5zM160 100h5v5h-5zM50 105h5v5h-5zM65 105h5v5h-5zM85 105h20v5h-20zM120 105h5v5h-5zM165 105h5v5h-5zM45 110h10v5h-10zM70 110h5v5h-5zM80 110h5v5h-5zM95 110h10v5h-10zM115 110h5v5h-5zM130 110h10v5h-10zM160 110h5v5h-5zM45 115h10v5h-10zM75 115h10v5h-10zM100 115h5v5h-5zM110 115h5v5h-5zM125 115h5v5h-5zM140 115h20v5h-20zM45 120h10v5h-10zM85 120h5v5h-5zM105 120h5v5h-5zM120 120h5v5h-5zM45 125h10v5h-10zM90 125h5v5h-5zM110 125h10v5h-10zM40 130h5v5h-5zM50 130h5v5h-5zM95 130h5v5h-5zM110 130h5v5h-5zM40 135h5v5h-5zM50 135h5v5h-5zM90 135h5v5h-5zM100 135h10v5h-10zM45 140h60v5h-60zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#5a3a22" d="M65 60h10v5h-10zM80 60h15v5h-15zM60 65h45v5h-45zM55 70h15v5h-15zM80 70h25v5h-25zM60 75h45v5h-45zM55 80h25v5h-25zM85 80h15v5h-15zM65 85h10v5h-10zM65 90h5v5h-5zM90 95h15v5h-15zM75 100h25v5h-25zM70 105h15v5h-15zM75 110h5v5h-5z"></path><path fill="#8c7564" d="M70 70h10v5h-10z"></path><path fill="#d9a47c" d="M80 80h5v5h-5zM100 80h5v5h-5zM75 85h5v5h-5zM85 85h10v5h-10zM100 85h5v5h-5zM70 90h10v5h-10zM85 90h10v5h-10zM100 90h5v5h-5zM65 95h25v5h-25zM70 100h5v5h-5zM85 110h10v5h-10zM85 115h15v5h-15zM90 120h15v5h-15zM95 125h15v5h-15zM100 130h10v5h-10z"></path><path fill="#422921" d="M60 85h5v5h-5zM60 90h5v5h-5zM60 95h5v5h-5zM65