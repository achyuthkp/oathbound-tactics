<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-rest right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M80 45h15v5h-15zM110 45h5v5h-5zM70 50h10v5h-10zM95 50h5v5h-5zM105 50h5v5h-5zM115 50h5v5h-5zM65 55h5v5h-5zM90 55h5v5h-5zM105 55h5v5h-5zM115 55h5v5h-5zM65 60h5v5h-5zM95 60h10v5h-10zM120 60h5v5h-5zM60 65h5v5h-5zM105 65h5v5h-5zM115 65h5v5h-5zM55 70h5v5h-5zM100 70h5v5h-5zM115 70h5v5h-5zM55 75h5v5h-5zM95 75h5v5h-5zM115 75h5v5h-5zM55 80h5v5h-5zM95 80h5v5h-5zM115 80h5v5h-5zM55 85h5v5h-5zM100 85h10v5h-10zM115 85h5v5h-5zM55 90h5v5h-5zM105 90h5v5h-5zM115 90h5v5h-5zM55 95h5v5h-5zM105 95h5v5h-5zM115 95h5v5h-5zM55 100h10v5h-10zM80 100h30v5h-30zM115 100h5v5h-5zM50 105h5v5h-5zM65 105h5v5h-5zM75 105h5v5h-5zM100 105h10v5h-10zM115 105h5v5h-5zM45 110h10v5h-10zM70 110h10v5h-10zM100 110h10v5h-10zM115 110h5v5h-5zM45 115h10v5h-10zM80 115h5v5h-5zM105 115h15v5h-15zM45 120h10v5h-10zM85 120h5v5h-5zM115 120h5v5h-5zM45 125h10v5h-10zM90 125h10v5h-10zM115 125h5v5h-5zM40 130h5v5h-5zM50 130h5v5h-5zM100 130h20v5h-20zM40 135h5v5h-5zM50 135h5v5h-5zM100 135h10v5h-10zM115 135h5v5h-5zM45 140h55v5h-55zM105 140h5v5h-5zM115 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM105 145h5v5h-5zM115 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h10v5h-10zM115 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h10v5h-10zM115 155h5v5h-5zM60 160h40v5h-40zM105 160h5v5h-5zM115 160h5v5h-5zM110 165h5v5h-5z"></path><path fill="#2c4f9c" d="M80 50h15v5h-15zM70 55h20v5h-20zM105 70h5v5h-5zM100 75h10v5h-10zM100 80h10v5h-10zM75 115h5v5h-5zM75 120h5v5h-5zM75 125h5v5h-5zM75 130h5v5h-5zM75 135h5v5h-5z"></path><path fill="#e4ebf3" d="M110 50h5v5h-5zM110 55h5v5h-5zM105 60h15v5h-15z"></path><path fill="#aab3c2" d="M70 60h25v5h-25zM65 65h10v5h-10zM80 65h25v5h-25zM60 70h40v5h-40zM60 75h35v5h-35zM60 85h10v5h-10zM60 90h10v5h-10zM60 105h5v5h-5zM60 110h10v5h-10zM60 115h10v5h-10zM85 115h10v5h-10zM60 120h10v5h-10zM90 120h5v5h-5zM60 125h10v5h-10z