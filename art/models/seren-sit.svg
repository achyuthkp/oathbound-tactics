<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-sit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 2.4s step-end 0.000s infinite"><path fill="#1b1424" d="M65 65h25v5h-25zM60 70h5v5h-5zM90 70h10v5h-10zM45 75h15v5h-15zM100 75h5v5h-5zM40 80h5v5h-5zM100 80h5v5h-5zM35 85h5v5h-5zM100 85h5v5h-5zM35 90h5v5h-5zM50 90h5v5h-5zM100 90h5v5h-5zM35 95h5v5h-5zM50 95h5v5h-5zM100 95h5v5h-5zM35 100h5v5h-5zM50 100h5v5h-5zM100 100h5v5h-5zM35 105h5v5h-5zM50 105h5v5h-5zM100 105h5v5h-5zM40 110h5v5h-5zM50 110h10v5h-10zM95 110h5v5h-5zM40 115h5v5h-5zM50 115h15v5h-15zM90 115h5v5h-5zM40 120h10v5h-10zM55 120h5v5h-5zM65 120h25v5h-25zM95 120h5v5h-5zM40 125h5v5h-5zM50 125h10v5h-10zM75 125h5v5h-5zM90 125h15v5h-15zM40 130h5v5h-5zM50 130h10v5h-10zM75 130h5v5h-5zM90 130h15v5h-15zM40 135h5v5h-5zM50 135h10v5h-10zM75 135h5v5h-5zM95 135h5v5h-5zM105 135h5v5h-5zM115 135h15v5h-15zM40 140h5v5h-5zM50 140h10v5h-10zM80 140h5v5h-5zM95 140h20v5h-20zM130 140h5v5h-5zM40 145h10v5h-10zM55 145h5v5h-5zM80 145h5v5h-5zM95 145h5v5h-5zM130 145h5v5h-5zM45 150h5v5h-5zM55 150h5v5h-5zM80 150h5v5h-5zM95 150h5v5h-5zM130 150h5v5h-5zM50 155h35v5h-35zM95 155h5v5h-5zM130 155h5v5h-5zM75 160h55v5h-55z"></path><path fill="#2f6b4a" d="M65 70h25v5h-25zM60 75h10v5h-10zM80 75h20v5h-20zM45 80h55v5h-55zM40 85h10v5h-10zM55 85h45v5h-45zM40 90h10v5h-10zM55 90h20v5h-20zM85 90h10v5h-10zM40 95h10v5h-10zM60 95h10v5h-10zM45 100h5v5h-5zM65 100h5v5h-5zM45 105h5v5h-5z"></path><path fill="#6d9780" d="M70 75h10v5h-10z"></path><path fill="#26493b" d="M50 85h5v5h-5zM55 95h5v5h-5zM40 100h5v5h-5zM60 100h5v5h-5zM40 105h5v5h-5zM60 105h5v5h-5zM45 110h5v5h-5zM45 115h5v5h-5z"></path><path fill="#e9c09a" d="M75 90h10v5h-10zM95 90h5v5h-5zM70 95h5v5h-5zM80 95h10v5h-10zM95 95h5v5h-5zM70 100h5v5h-5zM80 100h10v5h-10zM95 100h5v5h-5zM65 105h35v5h-35zM65 110h30v5h-30zM75 115h15v5h-15zM85 150h10v5h-10zM85 155h10v5h-10z"></path><path fill="#1d1a26" d="M75 95h5v5h-5zM90 95h5v5h-5zM75 100h5v5h-5zM90 100h5v5h-5z"></