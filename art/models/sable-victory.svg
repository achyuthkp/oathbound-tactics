<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-victory right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 0.5s step-end 0.000s infinite"><path fill="#1b1424" d="M60 25h5v5h-5zM85 25h5v5h-5zM55 30h5v5h-5zM65 30h5v5h-5zM80 30h5v5h-5zM90 30h5v5h-5zM55 35h5v5h-5zM65 35h20v5h-20zM90 35h5v5h-5zM60 40h5v5h-5zM95 40h5v5h-5zM55 45h5v5h-5zM100 45h5v5h-5zM50 50h5v5h-5zM100 50h5v5h-5zM50 55h5v5h-5zM95 55h5v5h-5zM105 55h5v5h-5zM50 60h5v5h-5zM90 60h5v5h-5zM110 60h5v5h-5zM50 65h5v5h-5zM90 65h5v5h-5zM110 65h5v5h-5zM30 70h5v5h-5zM45 70h5v5h-5zM90 70h15v5h-15zM110 70h5v5h-5zM25 75h5v5h-5zM35 75h15v5h-15zM90 75h5v5h-5zM105 75h5v5h-5zM25 80h5v5h-5zM45 80h5v5h-5zM90 80h5v5h-5zM105 80h5v5h-5zM25 85h5v5h-5zM45 85h5v5h-5zM85 85h5v5h-5zM105 85h5v5h-5zM30 90h5v5h-5zM45 90h5v5h-5zM70 90h15v5h-15zM100 90h5v5h-5zM30 95h5v5h-5zM50 95h5v5h-5zM70 95h10v5h-10zM95 95h5v5h-5zM30 100h5v5h-5zM50 100h5v5h-5zM65 100h5v5h-5zM75 100h5v5h-5zM90 100h10v5h-10zM25 105h5v5h-5zM50 105h15v5h-15zM80 105h10v5h-10zM95 105h5v5h-5zM25 110h5v5h-5zM50 110h10v5h-10zM95 110h5v5h-5zM20 115h5v5h-5zM30 115h20v5h-20zM55 115h5v5h-5zM95 115h5v5h-5zM25 120h5v5h-5zM45 120h5v5h-5zM55 120h5v5h-5zM95 120h5v5h-5zM50 125h10v5h-10zM95 125h5v5h-5zM55 130h5v5h-5zM95 130h5v5h-5zM15 135h5v5h-5zM50 135h5v5h-5zM100 135h5v5h-5zM10 140h5v5h-5zM20 140h10v5h-10zM45 140h10v5h-10zM100 140h5v5h-5zM15 145h5v5h-5zM30 145h15v5h-15zM50 145h5v5h-5zM100 145h5v5h-5zM20 150h10v5h-10zM45 150h5v5h-5zM105 150h5v5h-5zM30 155h5v5h-5zM45 155h5v5h-5zM105 155h5v5h-5zM35 160h70v5h-70z"></path><path fill="#cfc4a8" d="M60 30h5v5h-5zM85 30h5v5h-5z"></path><path fill="#e9e2d0" d="M60 35h5v5h-5zM85 35h5v5h-5zM65 40h5v5h-5zM90 40h5v5h-5z"></path><path fill="#3a2a6a" d="M70 40h20v5h-20zM60 45h10v5h-10zM80 45h20v5h-20zM55 50h45v5h-45zM55 55h40v5h-40zM55 60h20v5h-20zM85 60h5v5h-5zM55 65h15v5h-15zM50 70h20v5h-20zM50 75h5v5h-5zM60 75h10v5h-10zM50 80h5v5h-5zM60 80h10v5h-10zM50 85h5v5h-5zM65 85h5v5h-5zM50 90h5v5h-5zM65 90