<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-hit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M60 35h25v5h-25zM50 40h10v5h-10zM85 40h10v5h-10zM45 45h5v5h-5zM95 45h5v5h-5zM40 50h5v5h-5zM100 50h5v5h-5zM40 55h5v5h-5zM100 55h5v5h-5zM40 60h5v5h-5zM95 60h5v5h-5zM105 60h5v5h-5zM40 65h5v5h-5zM95 65h5v5h-5zM110 65h5v5h-5zM40 70h5v5h-5zM95 70h5v5h-5zM110 70h5v5h-5zM40 75h5v5h-5zM95 75h5v5h-5zM105 75h5v5h-5zM115 75h5v5h-5zM35 80h10v5h-10zM90 80h10v5h-10zM105 80h5v5h-5zM115 80h5v5h-5zM40 85h10v5h-10zM85 85h5v5h-5zM95 85h5v5h-5zM105 85h10v5h-10zM120 85h5v5h-5zM35 90h5v5h-5zM45 90h20v5h-20zM70 90h30v5h-30zM105 90h10v5h-10zM120 90h5v5h-5zM35 95h5v5h-5zM45 95h5v5h-5zM65 95h10v5h-10zM90 95h35v5h-35zM35 100h5v5h-5zM45 100h5v5h-5zM70 100h5v5h-5zM120 100h5v5h-5zM35 105h5v5h-5zM50 105h10v5h-10zM75 105h10v5h-10zM120 105h5v5h-5zM35 110h5v5h-5zM50 110h5v5h-5zM60 110h20v5h-20zM85 110h40v5h-40zM35 115h5v5h-5zM50 115h5v5h-5zM80 115h20v5h-20zM105 115h10v5h-10zM120 115h5v5h-5zM40 120h15v5h-15zM90 120h10v5h-10zM105 120h5v5h-5zM115 120h5v5h-5zM55 125h35v5h-35zM95 125h5v5h-5zM105 125h5v5h-5zM115 125h5v5h-5zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h5v5h-5zM110 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM110 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM105 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h10v5h-10zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#5a3a28" d="M60 40h25v5h-25zM50 45h45v5h-45zM45 50h55v5h-55zM45 55h15v5h-15zM90 55h10v5h-10zM45 60h10v5h-10zM45 65h5v5h-5zM45 70h5v5h-5zM45 75h5v5h-5zM45 80h5v5h-5zM50 85h5v5h-5zM65 90h5v5h-5zM75 95h15v5h-15zM75 100h35v5h-35zM85 105h25v5h-25zM60 115h20v5h-20z"></path><path fill="#c23b3b" d="M60 55h30v5h-30zM55 60h5v5h-5zM90 60h5v5h-5zM55 65h5v5h-5zM55 70h5v5h-5zM55 75h5v5h-5zM60 80h5v5h-5zM65 85h5v5h-5zM70 120h5v5h-5z"></path><path fill="#3a2a1e