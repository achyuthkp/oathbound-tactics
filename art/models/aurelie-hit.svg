<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-hit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M55 25h5v5h-5zM80 25h5v5h-5zM50 30h5v5h-5zM60 30h5v5h-5zM75 30h5v5h-5zM85 30h5v5h-5zM50 35h5v5h-5zM60 35h20v5h-20zM85 35h5v5h-5zM55 40h5v5h-5zM90 40h5v5h-5zM50 45h5v5h-5zM95 45h5v5h-5zM45 50h5v5h-5zM95 50h5v5h-5zM45 55h5v5h-5zM95 55h5v5h-5zM45 60h5v5h-5zM95 60h5v5h-5zM45 65h5v5h-5zM95 65h5v5h-5zM25 70h5v5h-5zM40 70h5v5h-5zM95 70h5v5h-5zM20 75h5v5h-5zM30 75h15v5h-15zM95 75h10v5h-10zM20 80h5v5h-5zM40 80h5v5h-5zM90 80h10v5h-10zM105 80h5v5h-5zM20 85h5v5h-5zM40 85h5v5h-5zM85 85h10v5h-10zM110 85h5v5h-5zM25 90h5v5h-5zM40 90h5v5h-5zM65 90h20v5h-20zM90 90h5v5h-5zM110 90h5v5h-5zM25 95h5v5h-5zM45 95h5v5h-5zM65 95h10v5h-10zM85 95h20v5h-20zM110 95h5v5h-5zM25 100h5v5h-5zM45 100h5v5h-5zM60 100h5v5h-5zM70 100h5v5h-5zM105 100h5v5h-5zM20 105h5v5h-5zM45 105h15v5h-15zM75 105h5v5h-5zM105 105h5v5h-5zM20 110h5v5h-5zM45 110h10v5h-10zM80 110h25v5h-25zM15 115h5v5h-5zM25 115h20v5h-20zM50 115h5v5h-5zM90 115h5v5h-5zM20 120h5v5h-5zM40 120h5v5h-5zM50 120h5v5h-5zM90 120h5v5h-5zM45 125h15v5h-15zM95 125h5v5h-5zM55 130h5v5h-5zM95 130h5v5h-5zM15 135h5v5h-5zM50 135h5v5h-5zM100 135h5v5h-5zM10 140h5v5h-5zM20 140h10v5h-10zM45 140h10v5h-10zM100 140h5v5h-5zM15 145h5v5h-5zM30 145h15v5h-15zM50 145h5v5h-5zM100 145h5v5h-5zM20 150h10v5h-10zM45 150h5v5h-5zM105 150h5v5h-5zM30 155h5v5h-5zM45 155h5v5h-5zM105 155h5v5h-5zM35 160h70v5h-70z"></path><path fill="#cfc4a8" d="M55 30h5v5h-5zM80 30h5v5h-5z"></path><path fill="#e9e2d0" d="M55 35h5v5h-5zM80 35h5v5h-5zM60 40h5v5h-5zM85 40h5v5h-5z"></path><path fill="#f2d68a" d="M65 40h20v5h-20zM55 45h10v5h-10zM75 45h20v5h-20zM50 50h45v5h-45zM50 55h45v5h-45zM50 60h20v5h-20zM80 60h15v5h-15zM50 65h15v5h-15zM90 65h5v5h-5zM45 70h20v5h-20zM90 70h5v5h-5zM45 75h5v5h-5zM55 75h10v5h-10zM45 80h5v5h-5zM55 80h10v5h-10zM45 85h5v5h-5zM60 85h5v5h-5zM45 90h5v5h-5zM60 90h5v5h-5zM60 95h5v5h-5z"></path><path 