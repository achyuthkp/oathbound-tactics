<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-talk right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 0.38s step-end 0.000s infinite"><path fill="#1b1424" d="M30 -40h10v5h-10zM25 -35h5v5h-5zM40 -35h10v5h-10zM10 -30h10v5h-10zM25 -30h5v5h-5zM50 -30h10v5h-10zM75 -30h5v5h-5zM5 -25h5v5h-5zM20 -25h10v5h-10zM60 -25h15v5h-15zM80 -25h5v5h-5zM5 -20h5v5h-5zM30 -20h10v5h-10zM55 -20h30v5h-30zM5 -15h5v5h-5zM40 -15h20v5h-20zM85 -15h10v5h-10zM10 -10h5v5h-5zM50 -10h5v5h-5zM95 -10h5v5h-5zM10 -5h5v5h-5zM45 -5h5v5h-5zM95 -5h5v5h-5zM10 0h5v5h-5zM45 0h5v5h-5zM95 0h5v5h-5zM5 5h10v5h-10zM45 5h5v5h-5zM95 5h5v5h-5zM-5 10h10v5h-10zM45 10h5v5h-5zM95 10h5v5h-5zM125 10h20v5h-20zM-15 15h10v5h-10zM45 15h5v5h-5zM95 15h5v5h-5zM110 15h15v5h-15zM130 15h5v5h-5zM145 15h5v5h-5zM155 15h5v5h-5zM-20 20h5v5h-5zM45 20h5v5h-5zM95 20h5v5h-5zM105 20h5v5h-5zM120 20h10v5h-10zM150 20h5v5h-5zM160 20h5v5h-5zM-15 25h5v5h-5zM50 25h5v5h-5zM90 25h5v5h-5zM100 25h5v5h-5zM120 25h5v5h-5zM155 25h5v5h-5zM165 25h10v5h-10zM-10 30h10v5h-10zM55 30h5v5h-5zM70 30h20v5h-20zM100 30h5v5h-5zM115 30h5v5h-5zM150 30h5v5h-5zM175 30h10v5h-10zM0 35h5v5h-5zM50 35h5v5h-5zM60 35h10v5h-10zM90 35h10v5h-10zM110 35h5v5h-5zM155 35h5v5h-5zM185 35h5v5h-5zM5 40h5v5h-5zM45 40h10v5h-10zM65 40h5v5h-5zM90 40h10v5h-10zM105 40h5v5h-5zM120 40h10v5h-10zM150 40h5v5h-5zM185 40h5v5h-5zM5 45h5v5h-5zM45 45h10v5h-10zM70 45h5v5h-5zM90 45h5v5h-5zM100 45h5v5h-5zM115 45h5v5h-5zM130 45h20v5h-20zM180 45h5v5h-5zM0 50h5v5h-5zM45 50h10v5h-10zM75 50h5v5h-5zM95 50h5v5h-5zM110 50h5v5h-5zM130 50h5v5h-5zM175 50h5v5h-5zM0 55h5v5h-5zM45 55h10v5h-10zM80 55h5v5h-5zM100 55h10v5h-10zM125 55h5v5h-5zM135 55h5v5h-5zM175 55h5v5h-5zM-5 60h5v5h-5zM40 60h5v5h-5zM50 60h5v5h-5zM65 60h15v5h-15zM85 60h5v5h-5zM100 60h5v5h-5zM125 60h5v5h-5zM140 60h5v5h-5zM170 60h5v5h-5zM0 65h15v5h-15zM40 65h5v5h-5zM50 65h5v5h-5zM60 65h5v5h-5zM80 65h5v5h-5zM90 65h10v5h-10zM120 65h5v5h-5zM145 65h25v5h-25zM15 70h10v5h-10zM45 70h20v5h-20zM85 70h10v5h-10zM120 