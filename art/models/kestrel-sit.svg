<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-sit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 2.4s step-end 0.000s infinite"><path fill="#1b1424" d="M60 55h5v5h-5zM85 55h5v5h-5zM55 60h5v5h-5zM65 60h5v5h-5zM80 60h5v5h-5zM90 60h10v5h-10zM50 65h10v5h-10zM70 65h10v5h-10zM90 65h5v5h-5zM100 65h5v5h-5zM45 70h5v5h-5zM55 70h5v5h-5zM100 70h5v5h-5zM45 75h5v5h-5zM105 75h5v5h-5zM50 80h5v5h-5zM100 80h5v5h-5zM45 85h5v5h-5zM100 85h5v5h-5zM50 90h5v5h-5zM100 90h5v5h-5zM30 95h5v5h-5zM45 95h5v5h-5zM100 95h5v5h-5zM25 100h5v5h-5zM35 100h5v5h-5zM50 100h5v5h-5zM100 100h5v5h-5zM25 105h5v5h-5zM40 105h5v5h-5zM50 105h5v5h-5zM100 105h5v5h-5zM25 110h5v5h-5zM45 110h15v5h-15zM95 110h5v5h-5zM30 115h5v5h-5zM55 115h10v5h-10zM90 115h5v5h-5zM30 120h5v5h-5zM55 120h5v5h-5zM65 120h25v5h-25zM95 120h5v5h-5zM30 125h5v5h-5zM50 125h10v5h-10zM75 125h5v5h-5zM90 125h15v5h-15zM15 130h5v5h-5zM30 130h5v5h-5zM50 130h10v5h-10zM75 130h5v5h-5zM90 130h15v5h-15zM10 135h5v5h-5zM20 135h10v5h-10zM50 135h10v5h-10zM75 135h5v5h-5zM95 135h5v5h-5zM105 135h5v5h-5zM115 135h15v5h-15zM15 140h5v5h-5zM25 140h5v5h-5zM50 140h10v5h-10zM80 140h5v5h-5zM95 140h20v5h-20zM130 140h5v5h-5zM20 145h5v5h-5zM35 145h15v5h-15zM55 145h5v5h-5zM80 145h5v5h-5zM95 145h5v5h-5zM130 145h5v5h-5zM25 150h10v5h-10zM45 150h5v5h-5zM55 150h5v5h-5zM80 150h5v5h-5zM95 150h5v5h-5zM130 150h5v5h-5zM30 155h5v5h-5zM50 155h35v5h-35zM95 155h5v5h-5zM130 155h5v5h-5zM35 160h15v5h-15zM75 160h55v5h-55z"></path><path fill="#cfc4a8" d="M60 60h5v5h-5zM85 60h5v5h-5z"></path><path fill="#e9e2d0" d="M60 65h5v5h-5zM85 65h5v5h-5zM65 70h5v5h-5zM90 70h5v5h-5z"></path><path fill="#cfeee0" d="M65 65h5v5h-5zM80 65h5v5h-5zM95 65h5v5h-5zM50 70h5v5h-5zM60 70h5v5h-5zM70 70h20v5h-20zM95 70h5v5h-5zM50 75h20v5h-20zM80 75h25v5h-25zM55 80h45v5h-45zM50 85h50v5h-50zM55 90h20v5h-20zM80 90h5v5h-5zM90 90h10v5h-10zM50 95h5v5h-5zM60 95h10v5h-10zM60 100h5v5h-5z"></path><path fill="#ddf3e9" d="M70 75h10v5h-10z"></path><path fill="#efd6be" d="M