<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-levelup right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl4 0.8s step-end 0.000s infinite"><path fill="#1b1424" d="M75 30h15v5h-15zM65 35h10v5h-10zM90 35h5v5h-5zM110 35h5v5h-5zM60 40h5v5h-5zM85 40h5v5h-5zM105 40h5v5h-5zM115 40h5v5h-5zM60 45h5v5h-5zM90 45h10v5h-10zM105 45h5v5h-5zM115 45h5v5h-5zM55 50h5v5h-5zM100 50h5v5h-5zM120 50h5v5h-5zM50 55h5v5h-5zM100 55h10v5h-10zM115 55h5v5h-5zM50 60h5v5h-5zM100 60h5v5h-5zM115 60h5v5h-5zM50 65h5v5h-5zM95 65h5v5h-5zM115 65h5v5h-5zM50 70h5v5h-5zM100 70h10v5h-10zM115 70h5v5h-5zM50 75h5v5h-5zM100 75h10v5h-10zM115 75h5v5h-5zM50 80h5v5h-5zM100 80h10v5h-10zM115 80h5v5h-5zM55 85h5v5h-5zM95 85h5v5h-5zM105 85h5v5h-5zM115 85h5v5h-5zM55 90h10v5h-10zM80 90h20v5h-20zM105 90h5v5h-5zM115 90h5v5h-5zM50 95h5v5h-5zM65 95h15v5h-15zM100 95h10v5h-10zM115 95h5v5h-5zM45 100h10v5h-10zM75 100h5v5h-5zM100 100h10v5h-10zM115 100h5v5h-5zM45 105h10v5h-10zM80 105h5v5h-5zM105 105h15v5h-15zM45 110h10v5h-10zM85 110h5v5h-5zM115 110h5v5h-5zM45 115h10v5h-10zM90 115h10v5h-10zM115 115h5v5h-5zM40 120h5v5h-5zM50 120h5v5h-5zM100 120h20v5h-20zM40 125h5v5h-5zM50 125h5v5h-5zM100 125h10v5h-10zM115 125h5v5h-5zM45 130h55v5h-55zM105 130h5v5h-5zM115 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM105 135h5v5h-5zM115 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM105 140h5v5h-5zM115 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM105 145h5v5h-5zM115 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h10v5h-10zM115 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM110 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#2c4f9c" d="M75 35h15v5h-15zM65 40h20v5h-20zM105 60h5v5h-5zM100 65h10v5h-10zM75 105h5v5h-5zM75 110h5v5h-5zM75 115h5v5h-5zM75 120h5v5h-5zM75 125h5v5h-5z"></path><path fill="#e4ebf3" d="M110 40h5v5h-5zM110 45h5v5h-5zM105 50h15v5h-15z"></path><path fill="#aab3c2" d="M65 45h25v5h-25zM60 50h10v5h-10zM75 50h25v5h-25zM55 55h45v5h-45zM55 60h4