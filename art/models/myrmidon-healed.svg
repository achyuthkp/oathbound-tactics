<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-healed right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl4 0.8s step-end 0.000s infinite"><path fill="#1b1424" d="M65 35h25v5h-25zM60 40h5v5h-5zM95 40h5v5h-5zM45 45h15v5h-15zM100 45h5v5h-5zM40 50h5v5h-5zM100 50h5v5h-5zM100 55h5v5h-5zM50 60h5v5h-5zM100 60h5v5h-5zM50 65h5v5h-5zM100 65h5v5h-5zM35 70h5v5h-5zM50 70h5v5h-5zM100 70h5v5h-5zM135 70h10v5h-10zM35 75h5v5h-5zM50 75h5v5h-5zM100 75h5v5h-5zM130 75h5v5h-5zM145 75h5v5h-5zM40 80h5v5h-5zM50 80h5v5h-5zM95 80h5v5h-5zM125 80h5v5h-5zM140 80h5v5h-5zM40 85h5v5h-5zM90 85h5v5h-5zM120 85h5v5h-5zM135 85h5v5h-5zM45 90h5v5h-5zM65 90h25v5h-25zM95 90h5v5h-5zM115 90h5v5h-5zM130 90h5v5h-5zM50 95h10v5h-10zM75 95h5v5h-5zM90 95h15v5h-15zM110 95h5v5h-5zM125 95h5v5h-5zM50 100h10v5h-10zM75 100h5v5h-5zM95 100h5v5h-5zM105 100h5v5h-5zM120 100h5v5h-5zM50 105h10v5h-10zM80 105h5v5h-5zM100 105h5v5h-5zM110 105h10v5h-10zM50 110h10v5h-10zM85 110h5v5h-5zM105 110h5v5h-5zM115 110h5v5h-5zM45 115h5v5h-5zM55 115h5v5h-5zM90 115h5v5h-5zM105 115h10v5h-10zM45 120h5v5h-5zM55 120h5v5h-5zM95 120h10v5h-10zM50 125h50v5h-50zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#222" d="M65 40h25v5h-25zM60 45h10v5h-10zM80 45h5v5h-5zM45 50h45v5h-45zM95 50h5v5h-5zM40 55h10v5h-10zM55 55h45v5h-45zM45 60h5v5h-5zM55 60h20v5h-20zM85 60h10v5h-10zM40 65h10v5h-10zM60 65h10v5h-10zM45 70h5v5h-5zM65 70h5v5h-5zM45 75h5v5h-5z"></path><path fill="#7dffa0" d="M90 40h5v5h-5zM85 45h5v5h-5zM95 45h5v5h-5zM90 50h5v5h-5zM35 55h5v5h-5zM30 60h5v5h-5zM40 60h5v5h-5zM35 65h5v5h-5zM120 65h5v5h-5zM115 70h5v5h-5zM125 70h5v5h-5zM120 75h5v5h-5zM55 80h5v5h-5zM50 85h5v5h-5zM60 85h5v5h-5zM55 90h5v5h-5zM115 115h5v5h-5zM110 120h5v5h-5zM120 120h5v5h-5z