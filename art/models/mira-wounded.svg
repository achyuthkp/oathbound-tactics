<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-wounded right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 1s step-end 0.000s infinite"><path fill="#1b1424" d="M70 45h25v5h-25zM60 50h10v5h-10zM95 50h10v5h-10zM55 55h5v5h-5zM105 55h5v5h-5zM50 60h5v5h-5zM105 60h15v5h-15zM50 65h5v5h-5zM100 65h5v5h-5zM120 65h5v5h-5zM50 70h5v5h-5zM100 70h5v5h-5zM120 70h5v5h-5zM50 75h5v5h-5zM100 75h5v5h-5zM120 75h5v5h-5zM50 80h5v5h-5zM100 80h5v5h-5zM120 80h5v5h-5zM50 85h5v5h-5zM105 85h5v5h-5zM115 85h5v5h-5zM50 90h5v5h-5zM100 90h10v5h-10zM115 90h5v5h-5zM55 95h10v5h-10zM80 95h10v5h-10zM95 95h5v5h-5zM105 95h5v5h-5zM115 95h5v5h-5zM50 100h5v5h-5zM65 100h15v5h-15zM90 100h10v5h-10zM105 100h5v5h-5zM115 100h5v5h-5zM50 105h5v5h-5zM75 105h5v5h-5zM100 105h10v5h-10zM115 105h5v5h-5zM55 110h5v5h-5zM80 110h5v5h-5zM105 110h15v5h-15zM55 115h15v5h-15zM85 115h10v5h-10zM115 115h5v5h-5zM55 120h5v5h-5zM70 120h5v5h-5zM90 120h10v5h-10zM115 120h5v5h-5zM55 125h5v5h-5zM75 125h15v5h-15zM95 125h25v5h-25zM55 130h5v5h-5zM95 130h5v5h-5zM105 130h5v5h-5zM115 130h5v5h-5zM50 135h5v5h-5zM100 135h10v5h-10zM115 135h5v5h-5zM50 140h5v5h-5zM100 140h10v5h-10zM115 140h5v5h-5zM50 145h5v5h-5zM100 145h5v5h-5zM110 145h5v5h-5zM45 150h5v5h-5zM105 150h5v5h-5zM45 155h5v5h-5zM105 155h5v5h-5zM50 160h55v5h-55z"></path><path fill="#ece6da" d="M70 50h25v5h-25zM60 55h45v5h-45zM55 60h50v5h-50zM55 65h15v5h-15zM55 70h10v5h-10zM55 75h5v5h-5zM55 80h5v5h-5zM55 85h5v5h-5zM55 90h5v5h-5zM80 100h10v5h-10zM80 105h20v5h-20zM85 110h20v5h-20zM95 115h10v5h-10zM65 120h5v5h-5zM100 120h5v5h-5zM65 130h30v5h-30zM60 135h40v5h-40zM60 140h40v5h-40zM60 145h40v5h-40zM55 155h50v5h-50z"></path><path fill="#5f86c4" d="M70 65h30v5h-30zM65 70h5v5h-5zM65 75h5v5h-5zM65 80h5v5h-5zM105 80h5v5h-5zM115 80h5v5h-5zM65 85h5v5h-5zM70 90h5v5h-5zM75 95h5v5h-5zM55 150h50v5h-50z"></path><path fill="#ffffff" d="M105 65h5v5h-5z"></path><path fill="#bfe3ff" d="M110 65h10v5h-10zM105 70h15v5h-15zM105 75h15v5h-15z"></path><path fill="#e8d39a