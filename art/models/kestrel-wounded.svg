<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-wounded right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 1s step-end 0.000s infinite"><path fill="#1b1424" d="M65 35h5v5h-5zM90 35h5v5h-5zM60 40h5v5h-5zM70 40h5v5h-5zM85 40h5v5h-5zM95 40h10v5h-10zM55 45h10v5h-10zM75 45h10v5h-10zM95 45h5v5h-5zM105 45h5v5h-5zM50 50h5v5h-5zM60 50h5v5h-5zM105 50h5v5h-5zM50 55h5v5h-5zM110 55h5v5h-5zM55 60h5v5h-5zM105 60h5v5h-5zM50 65h5v5h-5zM105 65h5v5h-5zM30 70h5v5h-5zM55 70h5v5h-5zM105 70h5v5h-5zM25 75h5v5h-5zM35 75h5v5h-5zM50 75h5v5h-5zM105 75h5v5h-5zM25 80h5v5h-5zM40 80h5v5h-5zM55 80h5v5h-5zM105 80h5v5h-5zM25 85h5v5h-5zM45 85h15v5h-15zM100 85h5v5h-5zM110 85h5v5h-5zM30 90h5v5h-5zM55 90h10v5h-10zM95 90h5v5h-5zM115 90h5v5h-5zM30 95h5v5h-5zM55 95h15v5h-15zM80 95h10v5h-10zM95 95h5v5h-5zM115 95h5v5h-5zM30 100h5v5h-5zM50 100h5v5h-5zM65 100h15v5h-15zM90 100h20v5h-20zM115 100h5v5h-5zM30 105h5v5h-5zM50 105h5v5h-5zM75 105h5v5h-5zM110 105h5v5h-5zM25 110h5v5h-5zM55 110h5v5h-5zM80 110h5v5h-5zM110 110h5v5h-5zM25 115h5v5h-5zM55 115h15v5h-15zM85 115h25v5h-25zM20 120h5v5h-5zM30 120h20v5h-20zM55 120h5v5h-5zM70 120h5v5h-5zM90 120h10v5h-10zM25 125h5v5h-5zM50 125h10v5h-10zM75 125h15v5h-15zM95 125h5v5h-5zM15 130h5v5h-5zM55 130h45v5h-45zM10 135h5v5h-5zM20 135h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM15 140h5v5h-5zM25 140h10v5h-10zM45 140h15v5h-15zM75 140h5v5h-5zM95 140h5v5h-5zM20 145h5v5h-5zM35 145h10v5h-10zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM25 150h10v5h-10zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM30 155h5v5h-5zM50 155h10v5h-10zM75 155h5v5h-5zM100 155h5v5h-5zM35 160h15v5h-15zM60 160h40v5h-40z"></path><path fill="#cfc4a8" d="M65 40h5v5h-5zM90 40h5v5h-5z"></path><path fill="#e9e2d0" d="M65 45h5v5h-5zM90 45h5v5h-5zM70 50h5v5h-5zM95 50h5v5h-5z"></path><path fill="#cfeee0" d="M70 45h5v5h-5zM85 45h5v5h-5zM100 45h5v5h-5zM55 50h5v5h-5zM65 50h5v5h-5zM75 50h20v5h-20zM100 50h5v5h-5zM55 55h20v5h-20zM85 55h25v5h-25zM60 60h45v5h-45zM55 65