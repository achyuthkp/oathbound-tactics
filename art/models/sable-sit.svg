<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-sit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 2.4s step-end 0.000s infinite"><path fill="#1b1424" d="M60 55h5v5h-5zM85 55h5v5h-5zM55 60h5v5h-5zM65 60h5v5h-5zM80 60h5v5h-5zM90 60h5v5h-5zM55 65h5v5h-5zM65 65h20v5h-20zM90 65h5v5h-5zM60 70h5v5h-5zM95 70h5v5h-5zM55 75h5v5h-5zM100 75h5v5h-5zM50 80h5v5h-5zM100 80h5v5h-5zM50 85h5v5h-5zM100 85h5v5h-5zM50 90h5v5h-5zM100 90h5v5h-5zM30 95h5v5h-5zM50 95h5v5h-5zM100 95h5v5h-5zM25 100h5v5h-5zM35 100h5v5h-5zM45 100h5v5h-5zM100 100h5v5h-5zM25 105h5v5h-5zM40 105h10v5h-10zM100 105h5v5h-5zM25 110h5v5h-5zM45 110h5v5h-5zM95 110h5v5h-5zM30 115h5v5h-5zM45 115h5v5h-5zM90 115h5v5h-5zM30 120h5v5h-5zM45 120h5v5h-5zM70 120h20v5h-20zM95 120h5v5h-5zM30 125h5v5h-5zM50 125h5v5h-5zM70 125h10v5h-10zM90 125h10v5h-10zM15 130h5v5h-5zM30 130h5v5h-5zM50 130h5v5h-5zM65 130h5v5h-5zM75 130h5v5h-5zM90 130h10v5h-10zM10 135h5v5h-5zM20 135h10v5h-10zM50 135h15v5h-15zM75 135h5v5h-5zM95 135h5v5h-5zM15 140h5v5h-5zM25 140h5v5h-5zM50 140h10v5h-10zM80 140h5v5h-5zM95 140h5v5h-5zM20 145h5v5h-5zM35 145h15v5h-15zM55 145h5v5h-5zM80 145h5v5h-5zM95 145h5v5h-5zM25 150h10v5h-10zM45 150h15v5h-15zM80 150h5v5h-5zM95 150h10v5h-10zM30 155h5v5h-5zM45 155h5v5h-5zM80 155h5v5h-5zM95 155h5v5h-5zM105 155h5v5h-5zM35 160h70v5h-70z"></path><path fill="#cfc4a8" d="M60 60h5v5h-5zM85 60h5v5h-5z"></path><path fill="#e9e2d0" d="M60 65h5v5h-5zM85 65h5v5h-5zM65 70h5v5h-5zM90 70h5v5h-5z"></path><path fill="#3a2a6a" d="M70 70h20v5h-20zM60 75h10v5h-10zM80 75h20v5h-20zM55 80h45v5h-45zM55 85h45v5h-45zM55 90h20v5h-20zM85 90h15v5h-15zM55 95h15v5h-15zM95 95h5v5h-5zM50 100h20v5h-20zM95 100h5v5h-5zM50 105h5v5h-5zM60 105h10v5h-10zM50 110h5v5h-5zM60 110h10v5h-10zM50 115h5v5h-5zM65 115h5v5h-5zM50 120h5v5h-5zM65 120h5v5h-5zM65 125h5v5h-5z"></path><path fill="#756a97" d="M70 75h10v5h-10z"></path><path fill="#e9d6dc" d="M75 90h10v5h-10zM70 95h5v5h-5zM80 95h10v5h-10zM70 100h5v5h-5zM80 100h10v5h-10zM7