<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-walk right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 0.32s step-end 0.000s infinite"><path fill="#1b1424" d="M60 5h25v5h-25zM55 10h5v5h-5zM85 10h10v5h-10zM50 15h5v5h-5zM95 15h5v5h-5zM45 20h5v5h-5zM95 20h5v5h-5zM45 25h5v5h-5zM95 25h5v5h-5zM45 30h5v5h-5zM95 30h5v5h-5zM45 35h5v5h-5zM95 35h5v5h-5zM45 40h5v5h-5zM95 40h5v5h-5zM130 40h10v5h-10zM45 45h5v5h-5zM95 45h5v5h-5zM125 45h5v5h-5zM140 45h5v5h-5zM50 50h5v5h-5zM90 50h5v5h-5zM120 50h5v5h-5zM135 50h5v5h-5zM55 55h5v5h-5zM85 55h5v5h-5zM115 55h5v5h-5zM130 55h5v5h-5zM50 60h5v5h-5zM60 60h25v5h-25zM90 60h5v5h-5zM110 60h5v5h-5zM125 60h15v5h-15zM45 65h10v5h-10zM60 65h5v5h-5zM70 65h5v5h-5zM85 65h15v5h-15zM105 65h5v5h-5zM120 65h5v5h-5zM140 65h5v5h-5zM45 70h10v5h-10zM60 70h5v5h-5zM70 70h5v5h-5zM90 70h5v5h-5zM100 70h5v5h-5zM115 70h5v5h-5zM145 70h5v5h-5zM45 75h10v5h-10zM60 75h5v5h-5zM75 75h5v5h-5zM95 75h5v5h-5zM105 75h10v5h-10zM120 75h5v5h-5zM145 75h5v5h-5zM45 80h10v5h-10zM65 80h5v5h-5zM80 80h5v5h-5zM100 80h5v5h-5zM110 80h5v5h-5zM130 80h15v5h-15zM40 85h5v5h-5zM50 85h5v5h-5zM65 85h5v5h-5zM85 85h5v5h-5zM100 85h10v5h-10zM130 85h5v5h-5zM40 90h5v5h-5zM50 90h5v5h-5zM70 90h5v5h-5zM90 90h10v5h-10zM130 90h5v5h-5zM35 95h40v5h-40zM95 95h5v5h-5zM125 95h5v5h-5zM25 100h10v5h-10zM70 100h5v5h-5zM95 100h5v5h-5zM125 100h5v5h-5zM20 105h5v5h-5zM75 105h20v5h-20zM120 105h5v5h-5zM20 110h5v5h-5zM120 110h5v5h-5zM15 115h5v5h-5zM115 115h5v5h-5zM15 120h5v5h-5zM110 120h5v5h-5zM15 125h5v5h-5zM30 125h5v5h-5zM105 125h5v5h-5zM10 130h5v5h-5zM30 130h5v5h-5zM45 130h55v5h-55zM110 130h5v5h-5zM10 135h5v5h-5zM25 135h10v5h-10zM45 135h5v5h-5zM55 135h5v5h-5zM90 135h10v5h-10zM110 135h5v5h-5zM10 140h5v5h-5zM25 140h5v5h-5zM40 140h5v5h-5zM55 140h5v5h-5zM95 140h10v5h-10zM115 140h5v5h-5zM15 145h15v5h-15zM40 145h5v5h-5zM55 145h5v5h-5zM95 145h10v5h-10zM115 145h5v5h-5zM20 150h5v5h-5zM35 150h5v5h-5zM50 150h5v5h-5zM100 150h10v5h-10zM120 150h5v5h-5zM25 155h15v5h-15zM50 155h5v5h-