<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-levelup right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl4 0.8s step-end 0.000s infinite"><path fill="#1b1424" d="M60 30h5v5h-5zM85 30h5v5h-5zM55 35h5v5h-5zM65 35h5v5h-5zM80 35h5v5h-5zM90 35h5v5h-5zM55 40h5v5h-5zM65 40h20v5h-20zM90 40h5v5h-5zM60 45h5v5h-5zM95 45h5v5h-5zM55 50h5v5h-5zM100 50h5v5h-5zM50 55h5v5h-5zM100 55h5v5h-5zM50 60h5v5h-5zM100 60h5v5h-5zM50 65h5v5h-5zM100 65h5v5h-5zM30 70h5v5h-5zM50 70h5v5h-5zM100 70h5v5h-5zM25 75h5v5h-5zM35 75h5v5h-5zM45 75h5v5h-5zM100 75h5v5h-5zM25 80h5v5h-5zM40 80h10v5h-10zM100 80h10v5h-10zM25 85h5v5h-5zM45 85h5v5h-5zM95 85h10v5h-10zM110 85h5v5h-5zM30 90h5v5h-5zM45 90h5v5h-5zM90 90h10v5h-10zM115 90h5v5h-5zM30 95h5v5h-5zM45 95h5v5h-5zM70 95h20v5h-20zM95 95h5v5h-5zM115 95h5v5h-5zM30 100h5v5h-5zM50 100h5v5h-5zM70 100h10v5h-10zM90 100h20v5h-20zM115 100h5v5h-5zM30 105h5v5h-5zM50 105h5v5h-5zM65 105h5v5h-5zM75 105h5v5h-5zM110 105h5v5h-5zM25 110h5v5h-5zM50 110h15v5h-15zM80 110h5v5h-5zM110 110h5v5h-5zM25 115h5v5h-5zM50 115h10v5h-10zM85 115h25v5h-25zM20 120h5v5h-5zM30 120h20v5h-20zM55 120h5v5h-5zM95 120h5v5h-5zM25 125h5v5h-5zM45 125h5v5h-5zM55 125h5v5h-5zM95 125h5v5h-5zM15 130h5v5h-5zM50 130h10v5h-10zM95 130h5v5h-5zM10 135h5v5h-5zM20 135h5v5h-5zM50 135h5v5h-5zM100 135h5v5h-5zM15 140h5v5h-5zM25 140h10v5h-10zM45 140h10v5h-10zM100 140h5v5h-5zM20 145h5v5h-5zM35 145h10v5h-10zM50 145h5v5h-5zM100 145h5v5h-5zM25 150h10v5h-10zM45 150h5v5h-5zM105 150h5v5h-5zM30 155h5v5h-5zM45 155h5v5h-5zM105 155h5v5h-5zM35 160h70v5h-70z"></path><path fill="#cfc4a8" d="M60 35h5v5h-5zM85 35h5v5h-5z"></path><path fill="#e9e2d0" d="M60 40h5v5h-5zM85 40h5v5h-5zM65 45h5v5h-5zM90 45h5v5h-5z"></path><path fill="#3a2a6a" d="M70 45h20v5h-20zM60 50h10v5h-10zM80 50h20v5h-20zM55 55h45v5h-45zM55 60h45v5h-45zM55 65h20v5h-20zM85 65h15v5h-15zM55 70h15v5h-15zM95 70h5v5h-5zM50 75h20v5h-20zM95 75h5v5h-5zM50 80h5v5h-5zM60 80h10v5h-10zM50 85h5v5h-5zM60 85h10v5h-10zM50 90h5v5h-5zM65 90