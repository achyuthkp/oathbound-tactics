<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-rest right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M70 55h25v5h-25zM60 60h10v5h-10zM95 60h10v5h-10zM55 65h5v5h-5zM105 65h5v5h-5zM50 70h5v5h-5zM110 70h5v5h-5zM50 75h5v5h-5zM110 75h5v5h-5zM50 80h5v5h-5zM105 80h5v5h-5zM50 85h5v5h-5zM105 85h5v5h-5zM45 90h10v5h-10zM100 90h5v5h-5zM110 90h5v5h-5zM40 95h5v5h-5zM50 95h5v5h-5zM100 95h5v5h-5zM115 95h5v5h-5zM45 100h10v5h-10zM100 100h5v5h-5zM115 100h5v5h-5zM40 105h5v5h-5zM55 105h15v5h-15zM80 105h25v5h-25zM110 105h5v5h-5zM120 105h5v5h-5zM40 110h5v5h-5zM50 110h5v5h-5zM70 110h10v5h-10zM95 110h30v5h-30zM40 115h5v5h-5zM50 115h5v5h-5zM75 115h5v5h-5zM120 115h5v5h-5zM40 120h5v5h-5zM55 120h10v5h-10zM80 120h10v5h-10zM120 120h5v5h-5zM40 125h5v5h-5zM55 125h5v5h-5zM65 125h20v5h-20zM90 125h35v5h-35zM40 130h5v5h-5zM55 130h5v5h-5zM85 130h20v5h-20zM115 130h5v5h-5zM45 135h15v5h-15zM95 135h10v5h-10zM115 135h5v5h-5zM55 140h50v5h-50zM110 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM105 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#5a3a28" d="M70 60h25v5h-25zM60 65h45v5h-45zM55 70h55v5h-55zM55 75h15v5h-15zM100 75h10v5h-10zM55 80h10v5h-10zM55 85h5v5h-5zM55 90h5v5h-5zM55 95h5v5h-5zM55 100h5v5h-5zM80 110h15v5h-15zM80 115h30v5h-30zM90 120h20v5h-20zM65 130h20v5h-20z"></path><path fill="#c23b3b" d="M70 75h30v5h-30zM65 80h5v5h-5zM100 80h5v5h-5zM65 85h5v5h-5zM65 90h5v5h-5zM65 95h5v5h-5zM70 100h5v5h-5zM75 105h5v5h-5zM75 135h5v5h-5z"></path><path fill="#3a2a1e" d="M70 80h20v5h-20zM95 80h5v5h-5z"></path><path fill="#d8b08c" d="M90 80h5v5h-5zM70 85h10v5h-10zM85 85h10v5h-10zM100 85h5v5h-5zM70 90h10v5h-10zM85 90h10v5h-10zM70 95h30v5h-30zM75 100h25v5h-25zM110 115h10v5h-10zM110 120h10v5h-10z"></path><path fill="#452c25" d="M60 85h5v5h-5zM60 90h5v5h-5zM60 95h5v5h-5zM60 100h10v5h-10zM70 105h5v5h-5z"></path><path fill="#1d1