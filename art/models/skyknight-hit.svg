<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-hit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M45 -30h10v5h-10zM40 -25h5v5h-5zM55 -25h5v5h-5zM35 -20h5v5h-5zM60 -20h20v5h-20zM160 -20h10v5h-10zM35 -15h5v5h-5zM80 -15h10v5h-10zM145 -15h15v5h-15zM170 -15h5v5h-5zM40 -10h5v5h-5zM90 -10h5v5h-5zM140 -10h5v5h-5zM165 -10h5v5h-5zM40 -5h5v5h-5zM90 -5h5v5h-5zM125 -5h25v5h-25zM160 -5h5v5h-5zM40 0h5v5h-5zM90 0h5v5h-5zM120 0h5v5h-5zM165 0h5v5h-5zM40 5h5v5h-5zM90 5h5v5h-5zM115 5h5v5h-5zM150 5h15v5h-15zM40 10h5v5h-5zM90 10h5v5h-5zM120 10h5v5h-5zM145 10h5v5h-5zM30 15h5v5h-5zM40 15h5v5h-5zM90 15h5v5h-5zM125 15h5v5h-5zM140 15h5v5h-5zM15 20h5v5h-5zM25 20h5v5h-5zM35 20h10v5h-10zM90 20h5v5h-5zM120 20h5v5h-5zM135 20h5v5h-5zM10 25h5v5h-5zM20 25h10v5h-10zM40 25h10v5h-10zM85 25h5v5h-5zM100 25h10v5h-10zM115 25h5v5h-5zM130 25h5v5h-5zM10 30h5v5h-5zM25 30h5v5h-5zM35 30h5v5h-5zM45 30h10v5h-10zM80 30h5v5h-5zM95 30h5v5h-5zM110 30h5v5h-5zM125 30h5v5h-5zM135 30h5v5h-5zM10 35h5v5h-5zM30 35h5v5h-5zM40 35h10v5h-10zM55 35h25v5h-25zM85 35h5v5h-5zM95 35h5v5h-5zM105 35h5v5h-5zM120 35h5v5h-5zM135 35h10v5h-10zM10 40h5v5h-5zM35 40h15v5h-15zM65 40h5v5h-5zM80 40h15v5h-15zM100 40h5v5h-5zM115 40h5v5h-5zM145 40h5v5h-5zM15 45h5v5h-5zM40 45h10v5h-10zM65 45h5v5h-5zM85 45h15v5h-15zM110 45h5v5h-5zM150 45h5v5h-5zM15 50h5v5h-5zM40 50h10v5h-10zM70 50h5v5h-5zM90 50h5v5h-5zM105 50h5v5h-5zM155 50h5v5h-5zM20 55h5v5h-5zM40 55h10v5h-10zM75 55h5v5h-5zM95 55h10v5h-10zM155 55h5v5h-5zM20 60h5v5h-5zM35 60h5v5h-5zM45 60h5v5h-5zM65 60h20v5h-20zM95 60h5v5h-5zM120 60h10v5h-10zM150 60h5v5h-5zM25 65h5v5h-5zM35 65h5v5h-5zM45 65h5v5h-5zM60 65h5v5h-5zM75 65h5v5h-5zM85 65h10v5h-10zM120 65h5v5h-5zM130 65h20v5h-20zM10 70h25v5h-25zM40 70h25v5h-25zM70 70h5v5h-5zM85 70h10v5h-10zM115 70h5v5h-5zM5 75h5v5h-5zM35 75h10v5h-10zM60 75h10v5h-10zM80 75h15v5h-15zM115 75h5v5h-5zM5 80h5v5h-5zM40 80h20v5h-20zM65 80h15v5h-15zM90 80h5v5h-5zM115 80h5v5h-5zM0 85h5v5h-5z