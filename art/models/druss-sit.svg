<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-sit right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 2.4s step-end 0.000s infinite"><path fill="#1b1424" d="M75 55h15v5h-15zM65 60h10v5h-10zM90 60h5v5h-5zM60 65h5v5h-5zM85 65h5v5h-5zM60 70h5v5h-5zM90 70h10v5h-10zM55 75h5v5h-5zM100 75h5v5h-5zM50 80h5v5h-5zM100 80h5v5h-5zM50 85h5v5h-5zM100 85h5v5h-5zM50 90h5v5h-5zM105 90h5v5h-5zM50 95h5v5h-5zM100 95h5v5h-5zM50 100h5v5h-5zM100 100h5v5h-5zM50 105h5v5h-5zM100 105h5v5h-5zM55 110h5v5h-5zM95 110h5v5h-5zM55 115h10v5h-10zM80 115h20v5h-20zM50 120h5v5h-5zM65 120h15v5h-15zM100 120h5v5h-5zM45 125h10v5h-10zM75 125h5v5h-5zM100 125h5v5h-5zM45 130h10v5h-10zM80 130h5v5h-5zM95 130h10v5h-10zM45 135h10v5h-10zM80 135h5v5h-5zM100 135h10v5h-10zM115 135h15v5h-15zM45 140h10v5h-10zM85 140h5v5h-5zM100 140h15v5h-15zM130 140h5v5h-5zM40 145h5v5h-5zM50 145h5v5h-5zM85 145h5v5h-5zM100 145h5v5h-5zM130 145h5v5h-5zM40 150h5v5h-5zM50 150h5v5h-5zM85 150h5v5h-5zM100 150h5v5h-5zM130 150h5v5h-5zM45 155h45v5h-45zM100 155h5v5h-5zM130 155h5v5h-5zM75 160h55v5h-55z"></path><path fill="#c46a2a" d="M75 60h15v5h-15zM65 65h20v5h-20zM75 130h5v5h-5zM75 135h5v5h-5zM75 140h5v5h-5zM75 145h5v5h-5zM75 150h5v5h-5z"></path><path fill="#aab3c2" d="M65 70h25v5h-25zM60 75h10v5h-10zM75 75h25v5h-25zM55 80h45v5h-45zM55 85h45v5h-45zM55 95h10v5h-10zM55 100h10v5h-10zM60 120h5v5h-5zM60 125h10v5h-10zM60 130h10v5h-10zM85 130h10v5h-10zM60 135h10v5h-10zM85 135h15v5h-15zM60 140h10v5h-10zM60 145h10v5h-10z"></path><path fill="#dfe5ee" d="M70 75h5v5h-5zM80 120h20v5h-20zM80 125h20v5h-20z"></path><path fill="#6f7787" d="M55 90h50v5h-50zM55 105h5v5h-5zM90 140h10v5h-10zM90 145h10v5h-10zM105 145h10v5h-10zM105 150h10v5h-10zM105 155h10v5h-10z"></path><path fill="#d8ae8a" d="M65 95h10v5h-10zM80 95h10v5h-10zM95 95h5v5h-5zM65 100h10v5h-10zM80 100h10v5h-10zM95 100h5v5h-5zM60 105h30v5h-30zM65 110h5v5h-5zM90 150h10v5h-10zM90 155h10v5h-10z"></path><path fill="#1d1a26" d="M75 95h5v5h-5zM90 95h5v5h-5z