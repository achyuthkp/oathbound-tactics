<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-rest right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 1.2s step-end 0.000s infinite"><path fill="#1b1424" d="M70 -10h15v5h-15zM60 -5h10v5h-10zM85 -5h5v5h-5zM55 0h5v5h-5zM80 0h5v5h-5zM55 5h5v5h-5zM85 5h10v5h-10zM50 10h5v5h-5zM95 10h5v5h-5zM45 15h5v5h-5zM95 15h5v5h-5zM45 20h5v5h-5zM95 20h5v5h-5zM-5 25h10v5h-10zM45 25h5v5h-5zM100 25h5v5h-5zM-10 30h5v5h-5zM5 30h15v5h-15zM45 30h5v5h-5zM95 30h5v5h-5zM135 30h10v5h-10zM-25 35h10v5h-10zM-5 35h5v5h-5zM20 35h30v5h-30zM95 35h5v5h-5zM130 35h5v5h-5zM145 35h5v5h-5zM-30 40h5v5h-5zM-15 40h20v5h-20zM25 40h5v5h-5zM40 40h10v5h-10zM95 40h5v5h-5zM125 40h5v5h-5zM150 40h5v5h-5zM-25 45h5v5h-5zM0 45h25v5h-25zM30 45h5v5h-5zM50 45h5v5h-5zM90 45h5v5h-5zM120 45h5v5h-5zM155 45h5v5h-5zM-20 50h5v5h-5zM20 50h5v5h-5zM30 50h5v5h-5zM55 50h5v5h-5zM70 50h20v5h-20zM115 50h5v5h-5zM150 50h5v5h-5zM-15 55h5v5h-5zM35 55h5v5h-5zM50 55h5v5h-5zM60 55h10v5h-10zM90 55h5v5h-5zM110 55h5v5h-5zM155 55h5v5h-5zM-15 60h10v5h-10zM40 60h15v5h-15zM65 60h5v5h-5zM90 60h5v5h-5zM105 60h5v5h-5zM120 60h10v5h-10zM150 60h5v5h-5zM-20 65h5v5h-5zM45 65h10v5h-10zM70 65h5v5h-5zM90 65h5v5h-5zM100 65h5v5h-5zM115 65h5v5h-5zM130 65h20v5h-20zM-30 70h10v5h-10zM45 70h10v5h-10zM75 70h5v5h-5zM95 70h5v5h-5zM110 70h5v5h-5zM-35 75h5v5h-5zM45 75h10v5h-10zM80 75h5v5h-5zM100 75h10v5h-10zM-30 80h15v5h-15zM40 80h5v5h-5zM50 80h5v5h-5zM65 80h15v5h-15zM85 80h5v5h-5zM100 80h5v5h-5zM-15 85h10v5h-10zM40 85h5v5h-5zM50 85h5v5h-5zM60 85h5v5h-5zM80 85h5v5h-5zM90 85h20v5h-20zM-10 90h5v5h-5zM45 90h20v5h-20zM85 90h10v5h-10zM110 90h10v5h-10zM130 90h10v5h-10zM-10 95h5v5h-5zM60 95h5v5h-5zM85 95h10v5h-10zM120 95h10v5h-10zM140 95h10v5h-10zM160 95h5v5h-5zM-15 100h5v5h-5zM65 100h5v5h-5zM90 100h5v5h-5zM130 100h5v5h-5zM150 100h10v5h-10zM165 100h5v5h-5zM-15 105h5v5h-5zM-5 105h25v5h-25zM60 105h10v5h-10zM90 105h5v5h-5zM170 105h10v5h-10zM-10 110h10v5h-10zM20 110h55v5h-55zM90 110h5v5h-5zM180 110h10v5h-10zM-5 115h5v5h-5zM75