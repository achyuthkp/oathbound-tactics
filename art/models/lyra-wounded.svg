<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-wounded right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 1s step-end 0.000s infinite"><path fill="#1b1424" d="M65 10h25v5h-25zM60 15h5v5h-5zM90 15h10v5h-10zM55 20h5v5h-5zM100 20h5v5h-5zM50 25h5v5h-5zM100 25h5v5h-5zM50 30h5v5h-5zM100 30h5v5h-5zM50 35h5v5h-5zM100 35h5v5h-5zM50 40h5v5h-5zM100 40h5v5h-5zM130 40h10v5h-10zM45 45h5v5h-5zM100 45h5v5h-5zM125 45h5v5h-5zM140 45h5v5h-5zM45 50h5v5h-5zM100 50h5v5h-5zM120 50h5v5h-5zM135 50h5v5h-5zM45 55h5v5h-5zM95 55h5v5h-5zM115 55h5v5h-5zM130 55h5v5h-5zM45 60h15v5h-15zM75 60h10v5h-10zM90 60h5v5h-5zM110 60h5v5h-5zM125 60h5v5h-5zM45 65h5v5h-5zM60 65h15v5h-15zM85 65h15v5h-15zM105 65h5v5h-5zM120 65h5v5h-5zM45 70h5v5h-5zM70 70h5v5h-5zM90 70h5v5h-5zM100 70h5v5h-5zM115 70h5v5h-5zM125 70h5v5h-5zM135 70h5v5h-5zM45 75h10v5h-10zM75 75h5v5h-5zM95 75h5v5h-5zM105 75h20v5h-20zM130 75h5v5h-5zM140 75h5v5h-5zM40 80h5v5h-5zM50 80h15v5h-15zM80 80h5v5h-5zM100 80h5v5h-5zM110 80h5v5h-5zM140 80h10v5h-10zM30 85h25v5h-25zM60 85h10v5h-10zM85 85h5v5h-5zM100 85h10v5h-10zM150 85h5v5h-5zM10 90h20v5h-20zM40 90h5v5h-5zM50 90h5v5h-5zM60 90h5v5h-5zM70 90h30v5h-30zM155 90h5v5h-5zM5 95h5v5h-5zM40 95h5v5h-5zM55 95h10v5h-10zM85 95h10v5h-10zM160 95h5v5h-5zM5 100h5v5h-5zM40 100h5v5h-5zM65 100h5v5h-5zM90 100h5v5h-5zM125 100h5v5h-5zM160 100h5v5h-5zM0 105h5v5h-5zM40 105h5v5h-5zM65 105h5v5h-5zM90 105h5v5h-5zM115 105h10v5h-10zM130 105h5v5h-5zM155 105h5v5h-5zM0 110h5v5h-5zM45 110h30v5h-30zM90 110h5v5h-5zM115 110h5v5h-5zM135 110h20v5h-20zM0 115h5v5h-5zM75 115h5v5h-5zM90 115h10v5h-10zM115 115h5v5h-5zM0 120h5v5h-5zM15 120h5v5h-5zM75 120h5v5h-5zM100 120h5v5h-5zM115 120h5v5h-5zM0 125h5v5h-5zM15 125h10v5h-10zM70 125h5v5h-5zM105 125h5v5h-5zM115 125h5v5h-5zM0 130h5v5h-5zM15 130h5v5h-5zM25 130h10v5h-10zM50 130h55v5h-55zM115 130h5v5h-5zM0 135h5v5h-5zM15 135h5v5h-5zM30 135h5v5h-5zM50 135h5v5h-5zM60 135h5v5h-5zM85 135h5v5h-5zM95 135h5v5h-5zM115 135h5v5h-5zM0 140h5v5h-5zM15 140h5v5h-