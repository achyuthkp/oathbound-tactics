<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-rest right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="visibility:visible"><path fill="#1b1424" d="M65 45h5v5h-5zM90 45h5v5h-5zM60 50h5v5h-5zM70 50h5v5h-5zM85 50h5v5h-5zM95 50h10v5h-10zM55 55h10v5h-10zM75 55h10v5h-10zM95 55h5v5h-5zM105 55h5v5h-5zM50 60h5v5h-5zM60 60h5v5h-5zM105 60h5v5h-5zM50 65h5v5h-5zM110 65h5v5h-5zM55 70h5v5h-5zM105 70h5v5h-5zM50 75h5v5h-5zM105 75h5v5h-5zM30 80h5v5h-5zM55 80h5v5h-5zM105 80h5v5h-5zM25 85h5v5h-5zM35 85h5v5h-5zM50 85h5v5h-5zM105 85h5v5h-5zM25 90h5v5h-5zM40 90h5v5h-5zM55 90h5v5h-5zM105 90h5v5h-5zM25 95h5v5h-5zM45 95h15v5h-15zM100 95h5v5h-5zM110 95h5v5h-5zM30 100h5v5h-5zM55 100h10v5h-10zM95 100h5v5h-5zM115 100h5v5h-5zM30 105h5v5h-5zM55 105h5v5h-5zM65 105h5v5h-5zM80 105h10v5h-10zM95 105h5v5h-5zM115 105h5v5h-5zM30 110h5v5h-5zM50 110h10v5h-10zM70 110h10v5h-10zM90 110h20v5h-20zM115 110h5v5h-5zM30 115h5v5h-5zM50 115h10v5h-10zM75 115h5v5h-5zM110 115h5v5h-5zM25 120h5v5h-5zM50 120h10v5h-10zM80 120h5v5h-5zM110 120h5v5h-5zM25 125h5v5h-5zM50 125h10v5h-10zM85 125h25v5h-25zM15 130h10v5h-10zM30 130h20v5h-20zM55 130h5v5h-5zM95 130h5v5h-5zM10 135h5v5h-5zM20 135h10v5h-10zM45 135h5v5h-5zM55 135h5v5h-5zM95 135h5v5h-5zM15 140h5v5h-5zM25 140h10v5h-10zM45 140h55v5h-55zM20 145h5v5h-5zM35 145h10v5h-10zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM25 150h10v5h-10zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM30 155h5v5h-5zM50 155h10v5h-10zM75 155h5v5h-5zM100 155h5v5h-5zM35 160h15v5h-15zM60 160h40v5h-40z"></path><path fill="#cfc4a8" d="M65 50h5v5h-5zM90 50h5v5h-5z"></path><path fill="#e9e2d0" d="M65 55h5v5h-5zM90 55h5v5h-5zM70 60h5v5h-5zM95 60h5v5h-5z"></path><path fill="#cfeee0" d="M70 55h5v5h-5zM85 55h5v5h-5zM100 55h5v5h-5zM55 60h5v5h-5zM65 60h5v5h-5zM75 60h20v5h-20zM100 60h5v5h-5zM55 65h20v5h-20zM85 65h25v5h-25zM60 70h45v5h-45zM55 75h50v5h-50zM60 80h20v5h-20zM85 80h5v5h-5zM95 80h10v5h-10zM55 85h5v5h-5zM65 85h10v5h-10zM65 90h5v5h-5z"></path><path fill="#ddf3e9" d="M