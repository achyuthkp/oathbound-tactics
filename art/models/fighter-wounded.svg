<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-wounded right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 1s step-end 0.000s infinite"><path fill="#1b1424" d="M65 45h10v5h-10zM80 45h15v5h-15zM60 50h5v5h-5zM75 50h5v5h-5zM95 50h10v5h-10zM55 55h5v5h-5zM105 55h5v5h-5zM50 60h5v5h-5zM105 60h5v5h-5zM55 65h5v5h-5zM105 65h5v5h-5zM50 70h5v5h-5zM105 70h5v5h-5zM145 70h10v5h-10zM55 75h5v5h-5zM105 75h5v5h-5zM140 75h5v5h-5zM155 75h5v5h-5zM55 80h5v5h-5zM105 80h5v5h-5zM135 80h5v5h-5zM160 80h5v5h-5zM55 85h5v5h-5zM105 85h5v5h-5zM130 85h5v5h-5zM165 85h5v5h-5zM55 90h10v5h-10zM100 90h5v5h-5zM125 90h5v5h-5zM160 90h5v5h-5zM50 95h10v5h-10zM65 95h5v5h-5zM85 95h20v5h-20zM120 95h5v5h-5zM165 95h5v5h-5zM45 100h5v5h-5zM60 100h15v5h-15zM80 100h5v5h-5zM95 100h10v5h-10zM115 100h5v5h-5zM130 100h10v5h-10zM160 100h5v5h-5zM45 105h5v5h-5zM70 105h15v5h-15zM100 105h5v5h-5zM110 105h5v5h-5zM125 105h5v5h-5zM140 105h20v5h-20zM50 110h5v5h-5zM75 110h15v5h-15zM105 110h5v5h-5zM120 110h5v5h-5zM50 115h15v5h-15zM85 115h10v5h-10zM110 115h10v5h-10zM50 120h5v5h-5zM65 120h5v5h-5zM85 120h5v5h-5zM95 120h5v5h-5zM110 120h5v5h-5zM50 125h5v5h-5zM70 125h15v5h-15zM90 125h5v5h-5zM100 125h10v5h-10zM55 130h50v5h-50zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#4a2a1a" d="M65 50h10v5h-10zM80 50h15v5h-15zM60 55h45v5h-45zM55 60h15v5h-15zM80 60h25v5h-25zM60 65h45v5h-45zM55 70h25v5h-25zM85 70h15v5h-15zM65 75h10v5h-10zM65 80h5v5h-5zM90 85h15v5h-15zM75 90h25v5h-25zM70 95h15v5h-15zM75 100h5v5h-5z"></path><path fill="#806a5f" d="M70 60h10v5h-10z"></path><path fill="#d6a27c" d="M80 70h5v5h-5zM100 70h5v5h-5zM75 75h5v5h-5zM85 75h10v5h-10zM100 75h5v5h-5zM70 80h10v5h-10zM85 80h10v5h-10zM100 80h5v5h-5zM65 85h25v5h-25zM70 90h5v5h-5zM85 100h10v5h-10zM85 105h15v5h-15zM90 110h15