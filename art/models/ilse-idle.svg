<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-idle right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-dodge .fig-root { animation: sidestep .6s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }
@keyframes sidestep { 0% { transform: translateX(-10px); } 15% { transform: translate(-25px, -5px); } 65% { transform: translateX(-10px); } 85% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 0.6s step-end 0.000s infinite"><path fill="#1b1424" d="M50 -15h10v5h-10zM45 -10h5v5h-5zM60 -10h5v5h-5zM40 -5h5v5h-5zM65 -5h20v5h-20zM165 -5h10v5h-10zM40 0h5v5h-5zM85 0h10v5h-10zM150 0h5v5h-5zM160 0h5v5h-5zM175 0h5v5h-5zM45 5h5v5h-5zM95 5h5v5h-5zM145 5h5v5h-5zM155 5h5v5h-5zM170 5h5v5h-5zM45 10h5v5h-5zM95 10h5v5h-5zM130 10h5v5h-5zM140 10h5v5h-5zM150 10h5v5h-5zM165 10h5v5h-5zM45 15h5v5h-5zM95 15h5v5h-5zM125 15h5v5h-5zM135 15h5v5h-5zM145 15h5v5h-5zM165 15h5v5h-5zM45 20h5v5h-5zM95 20h5v5h-5zM130 20h5v5h-5zM140 20h5v5h-5zM155 20h10v5h-10zM45 25h5v5h-5zM95 25h5v5h-5zM135 25h5v5h-5zM150 25h5v5h-5zM45 30h5v5h-5zM95 30h5v5h-5zM130 30h5v5h-5zM145 30h5v5h-5zM15 35h5v5h-5zM45 35h5v5h-5zM95 35h5v5h-5zM125 35h5v5h-5zM140 35h5v5h-5zM10 40h5v5h-5zM20 40h5v5h-5zM50 40h5v5h-5zM90 40h5v5h-5zM120 40h5v5h-5zM135 40h5v5h-5zM10 45h5v5h-5zM25 45h10v5h-10zM55 45h5v5h-5zM85 45h5v5h-5zM115 45h5v5h-5zM130 45h5v5h-5zM10 50h5v5h-5zM35 50h5v5h-5zM50 50h5v5h-5zM60 50h25v5h-25zM90 50h5v5h-5zM110 50h5v5h-5zM125 50h15v5h-15zM15 55h5v5h-5zM40 55h15v5h-15zM60 55h5v5h-5zM70 55h5v5h-5zM85 55h10v5h-10zM105 55h5v5h-5zM120 55h5v5h-5zM140 55h5v5h-5zM15 60h5v5h-5zM45 60h10v5h-10zM60 60h5v5h-5zM70 60h5v5h-5zM90 60h5v5h-5zM100 60h5v5h-5zM115 60h5v5h-5zM145 60h5v5h-5zM20 65h5v5h-5zM45 65h10v5h-10zM60 65h5v5h-5zM75 65h5v5h-5zM95 65h5v5h-5zM110 65h5v5h-5zM120 65h5v5h-5zM145 65h5v5h-5zM20 70h5v5h-5zM45 70h10v5h-10zM65 70h5v5h-5zM80 70h5v5h-5zM100 70h10v5h-10zM130 70h15v5h-15zM25 75h5v5h-5zM40 75h5v5h-5zM50 75h5v5h-5zM65 75h5v5h-5zM85 75h5v5h-5zM100 75h5v5h-5zM130 75h5v5h-5zM30 80h5v5h-5zM40 80h5v5h-5zM50 80h5v5h-5zM70 80h5v5h-5zM80 80h5v5h-5zM90 80h10v5h-10zM130 80h5v5h-5zM35 85h45v5h-45zM90 85h10v5h-10zM125 85h5v5h-5zM25 90h10v5h-10zM45 90h15v5h-15zM70 90h5v5h-5zM85 90h5v5h-5zM95 90h5v5h-5zM125 90h5v5h-5zM20 95h5v5h-5zM75 95h20v5h-20zM120 95h5v5h-5zM20 1