<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-dodge right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr" style="animation:frShow 0.080s step-end 0s 1"><path fill="#1b1424" d="M60 40h25v5h-25zM55 45h5v5h-5zM85 45h10v5h-10zM40 50h15v5h-15zM95 50h5v5h-5zM35 55h5v5h-5zM95 55h5v5h-5zM30 60h5v5h-5zM95 60h5v5h-5zM30 65h5v5h-5zM45 65h5v5h-5zM95 65h5v5h-5zM30 70h5v5h-5zM45 70h5v5h-5zM95 70h5v5h-5zM30 75h5v5h-5zM45 75h5v5h-5zM95 75h10v5h-10zM30 80h5v5h-5zM45 80h5v5h-5zM95 80h5v5h-5zM105 80h5v5h-5zM35 85h5v5h-5zM45 85h10v5h-10zM90 85h10v5h-10zM110 85h5v5h-5zM35 90h5v5h-5zM45 90h15v5h-15zM85 90h5v5h-5zM95 90h5v5h-5zM110 90h5v5h-5zM35 95h10v5h-10zM50 95h50v5h-50zM105 95h5v5h-5zM115 95h5v5h-5zM35 100h5v5h-5zM45 100h5v5h-5zM65 100h10v5h-10zM90 100h30v5h-30zM35 105h5v5h-5zM45 105h5v5h-5zM70 105h5v5h-5zM115 105h5v5h-5zM35 110h5v5h-5zM50 110h10v5h-10zM75 110h10v5h-10zM115 110h5v5h-5zM35 115h5v5h-5zM50 115h5v5h-5zM60 115h20v5h-20zM85 115h35v5h-35zM35 120h5v5h-5zM50 120h5v5h-5zM80 120h20v5h-20zM110 120h5v5h-5zM40 125h15v5h-15zM90 125h10v5h-10zM110 125h5v5h-5zM55 130h35v5h-35zM95 130h5v5h-5zM105 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h10v5h-10zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#2f6b4a" d="M60 45h25v5h-25zM55 50h10v5h-10zM75 50h20v5h-20zM40 55h55v5h-55zM35 60h10v5h-10zM50 60h45v5h-45zM35 65h10v5h-10zM50 65h20v5h-20zM80 65h10v5h-10zM35 70h10v5h-10zM55 70h10v5h-10zM40 75h5v5h-5zM60 75h5v5h-5zM40 80h5v5h-5z"></path><path fill="#6d9780" d="M65 50h10v5h-10z"></path><path fill="#26493b" d="M45 60h5v5h-5zM50 70h5v5h-5zM35 75h5v5h-5zM55 75h5v5h-5zM35 80h5v5h-5zM55 80h5v5h-5zM40 85h5v5h-5zM40 90h5v5h-5z"></path><path fill="#e9c09a" d="M70 65h10v5h-10zM90 65h5v5h-5zM65 70h5v5h-5zM75 70h10v5h-10zM90 70h5v5h-5zM65 75h5v5h-5zM75 75h10v5h-10zM90 75h5v5h-5zM60 80h35v5h-35zM60 85h