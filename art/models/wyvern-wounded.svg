<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-wounded right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="25" y="160" width="115" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr rest" style="animation:fl2 1s step-end 0.000s infinite"><path fill="#1b1424" d="M30 -35h10v5h-10zM25 -30h5v5h-5zM40 -30h10v5h-10zM10 -25h10v5h-10zM25 -25h5v5h-5zM50 -25h10v5h-10zM75 -25h5v5h-5zM5 -20h5v5h-5zM20 -20h10v5h-10zM60 -20h30v5h-30zM5 -15h5v5h-5zM30 -15h10v5h-10zM55 -15h5v5h-5zM65 -15h10v5h-10zM90 -15h5v5h-5zM5 -10h5v5h-5zM40 -10h15v5h-15zM60 -10h5v5h-5zM85 -10h5v5h-5zM10 -5h5v5h-5zM50 -5h5v5h-5zM60 -5h5v5h-5zM90 -5h10v5h-10zM10 0h5v5h-5zM55 0h5v5h-5zM100 0h5v5h-5zM10 5h5v5h-5zM50 5h5v5h-5zM100 5h5v5h-5zM5 10h10v5h-10zM50 10h5v5h-5zM100 10h5v5h-5zM-5 15h10v5h-10zM50 15h5v5h-5zM105 15h5v5h-5zM135 15h10v5h-10zM-15 20h10v5h-10zM50 20h5v5h-5zM100 20h5v5h-5zM130 20h5v5h-5zM145 20h5v5h-5zM-20 25h5v5h-5zM50 25h5v5h-5zM100 25h5v5h-5zM125 25h5v5h-5zM150 25h5v5h-5zM-15 30h5v5h-5zM50 30h5v5h-5zM100 30h5v5h-5zM120 30h5v5h-5zM155 30h5v5h-5zM-10 35h10v5h-10zM55 35h5v5h-5zM70 35h20v5h-20zM95 35h5v5h-5zM115 35h5v5h-5zM150 35h5v5h-5zM0 40h5v5h-5zM50 40h20v5h-20zM90 40h5v5h-5zM110 40h5v5h-5zM155 40h5v5h-5zM5 45h5v5h-5zM45 45h5v5h-5zM60 45h10v5h-10zM90 45h5v5h-5zM105 45h5v5h-5zM120 45h10v5h-10zM150 45h5v5h-5zM5 50h5v5h-5zM45 50h5v5h-5zM70 50h5v5h-5zM90 50h5v5h-5zM100 50h5v5h-5zM115 50h35v5h-35zM160 50h5v5h-5zM0 55h5v5h-5zM50 55h5v5h-5zM75 55h5v5h-5zM95 55h5v5h-5zM110 55h5v5h-5zM125 55h10v5h-10zM150 55h10v5h-10zM165 55h5v5h-5zM0 60h5v5h-5zM50 60h15v5h-15zM80 60h5v5h-5zM100 60h10v5h-10zM170 60h10v5h-10zM-5 65h5v5h-5zM50 65h5v5h-5zM65 65h5v5h-5zM85 65h5v5h-5zM100 65h5v5h-5zM180 65h10v5h-10zM0 70h15v5h-15zM50 70h5v5h-5zM60 70h5v5h-5zM70 70h15v5h-15zM90 70h10v5h-10zM190 70h5v5h-5zM15 75h10v5h-10zM55 75h10v5h-10zM85 75h10v5h-10zM190 75h5v5h-5zM10 80h5v5h-5zM25 80h5v5h-5zM60 80h5v5h-5zM85 80h10v5h-10zM185 80h5v5h-5zM5 85h5v5h-5zM30 85h10v5h-10zM65 85h5v5h-5zM90 85h5v5h-5zM125 85h15v5h-15zM180 85h5v5h-5zM0 90h5v5h-5zM40 90h30v5h-30zM90 90h5v5h-5zM12