<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-thrust right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr" style="animation:frShow 0.220s step-end 0s 1"><path fill="#1b1424" d="M70 25h15v5h-15zM60 30h10v5h-10zM85 30h5v5h-5zM55 35h5v5h-5zM80 35h5v5h-5zM55 40h5v5h-5zM85 40h10v5h-10zM50 45h5v5h-5zM95 45h5v5h-5zM45 50h5v5h-5zM95 50h5v5h-5zM45 55h5v5h-5zM95 55h5v5h-5zM45 60h5v5h-5zM100 60h5v5h-5zM45 65h5v5h-5zM95 65h5v5h-5zM45 70h5v5h-5zM95 70h5v5h-5zM45 75h5v5h-5zM95 75h5v5h-5zM50 80h5v5h-5zM90 80h5v5h-5zM50 85h10v5h-10zM75 85h20v5h-20zM45 90h5v5h-5zM60 90h15v5h-15zM95 90h5v5h-5zM120 90h10v5h-10zM40 95h10v5h-10zM70 95h5v5h-5zM95 95h5v5h-5zM115 95h5v5h-5zM130 95h5v5h-5zM140 95h5v5h-5zM40 100h40v5h-40zM90 100h30v5h-30zM135 100h5v5h-5zM145 100h10v5h-10zM35 105h5v5h-5zM70 105h5v5h-5zM90 105h5v5h-5zM155 105h5v5h-5zM40 110h35v5h-35zM85 110h55v5h-55zM145 110h10v5h-10zM35 115h5v5h-5zM45 115h5v5h-5zM75 115h10v5h-10zM95 115h5v5h-5zM140 115h5v5h-5zM35 120h5v5h-5zM45 120h5v5h-5zM95 120h5v5h-5zM40 125h60v5h-60zM55 130h5v5h-5zM75 130h5v5h-5zM95 130h5v5h-5zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#2c4f9c" d="M70 30h15v5h-15zM60 35h20v5h-20zM120 95h10v5h-10zM120 100h15v5h-15zM70 115h5v5h-5zM70 120h5v5h-5z"></path><path fill="#aab3c2" d="M60 40h25v5h-25zM55 45h10v5h-10zM70 45h25v5h-25zM50 50h45v5h-45zM50 55h45v5h-45zM50 65h10v5h-10zM50 70h10v5h-10zM55 90h5v5h-5zM55 95h10v5h-10zM55 115h10v5h-10zM85 115h10v5h-10z"></path><path fill="#dfe5ee" d="M65 45h5v5h-5zM75 90h20v5h-20zM75 95h20v5h-20z"></path><path fill="#6f7787" d="M50 60h50v5h-50zM50 75h5v5h-5zM80 100h10v5h-10zM85 105h5v5h-5zM80 130h15v5h-15zM80 135h15v5h-15zM80 140h15v5h-15zM80 145h15v5h-15z"></path><path fill="#e2b591" d="M60 65h10v5h-10zM75 65h10v5h-10zM90 65h5v5h-5zM60 70h10v5h