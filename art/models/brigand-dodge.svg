<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 170" width="480" height="510" shape-rendering="crispEdges" class="figure pose-dodge right " aria-hidden="true"><style><![CDATA[/* ===== Pixel sprites =====
   Each pose is a set of frames (<g class="fr">) shown one at a time. figure.tsx gives every
   frame an inline `animation` with its own delay, so these keyframes only flip visibility.
   Whole-body reactions move in whole sprite pixels (5 artboard units) with step timing. */
.figure, .bust { display: block; overflow: visible; shape-rendering: crispEdges; }
.figure.left { transform: scaleX(-1); }
.figure .fr { visibility: hidden; }
@keyframes fl2 { 0% { visibility: visible; } 50% { visibility: hidden; } }
@keyframes fl4 { 0% { visibility: visible; } 25% { visibility: hidden; } }
@keyframes frShow { from, to { visibility: visible; } }

.figure.pose-hit .fig-root { animation: recoil .45s step-end; }
.figure.pose-die .fig-root { animation: recoil .3s step-end; }
@keyframes recoil { 0% { transform: translateX(-15px); } 35% { transform: translateX(-5px); } 70% { transform: none; } }

/* ===== Pixel portraits: blink and lip-sync overlays ===== */
.bust .ov { visibility: hidden; }
.bust .blinkf { animation: blinkf 5s step-end infinite; animation-delay: var(--blink-delay, 0s); }
.bust.talking .m1 { animation: m1 .42s step-end infinite; }
.bust.talking .m2 { animation: m2 .42s step-end infinite; }
.bust.still .ov { animation: none; }
@keyframes blinkf { 0% { visibility: hidden; } 95% { visibility: visible; } 98% { visibility: hidden; } }
@keyframes m1 { 0% { visibility: hidden; } 25% { visibility: visible; } }
@keyframes m2 { 0% { visibility: hidden; } 50% { visibility: visible; } 75% { visibility: hidden; } }

@media (prefers-reduced-motion: reduce) {
  .figure .fr, .figure .fig-root, .bust .ov { animation: none !important; }
  .figure .fr.rest { visibility: visible; }
}
]]></style><rect class="fig-shadow" x="50" y="160" width="60" height="5" fill="rgba(0,0,0,.35)"></rect><g class="fig-root"><g class="fr" style="animation:frShow 0.080s step-end 0s 1"><path fill="#1b1424" d="M55 40h10v5h-10zM70 40h15v5h-15zM50 45h5v5h-5zM65 45h5v5h-5zM85 45h10v5h-10zM45 50h5v5h-5zM95 50h5v5h-5zM40 55h5v5h-5zM95 55h5v5h-5zM45 60h5v5h-5zM95 60h5v5h-5zM40 65h5v5h-5zM95 65h5v5h-5zM45 70h5v5h-5zM95 70h5v5h-5zM140 70h10v5h-10zM45 75h5v5h-5zM95 75h5v5h-5zM135 75h5v5h-5zM150 75h5v5h-5zM45 80h5v5h-5zM95 80h5v5h-5zM130 80h5v5h-5zM155 80h5v5h-5zM50 85h5v5h-5zM90 85h5v5h-5zM125 85h5v5h-5zM160 85h5v5h-5zM50 90h10v5h-10zM85 90h10v5h-10zM120 90h5v5h-5zM155 90h5v5h-5zM45 95h5v5h-5zM60 95h5v5h-5zM80 95h10v5h-10zM95 95h5v5h-5zM115 95h5v5h-5zM160 95h5v5h-5zM40 100h10v5h-10zM65 100h15v5h-15zM90 100h10v5h-10zM110 100h5v5h-5zM125 100h10v5h-10zM155 100h5v5h-5zM40 105h10v5h-10zM75 105h5v5h-5zM95 105h5v5h-5zM105 105h5v5h-5zM120 105h5v5h-5zM135 105h20v5h-20zM40 110h10v5h-10zM80 110h5v5h-5zM100 110h5v5h-5zM115 110h5v5h-5zM40 115h10v5h-10zM85 115h5v5h-5zM105 115h10v5h-10zM35 120h5v5h-5zM45 120h5v5h-5zM90 120h5v5h-5zM105 120h5v5h-5zM35 125h5v5h-5zM45 125h5v5h-5zM85 125h5v5h-5zM95 125h10v5h-10zM40 130h60v5h-60zM55 135h5v5h-5zM75 135h5v5h-5zM95 135h5v5h-5zM55 140h5v5h-5zM75 140h5v5h-5zM95 140h5v5h-5zM55 145h5v5h-5zM75 145h5v5h-5zM95 145h5v5h-5zM55 150h5v5h-5zM75 150h5v5h-5zM100 150h5v5h-5zM55 155h5v5h-5zM75 155h5v5h-5zM100 155h5v5h-5zM60 160h40v5h-40z"></path><path fill="#2a2420" d="M55 45h10v5h-10zM70 45h15v5h-15zM50 50h45v5h-45zM45 55h15v5h-15zM70 55h25v5h-25zM50 60h45v5h-45zM45 65h25v5h-25zM75 65h15v5h-15zM55 70h10v5h-10zM55 75h5v5h-5zM80 80h15v5h-15zM65 85h25v5h-25zM60 90h25v5h-25zM65 95h15v5h-15z"></path><path fill="#6a6663" d="M60 55h10v5h-10z"></path><path fill="#cf9a74" d="M70 65h5v5h-5zM90 65h5v5h-5zM65 70h5v5h-5zM75 70h10v5h-10zM90 70h5v5h-5zM60 75h10v5h-10zM75 75h10v5h-10zM90 75h5v5h-5zM55 80h25v5h-25zM60 85h5v5h-5zM80 100h10v5h-10zM80 105h15v5h-15zM85 110h15v5h-15zM90 