rr..r.bVb..",".r...hh...F.r..r......","rr..hhh..FF.rrrr...hh.","r.......F....rr....hh.","r..FF......F..rr......","rr......hh.....r..FF..",".r...F..hh.....rr.....",".rr.........F...r....."],houses:[{x:17,y:3,text:`A farmer's wife pushes a stoppered bottle into your hands. "For the road. Give those raiders my regards."`,potion:!0},{x:18,y:6,text:`An old man counts coins onto the table. "They'd only take it anyway. Better it buys you steel."`,gold:300}],objective:{type:"rout"},objectiveText:"Defeat all enemies. Raiders will come for the village to the east",playerStarts:[{x:1,y:7},{x:0,y:8},{x:2,y:8},{x:0,y:9},{x:1,y:9},{x:2,y:9},{x:3,y:9},{x:2,y:6},{x:1,y:6},{x:3,y:8}],recruits:["kael","lyra","brann","seren","mira"],reinforcements:[{turn:3,units:[oe("brigand",1,["iron_axe"],21,13,{ai:"raid",name:"Raider"}),oe("brigand",2,["iron_axe"],20,13,{ai:"raid",name:"Raider"})]}],enemies:[oe("brigand",1,["iron_axe"],5,2),oe("brigand",1,["iron_axe"],7,4),oe("brigand",2,["iron_axe"],10,3),oe("archer",1,["iron_bow"],6,1),oe("brigand",2,["iron_axe"],12,7,{ai:"guard"}),oe("soldier",1,["iron_lance"],10,7,{ai:"guard"}),oe("brigand",4,["steel_axe"],9,5,{ai:"hold",isBoss:!0,name:"Gorran",lookId:"gorran",statBonus:{hp:6,str:2,skl:3,def:2}})],reward:1200,pre:[{speaker:"narrator",text:"Caer Valen, the night of the harvest feast. King Aldric raised a cup to his son Kael, home at last from the northern frontier."},{speaker:"narrator",text:"Before the cup was empty the king was dead. The chancellor's men barred the doors of the great hall, and the queen and the young princess died beside him."},{speaker:"malrec",text:"Long live King Malrec. Find the boy."},{speaker:"narrator",text:"Lyra Ashford, the prince's sworn knight, cut a way out through the kitchens. By dawn Imperial banners flew beside Malrec's on the walls. He had sold the kingdom to buy its crown."},{speaker:"lyra",text:"Keep your head down, my lord. Malrec has put a price on it, and every cutthroat between here and the coast can read."},{speaker:"kael",text:"Let them come. I watched him kill my father, Lyra. I'm done running.",mood:"angry"},{speaker:"lyra",text:`You've been "done running" four times since midnight. We can't take back a crown with two swords. We need people who will stand with you.`},{speaker:"kael",text:"Then we find them. Town by town, if that's what it takes."},{speaker:"lyra",text:"...Start here, then. The village ahead is burning, and those aren't Imperials.",mood:"surprised"},{speaker:"brann",text:"Bandits. Gorran's lot. They follow Malrec's coin like crows follow a plough."},{speaker:"kael",text:"And who are you?"},{speaker:"brann",text:"Brann. Sellsword. I fight for whoever pays, and the losing side usually pays best."},{speaker:"seren",text:"Or you could fight because they're torching my home. I'm Seren. I hunt these hills. Clear the road and my arrows are yours.",mood:"angry"},{speaker:"mira",text:"Please, there are wounded in the chapel. I'm Mira, of Saint Edda's cloister. Keep them off me and I'll keep you all breathing.",mood:"sad"},{speaker:"kael",text:"Then it's settled. We hold the road. Lyra, with me."},{speaker:"narrator",text:"Swords beat axes. Axes beat lances. Lances beat swords. Bows strike from one or two tiles away and pierce flying units."}],post:[{speaker:"seren",text:"The road is clear. The village will live.",mood:"happy"},{speaker:"brann",text:'Gorran had a letter on him. Royal seal. "Find the Valen boy. Alive, if convenient."'},{speaker:"kael",text:"My father's seal, on my death warrant.",mood:"angry"},{speaker:"mira",text:"You can't take back a kingdom with five people, my lord.",mood:"sad"},{speaker:"kael",text:"No. But every village we help is one more that won't sell us to him. Highmoor still remembers my father. If we reach it, the north will rally. That means crossing the Ironvale."},{speaker:"lyra",text:"Then we rest tonight. Tomorrow, the bridge."}]},{number:2,title:"Ironvale Bridge",backdrop:"river",map:["..F...WW...MM...FF..MM",".FF...WW....M......MMM","......BB..F..........M","..H...WW....H.........","......WW..FF..........","..F...WW........F..F..","......BB....H.........",".FF...WW...FF..FF.....","......WW..h.......hh..","..h...WW..........hh..","......WW.....F........","......WW..........FF..","......BB....F.........","......WW.............."],houses:[],objective:{type:"boss"},objectiveText:"Defeat Captain Varn",playerStarts:[{x:1,y:5},{x:0,y:4},{x:1,y:4},{x:0,y:5},{x:0,y:6},{x:1,y:6},{x:2,y:4},{x:2,y:6},{x:0,y:3},{x:1,y:3}],recruits:["tomas","pip"],enemies:[oe("soldier",2,["iron_lance"],6,2,{ai:"guard"}),oe("knight",3,["iron_lance"],7,2,{ai:"guard"}),oe("soldier",2,["iron_lance"],7,6,{ai:"guard"}),oe("archer",2,["iron_bow"],9,3,{ai:"guard"}),oe("fighter",3,["iron_axe"],10,5),oe("soldier",3,["iron_lance"],10,8,{ai:"guard"}),oe("myrmidon",3,["iron_sword"],11,1),oe("archer",3,["iron_bow"],12,3,{ai:"guard"}),oe("soldier",7,["steel_lance"],12,6,{ai:"hold",isBoss:!0,name:"Varn",lookId:"varn",statBonus:{hp:6,str:2,skl:3,def:3}})],reward:1500,pre:[{speaker:"narrator",text:"The Ironvale runs swift and cold. The town on its banks lives off two stone bridges, and Malrec's captain has made it a prison: every family owes a son to the garrison."},{speaker:"varn",text:"Archers to the far bank. Shields on the bridges. Nobody crosses."},{speaker:"tomas",text:"Captain. That man is Aldmere's heir. We were Aldmere's knights, once."},{speaker:"varn",text:"We are King Malrec's knights now, Tomas. Or we are corpses. Choose quickly.",mood:"angry"},{speaker:"tomas",text:"I already have.",mood:"angry"},{speaker:"narrator",text:"Tomas, a knight of old Aldmere pressed into the usurper's service, breaks ranks and rides to meet you."},{speaker:"tomas",text:"Tomas of Brenmoor. I served your father. Let me serve you, with lance and shield."},{speaker:"kael",text:"Welcome back to Aldmere, Sir Tomas.",mood:"happy"},{speaker:"pip",text:"Don't mind me. Varn's stockade had a very bad lock, and I've fixed that for him. Pip. You're the prince nobody's allowed to talk about? I'm coming with you. It's safer than staying.",mood:"happy"},{speaker:"tomas",text:"Varn holds the fort on the east bank. Bring him down and the town's sons go home. Mind the lances: our swords will struggle against them. Brann's axe will not."}],post:[{speaker:"varn",text:"King Malrec... will burn you... the way he burned your family...",mood:"angry"},{speaker:"tomas",text:"Malrec was your father's chancellor for eight years. He let the Empire in so its spears would hold him on the throne."},{speaker:"kael",text:"A murderer wearing my father's crown, propped up by foreign spears.",mood:"angry"},{speaker:"narrator",text:"The people of Ironvale open their gates. Their sons come home, and a dozen of them stay to carry spears for the prince."},{speaker:"lyra",text:"That's how it starts. The Whispering Wood lies between us and Highmoor. We cross it tonight."},{speaker:"seren",text:"Bad idea. Nothing in that wood is friendly after dark.",mood:"sad"},{speaker:"kael",text:"Neither are we.",mood:"happy"}]},{number:3,title:"Whispering Wood",backdrop:"night",map:["FF..F...FF..FFF..FF..F","F..FFF.....F.F..F....F","..F...FF.F.........F..",".F..H....FF.F....F....","...FF..F...F.....V..F.","F.....FFF....F........","..FF.H....F....F...FF.",".F....F..FF.F.....F...","FF..F...F...FFF......F","F..FF.FF..F..FFF..F..F",".F...F....F..F.....F.F","F..F....F......F.....F","..F...F....F.......F..","FF..F....F......F...FF"],houses:[{x:17,y:4,text:'A grey-haired man opens the door with a lance already in his hand. "Heard you coming a mile off. You fight like you mean it, though. Give me a minute to find my boots."',recruit:"osric"}],objective:{type:"survive",turns:8},objectiveText:"Survive until the end of turn 8",playerStarts:[{x:6,y:4},{x:6,y:3},{x:7,y:3},{x:5,y:4},{x:8,y:4},{x:5,y:6},{x:6,y:6},{x:7,y:6},{x:5,y:5},{x:4,y:5}],recruits:["rei"],enemies:[oe("myrmidon",4,["iron_sword"],0,2),oe("brigand",4,["iron_axe"],1,4),oe("archer",4,["iron_bow"],0,6),oe("fighter",4,["iron_axe"],13,2),oe("soldier",4,["iron_lance"],13,4),oe("myrmidon",5,["iron_sword"],12,6)],reinforcements:[{turn:3,units:[oe("brigand",4,["iron_axe"],0,4),oe("archer",4,["iron_bow"],1,1),oe("fighter",5,["iron_axe"],2,9)]},{turn:5,units:[oe("myrmidon",5,["iron_sword"],13,3),oe("soldier",5,["iron_lance"],12,1),oe("cavalier",5,["iron_sword","iron_lance"],12,9)]},{turn:7,units:[oe("brigand",5,["steel_axe"],6,0),oe("archer",5,["iron_bow"],7,9)]}],reward:1800,pre:[{speaker:"narrator",text:"Midnight in the Whispering Wood. The charcoal-burners who live here have hidden their children in the hollow oaks, because Malrec's hunters are searching every tree for the prince."},{speaker:"seren",text:"Someone's out there. Fighting alone.",mood:"surprised"},{speaker:"rei",text:"You're the Valen heir. Malrec's hunters are in this wood, and now they have found you too. I am Rei. I've been following them for a week."},{speaker:"kael",text:"Following them? Why?"},{speaker:"rei",text:"They burned my master's school for sheltering your father's soldiers. I intend to repay them, one at a time. Tonight, it seems, we share enemies.",mood:"angry"},{speaker:"brann",text:"They're closing from both sides. We can't punch through in the dark."},{speaker:"kael",text:"Then we hold until dawn. Form a ring. Protect Mira, and don't let anyone get surrounded."},{speaker:"narrator",text:"More hunters will arrive from the edges of the wood. Forests and forts make the difference here. A light still burns in a lone cabin to the east."}],post:[{speaker:"narrator",text:"Dawn breaks over the treetops. The hunters melt back into the mist, and the charcoal-burners come down from the oaks to thank you."},{speaker:"rei",text:"You held. I'm... impressed. I'll walk with you as far as Highmoor.",mood:"happy"},{speaker:"mira",text:"Only as far as Highmoor?",mood:"surprised"},{speaker:"rei",text:"We'll see. I don't make promises I can't keep."},{speaker:"tomas",text:"Highmoor fell to Lady Morwen, the Empire's duelist. If the town under the castle still remembers your father, it may rise for you."},{speaker:"kael",text:"Then we give it a reason."}]},{number:4,title:"Siege of Highmoor",backdrop:"castle",map:["######################","#.H.#.T.#.H.#.........","#C..#...#..C#..bVb.bb.","##d###.###d##..b.b.b..","......................",".FF....hh...F...F.....","......FF...........bVb",".h..r.....r........b.b","....rrrrrrr..F..F.....","..FF...r..............","..F....r.......F......",".......r....hh........",".F.....rr.............","........r.....F......."],houses:[{x:16,y:2,text:`The castle smith bars the door behind you. "Morwen's men commissioned this. I'd rather you had it."`,weapon:"killer_axe"},{x:20,y:6,text:"A merchant, stranded by the siege, pays you to make the road safe again.",gold:600}],objective:{type:"seize",x:6,y:1},objectiveText:"Seize the throne with Kael",playerStarts:[{x:7,y:8},{x:6,y:8},{x:8,y:8},{x:5,y:8},{x:9,y:8},{x:6,y:9},{x:7,y:9},{x:8,y:9},{x:5,y:9},{x:9,y:9}],recruits:["ilse"],chests:[{x:1,y:2,text:"The garrison pay chest.",gold:1e3},{x:11,y:2,text:"A lance wrapped in oilcloth, kept for a captain who never came back.",weapon:"silver_lance"}],enemies:[oe("myrmidon",8,["killing_edge"],6,1,{ai:"hold",isBoss:!0,name:"Morwen",lookId:"morwen",statBonus:{hp:8,str:2,def:4,skl:2}}),oe("knight",6,["steel_lance"],6,3,{ai:"hold",key:!0}),oe("archer",6,["iron_bow"],2,1,{ai:"guard"}),oe("archer",6,["iron_bow"],10,1,{ai:"guard"}),oe("soldier",6,["iron_lance"],2,2,{ai:"guard"}),oe("fighter",6,["steel_axe"],10,2,{ai:"guard"}),oe("wyvern",6,["iron_axe"],12,4),oe("skyknight",6,["iron_lance"],1,4),oe("cavalier",6,["iron_sword","iron_lance"],9,5,{key:!0}),oe("thief",6,["dagger"],13,5,{ai:"loot",name:"Cutpurse"})],reward:2200,pre:[{speaker:"narrator",text:"Highmoor Castle. Its walls still stand, but the Ashen banner flies above the keep, and the town below pays for every day of it."},{speaker:"ilse",text:"Hold! Who rides under Valen colours?",mood:"surprised"},{speaker:"kael",text:"Kael of House Valen. Who asks?"},{speaker:"ilse",text:"Ilse, last rider of the Highmoor Sky Guard. When the castle fell my wing scattered. I've been striking their patrols from the clouds ever since."},{speaker:"ilse",text:"Morwen holds the throne room. Archers in the towers, a knight at the inner gate, and riders like me in the air. And her men have been digging under the keep for weeks. Nobody knows why."},{speaker:"seren",text:"Riders in the air are my favourite targets. Arrows bite fliers twice as hard.",mood:"happy"},{speaker:"ilse",text:"...Please aim carefully, then.",mood:"sad"},{speaker:"morwen",text:"So the exiled prince comes knocking. Come in, then. Highmoor will make a fine tomb.",mood:"happy"},{speaker:"kael",text:"Lyra, Tomas, break the gate. I'll take the throne."}],post:[{speaker:"narrator",text:"The Ashen banner falls. Above Highmoor, the blue stag of Valen flies again."},{speaker:"tomas",text:"Riders are already coming down from the hills. The north remembers its oaths.",mood:"happy"},{speaker:"narrator",text:"In the cellars beneath the keep, Morwen's diggers had broken into a sealed vault. Something in it had been sleeping."},{speaker:"sable",text:"So you're the ones making all the noise upstairs. Good. Someone had to."},{speaker:"kael",text:"Who are you?"},{speaker:"sable",text:"Sable. Dragonkin. Your Morwen dug me up on Malrec's orders. He has a voice now that dragons can hear, and it tells us to kneel.",mood:"angry"},{speaker:"sable",text:`I didn't. If you're going after him, I'd like to be there when he learns what "no" sounds like.`},{speaker:"ilse",text:"Malrec will hear of this within the day."},{speaker:"kael",text:"Then we go to him. The capital, before he can gather his full army."},{speaker:"lyra",text:"Caer Valen. Home.",mood:"sad"},{speaker:"kael",text:"What's left of it.",mood:"sad"}]},{number:5,title:"The Ashen Throne",backdrop:"ash",map:["MM.#########.MMMMMMMMM","M..#C##T##C#.....MMMMM","..H#G##.##G#H..xxx..MM","......#.#......x.x....",".FF...................","....W.....W......DDDD.","..F.WW...WW.F...DDDDD.","....W.....W.....DDDD..","..h...rrr...h.....D...","......r.r.............","......r.r.........F...","..F...rrr.........xVx.",".......r..........x.x.",".......r....F........."],chests:[{x:4,y:1,text:"Malrec's war chest.",gold:1500},{x:10,y:1,text:"An axe of pale metal, taken from the royal armoury.",weapon:"silver_axe"}],houses:[{x:19,y:11,text:`A knight of the old guard, too wounded to fight, unbuckles his sword among the ruins. "It was the king's gift. Take it home."`,weapon:"silver_sword"}],objective:{type:"survive",turns:6},objectiveText:"Survive until the end of turn 6 while the south gate is cleared. Bound dragonkin will keep coming",playerStarts:[{x:7,y:8},{x:6,y:8},{x:8,y:8},{x:5,y:8},{x:9,y:8},{x:6,y:9},{x:7,y:9},{x:8,y:9},{x:5,y:9},{x:9,y:9}],recruits:["sable"],enemies:[oe("knight",8,["steel_lance"],7,3,{ai:"hold",key:!0}),oe("archer",8,["steel_bow"],2,2,{ai:"guard"}),oe("archer",8,["steel_bow"],12,2,{ai:"guard"}),oe("skyknight",8,["steel_lance"],1,4),oe("wyvern",8,["steel_axe"],11,4),oe("myrmidon",8,["killing_edge"],3,3),oe("fighter",8,["steel_axe"],10,3,{key:!0}),oe("manakete",8,["fire_breath"],7,1,{ai:"guard",name:"Bound Dragonkin"}),oe("manakete",8,["fire_breath"],12,3,{ai:"guard",name:"Bound Dragonkin"})],reinforcements:[{turn:3,units:[oe("manakete",7,["fire_breath"],7,2,{name:"Bound Dragonkin"}),oe("cavalier",8,["steel_sword","steel_lance"],0,4)]},{turn:5,units:[oe("manakete",8,["fire_breath"],7,2,{name:"Bound Dragonkin"})]}],reward:2500,pre:[{speaker:"narrator",text:"Caer Valen. The once-white city is grey with ash. In the great hall, a man sits upon the throne of Aldmere."},{speaker:"malrec",text:"Kael. You came home. I hoped you would.",mood:"happy"},{speaker:"kael",text:"You murdered my family at their own table.",mood:"angry"},{speaker:"malrec",text:"I ended a dynasty of dreamers. Your father sat on the oldest power in this world and used it to keep the peace. I intend to use it."},{speaker:"sable",text:"He means what sleeps under this city. Kael, whatever you do, don't let him call.",mood:"surprised"},{speaker:"malrec",text:"Too late, little sister. Kneel.",mood:"happy"},{speaker:"narrator",text:"The floor shudders. Through the hall doors come shapes with scales and burning eyes: dragonkin, their minds no longer their own."},{speaker:"sable",text:"I can hear it too. It's... loud. I'm holding. Don't ask me how long.",mood:"sad"},{speaker:"malrec",text:"Burn them. I have a kingdom to finish."},{speaker:"lyra",text:"Kael, we can't win this. Hold them here until the south gate is clear, then we run."},{speaker:"kael",text:"...Fine. Everyone stays alive. That is the only order.",mood:"angry"}],post:[{speaker:"narrator",text:"The south gate gives way. Under cover of smoke, Kael's army breaks out of Caer Valen and scatters into the hills."},{speaker:"brann",text:"Dragons. He has dragons. Nobody pays me enough for dragons... and I'm staying anyway."},{speaker:"sable",text:"They aren't his. He's only borrowed their minds. Some of my kin are still fighting him: the sea-wardens, the stone-keepers, the sky-born. Find them before he does."},{speaker:"mira",text:"And the towns between here and there?"},{speaker:"kael",text:"We help every one of them. Malrec rules by fear and foreign spears. We'll win with people who choose us."},{speaker:"lyra",text:"Then we start with the coast. Saltmere."}]}],Ie=(e,t,n,r,s,a)=>({hp:e,str:t,skl:n,spd:r,lck:s,def:a}),gy=[{id:"lord",name:"Lord",weapons:["sword"],moveType:"foot",mov:5,base:Ie(18,5,5,7,5,5),growth:Ie(80,45,45,50,55,30),desc:"Noble swordsman. If the Lord falls, the battle is lost."},{id:"cavalier",name:"Cavalier",weapons:["sword","lance"],moveType:"horse",mov:7,base:Ie(19,5,4,5,3,5),growth:Ie(75,40,40,40,35,30),desc:"Mounted knight. Swords and lances; slowed by forests, blocked by mountains."},{id:"fighter",name:"Fighter",weapons:["axe"],moveType:"foot",mov:5,base:Ie(22,6,2, ,"...That is not how oaths work, Kael.","happy")]},{rank:"B",lines:[$("kael","Still sharpening that sword? It's past midnight."),$("lyra","I can't sleep. Every time I close my eyes I see the capital burning.","sad"),$("kael","...Me too. Sit with me a while?"),$("lyra","Only for a moment. Someone has to keep watch."),$("kael","Then we'll keep it together.","happy")]},{rank:"A",lines:[$("lyra","Do you remember the tourney when we were children? You lost to me four times."),$("kael","Five. I still say the fifth was rigged.","happy"),$("lyra","It wasn't. ...I used to think I'd spend my whole life guarding you from a distance."),$("kael","And now?"),$("lyra","Now I'd rather stand beside you. If you'll have me there."),$("kael","There's nowhere I would rather you be.","happy")]},{rank:"S",lines:[$("kael","Lyra. When this is over, Aldmere will need a ruler. And I will need someone I trust above everyone."),$("lyra","You'll have your whole court, my lord."),$("kael","I don't want a court. I want you. Not as my knight. As my partner."),$("lyra","...You're serious.","surprised"),$("kael","I have never been more serious about anything."),$("lyra","Then yes. A thousand times yes. But I'm still guarding your back in battle.","happy"),$("kael","I would expect nothing less.")]}]},{a:"kael",b:"mira",romance:!0,start:4,ending:"Kael and Mira were wed in the rebuilt chapel of Saint Edda. The new queen founded a hospice in every province, and the king never once escaped a lecture over a scraped knee.",convos:[{rank:"C",lines:[$("mira","Hold still, my lord. That cut needs cleaning."),$("kael","It's nothing."),$("mira",'Everything is "nothing" to you until it festers. Hold. Still.',"angry"),$("kael","...Yes, Sister Mira."),$("mira","Good. You can be taught.","happy")]},{rank:"B",lines:[$("kael","Why did you leave the cloister to follow us?"),$("mira","The abbess told me healing is a quiet vocation. That I should wait for the wounded to come to me."),$("mira","But the wounded were everywhere, and no one was bringing them anywhere."),$("kael","So you came to them."),$("mira","So I came to you. ...To all of you, I mean.")]},{rank:"A",lines:[$("mira","I pray every night, you know. For all of us."),$("kael","Does it help?"),$("mira","Lately I find myself praying mostly for one person. That probably isn't very saintly of me."),$("kael","Who?"),$("mira","...Ask me again when the war is over.","happy")]},{rank:"S",lines:[$("kael","The war is nearly over. So I'm asking again."),$("mira","You remembered."),$("kael","I remember everything you say."),$("mira","Then remember this: it was you. It has always been you, Kael.","happy"),$("kael","Stay with me, Mira. After all of this. Always."),$("mira","Always. Though I am still going to scold you for every scratch.")]}]},{a:"brann",b:"seren",romance:!1,start:0,convos:[{rank:"C",lines:[$("seren","You count your coins after every battle."),$("brann","And you count your arrows. Everybody counts something."),$("seren","My arrows keep me alive. What do coins do?"),$("brann","Feed people. Some of them, anyway.")]},{rank:"B",lines:[$("seren",'"Feed people." What did you mean by that?'),$("brann","Got a sister in Dunmarch. Three little ones, no husband. Every coin I earn goes south."),$("seren","...So the greedy sellsword act is just an act."),$("brann","Tell anyone and I'll deny it.","angry")]},{rank:"A",lines:[$("seren","I sent a pouch to Dunmarch. Half my share."),$("brann","You what? Why?","surprised"),$("seren","Because you'd do it for my village. You already did."),$("brann","...Hunter, you're going to make an old mercenary weep."),$("seren","Do it quietly. You'll scare the deer.","happy")]}]},{a:"mira",b:"brann",romance:!1,start:0,convos:[{rank:"C",lines:[$("mira","Brann, you're bleeding through your bandages again."),$("brann","Bandages are for people who don't swing axes."),$("mira","Bandages are for people who would like to keep their arm."),$("brann","...Fair point.")]},{rank:"B",lines:[$("brann","Why do you patch up folk like me? I've killed men for coin."),$("mira","So has everyone in this camp, now. I don't heal people for being good, Brann."),$("mira","I heal them because they're hurt."),$("brann","That's a dangerous way to live."),$("mira","It's the only way I know.")]},{rank:"A",lines:[$("brann","Made you something."),$("mira","A staff? You carved this?"),$("brann","Yours is cracked. Can't have our healer's stick snapping mid-fight."),$("mira","Brann, it's beautiful.","happy"),$("brann","It's oak. Don't make a fuss.","happy"),$("narrator","Mira received the Oaken Staff.")]}]},{a:"lyra",b:"tomas",romance:!1,start:0,convos:[{rank:"C",lines:[$("tomas","Your stance is good, Lady Lyra. Who trained you?"),$("lyra","Your old captain. He spoke of you, Sir Tomas. Said you were the finest lance in Aldmere."),$("tomas","He was too kind. And I wore the Empire's colours for a year."),$("lyra","You took them off. That's what matters.")]},{rank:"B",lines:[$("tomas","I keep thinking of the men I left on that bridge. Some were my friends."),$("lyra","You couldn't save them."),$("tomas","I didn't try.","sad"),$("lyra","You can't carry every soul, Tomas. Carry the ones still standing beside you.")]},{rank:"A",lines:[$("lyra","Spar with me? I want to learn that feint of yours."),$("tomas",'That "feint" is twenty years of practice.'),$("lyra","Then I had better start now."),$("tomas","Ha! Very well. Shields up, Lady Lyra.","happy")]}]},{a:"rei",b:"ilse",romance:!0,start:0,ending:"Rei and Ilse rebuilt the Highmoor Sky Guard together. Recruits learned the sword on the ground and the lance in the clouds, and never, ever teased their commanders about holding hands.",convos:[{rank:"C",lines:[$("ilse","You fight like the wind. I've never seen a blade move that fast."),$("rei","And you fight from the sky. We both avoid the ground, it seems."),$("ilse","Was that a joke? I didn't think you made jokes.","surprised"),$("rei","Rarely. Don't get used to it.")]},{rank:"B",lines:[$("ilse","You never t cr,{paths:f})},p))]})}),yt={kael:{id:"kael",name:"Kael Valen",title:"Heir of House Valen",age:"31",classId:"lord",height:"180 cm",side:"ally",origin:"Second son of King Aldric. He became heir when his brother died in the border war, then spent his twenties as a garrison captain on the northern frontier. Recalled for the harvest feast, he watched the chancellor's men murder his father, mother and sister, and escaped only because Lyra cut a way out.",personality:"Dry-humoured, stubborn and quietly guilty that he lived when they did not. Listens more than he talks, then decides fast. Treats his companions as equals, which unsettles the knights.",appearance:"Untamed dark-brown hair, a week of stubble and a healed scar through the left eyebrow. Valen-blue coat with gold trim and a navy field cape that has seen better years.",combat:"Footwork duelist with the Valen Rapier. Light, accurate and fast enough to strike twice. He is the one unit that must not fall.",likes:"Early mornings, old maps, plain bread.",dislikes:"Ceremony, and being protected.",quote:"A crown is just a promise with a weight to it.",design:"The cape gives him a strong triangular silhouette that reads at map scale. Blue and gold anchor the player palette. Idle: weight on the back foot, blade held forward and low."},lyra:{id:"lyra",name:"Lyra Ashford",title:"Sworn Knight",age:"32",classId:"cavalier",height:"175 cm",side:"ally",origin:"Daughter of the royal stablemaster. She grew up beside Kael, beat him in five childhood tourneys, and took her knight's oath to his father at sixteen.",personality:"Blunt, loud when she laughs, fiercely protective and secretly sentimental. Has no patience for courtiers or for waiting.",appearance:"Long copper-red hair, freckles, a crimson tabard over light mail. Rides Ember, a chestnut warhorse with a black mane.",combat:"Mounted lancer who can swap between sword and lance to win the weapon triangle. Covers huge distances, but forests slow her and mountains stop her.",likes:"Horses, dawn sparring, sour apples.",dislikes:"Idle waiting, flattery.",quote:"Point me at the problem, my lord.",design:"The horse makes her the widest silhouette in the party. Red against Kael's blue keeps the two leads distinct side by side. The horse's legs gallop during every charge."},brann:{id:"brann",name:"Brann Holt",title:"Sellsword",age:"38",classId:"fighter",height:"191 cm",side:"ally",origin:"Dunmarch-born. Twenty years of contracts across three kingdoms. Every coin he earns goes south to his widowed sister and her three children.",personality:"Gruff, frugal and allergic to speeches. Plays the greedy mercenary so nobody notices how soft he is with children and wounded people.",appearance:"The broadest frame in the company. Thick brown beard, weathered skin, a sleeveless leather jerkin and forearms crossed with old scars.",combat:"Overhead axe chops that hit harder than anyone else. Slow and easy to hit, so he leans on a large health pool. Shreds lance users.",likes:"Honest pay, thick stew, his sister's letters.",dislikes:"Nobles who don't pay, boats.",quote:"Everyone counts something.",design:"A heavyweight silhouette with bare arms. His attack is the longest wind-up in the game, sold with a full-body lean into the chop."},seren:{id:"seren",name:"Seren Vale",title:"Hunter of the Vale",age:"33",classId:"archer",height:"168 cm",side:"ally",origin:"The unofficial guardian of a hill village since her father's death. She has tracked deer, wolves and bandits through the same woods for twenty years.",personality:"Sharp-tongued, patient and practical. Says little, notices everything, and keeps a running count of every arrow she has ever wasted.",appearance:"Dark green hair tied back in a tail, olive hunting leathers, a short hood, and a quiver of grey-fletched arrows on her back.",combat:"Shoots from one or two tiles away, so melee units can't answer her at range. Arrows deal double might to flying units.",likes:"Quiet, honey cakes, fresh tracks.",dislikes:"Wasted arrows, loud men (Brann excepted).",quote:"Breathe out. Then loose.",design:"Lean and vertical, the quiver breaking her outline from behind. Her attack is a full draw and release, followed by a visible arrow crossing the stage."},mira:{id:"mira",name:"Mira Edda",title:"Cleric of Saint Edda",age:"30",classId:"cleric",height:"163 cm",side:"ally",origin:"Twelve years in the cloister of Saint Edda, two of them as a field healer in the border war. She left the cloister when the wounded stopped being brought to her.",personality:"Warm until someone is hurt, then entirely in command. Scolds her patients, sings hymns off-key and laughs at Kael's jokes only when he isn't looking.",appearance:"Pale blonde hair under a white hood, ivory robes with a blue hem, a simple oak staff with a pale crystal.",combat:"Cannot attack. Heals an adjacent ally each turn and must be kept behind the line.",likes:"Herb gardens, hymns, quiet mornings.",dislikes:"Stubborn patients, cruelty.",quote:"Hold still. This will only hurt the first time.",design:"A long robe gives her a soft bell silhouette, the only one without visible legs. Her action raises the staff overhead while the crystal glows."},tomas:{id:"tomas",name:"Tomas of Brenmoor",title:"Knight of Brenmoor",age:"39",classId:"knight",height:"186 cm",side:"ally",origin:"Served Kael's father for fifteen years, was pressed into Imperial service when Brenmoor surrendered, and broke ranks at Ironvale Bridge.",personality:"Steady, formal and quietly ashamed of the year he wore the Empire's colours. Tells terrible jokes with a perfectly straight face.",appearance:"Grey-streaked hair under an open helm with a blue plume, a square stubbled jaw, full plate with a Valen-blue tabard.",combat:"The party's wall. Very high defense and low speed, four tiles of movement. Holds chokepoints and soaks hits for everyone else.",likes:"Polished armour, routine, a good pipe.",dislikes:"Bridges, these days.",quote:"A shield is a promise, too.",design:"Pauldrons widen the shoulders into a blocky silhouette. His lance thrust is short and heavy rather than fast."},rei:{id:"rei",name:"Rei Kasane",title:"Wandering Blade",age:"34",classId:"myrmidon",height:"170 cm",side:"ally",origin:"Senior student of an eastern hill sword school. When the Empire burned her master's school she started hunting the unit responsible, one soldier at a time.",personality:"Laconic, precise and impatient with wasted motion, including wasted words. Her warmth comes out in actions, rarely in speech.",appearance:"Black hair in a high ponytail, a violet fighting gi with a silver sash, and a Killing Edge worn at the hip.",combat:"The fastest unit in the party. Almost always strikes twice and has a high critical rate. Fragile if she gets caught.",likes:"Whetstones, plum tea, silence.",dislikes:"Heights, bragging.",quote:"One clean cut is worth ten wild ones.",design:"The ponytail trails her movement and the diagonal sash reads clearly at small sizes. Her slash is the snappiest swing in the game."},ilse:{id:"ilse",name:"Ilse Marrow",title:"Highmoor Sky Guard",age:"35",classId:"skyknight",height:"172 cm",side:"ally",origin:"Last rider of the Highmoor Sky Guard. When the castle fell, her wing scattered and she spent months raiding Imperial patrols alone from the clouds.",personality:"Cheerful, reckless and loud, with a lot of grief tucked behind the jokes. Trusts her pegasus Gale more than most people.",appearance:"Pale blue hair pinned in a bun, white-and-blue light armour, riding Gale, a white pegasus with a frost-blue mane.",combat:"Flies over water, mountains and forests. Strikes isolated targets, but bows deal double damage to her and she gains no terrain bonus.",likes:"Storm clouds, apples for Gale, racing.",dislikes:"Archers, being grounded.",quote:"The sky doesn't care whose banner is flying. I do.",design:"Wings flap continuously and the whole model hovers, so she always reads as airborne. The pale palette stands out against the darker cast."},gorran:{id:"gorran",name:"Gorran",title:"Brigand Chief",age:"37",classId:"brigand",height:"188 cm",side:"enemy",origin:"A deserter from the border war who turned raider. He sells villages, roads and rumours to whoever pays, lately Malrec.",personality:"Cheerful in the way of a man who has never been punished for anything. Cowardly when cornered.",appearance:"Shaggy black hair and beard, a red sash over patched leathers, a notched steel axe.",combat:"Holds the fort in Chapter 1. Hits hard but is clumsy, and swords have the advantage against him.",likes:"Easy marks.",dislikes:"Fair fights.",quote:"Coin's coin, princeling.",design:"A darker, rougher echo of Brann, deliberately: what a sellsword becomes without anyone to send the money to."},varn:{id:"varn",name:"Captain Varn",title:"Imperial Captain",age:"36",classId:"soldier",height:"183 cm",side:"enemy",origin:"Aldmere-born career officer who chose the winning side the night Malrec took the crown. Holds Ironvale for him with Imperial support. Commanded Tomas for a year.",personality:"Pragmatic and contemptuous of sentiment. Believes loyalty is something you rent.",appearance:"Closed helm with a red plume, crimson Imperial tabard over plate, a steel lance.",combat:"Holds the east-bank fort at Ironvale. Lances punish sword users; bring axes.",likes:"Order, promotion.",dislikes:"Deserters.",quote:"We are King Malrec's knights now. Or we are corpses.",design:"Palette-swapped mirror of Tomas's armour in Imperial red, to make the defection read visually."},morwen:{id:"morwen",name:"Lady Morwen",title:"Warden of Highmoor",age:"34",classId:"myrmidon",height:"174 cm",side:"enemy",origin:"An Imperial duelist lent to Malrec and rewarded with Highmoor after it fell. She has never lost a formal duel and considers sieges beneath her. Her men dig beneath the keep on Malrec's orders.",personality:"Cold, theatrical and very patient. Enjoys making her enemies come to her.",appearance:"Long black hair, a plum duelling coat with a crimson cape, and a Killing Edge.",combat:"Never leaves the throne. Fast and crit-heavy; lances and high defense blunt her.",likes:"Ceremony, ultimatums.",dislikes:"Being hurried.",quote:"Highmoor will make a fine tomb.",design:"Same swordmaster frame as Rei, dressed in court colours: the two are meant to feel like a mirror match."},malrec:{id:"malrec",name:"Malrec",title:"The Usurper King",age:"39",classId:"ashlord",height:"185 cm",side:"enemy",origin:"Royal chancellor of Aldmere for eight years. He murdered King Aldric's family at the harvest feast and took the crown, with the Ashen Empire's spears to hold it. He has stolen part of the power of the Dark Dragon sealed beneath Caer Valen, and with it he binds the minds of dragonkin.",personality:"Calm, articulate and certain he is the only adult in the room. Thinks of Aldmere's old kings as dreamers.",appearance:"Prematurely silver hair swept back, a thin scar over one brow, an iron crown, a black coat over armour with an ember-red cape.",combat:"The story's final enemy. Very high stats and the Ashen Blade. In the throne room at Caer Valen he does not fight: he looses the bound dragonkin and leaves.",likes:"Order, silence, being right.",dislikes:"Songs.",quote:"I ended a dynasty of dreamers.",design:"Black and ember against Kael's blue and gold. The crown is the only gold on any enemy, so he reads as a usurper at a glance."}};yt.pip={id:"pip",name:"Pip Marlowe",title:"Lockpick of Dunmarch",age:"30",classId:"thief",height:"163 cm",side:"ally",origin:"Grew up in the Dunmarch rookeries opening doors for people who did not own them. Was in Varn's stockade for exactly that when the bridge fell, and decided the winning side had better locks to practise on.",personality:"Quick, cheerful and entirely unembarrassed. Returns most of what gets borrowed.",appearance:"Small and wiry under a moss-green hooded cloak, a cloth mask pulled up over the nose, and a belt hung with picks and pouches.",combat:"Fast and frail. Steals weapons and vulneraries from any adjacent enemy that is not quicker, and opens chests, doors and gates with lockpicks, no key needed.",likes:"Complicated locks, other people's lunches.",dislikes:"Dogs. Honest work before noon.",quote:"I didn't take it. I relocated it. To me.",design:"A utility unit: weak in a straight fight, but disarming a dangerous enemy before the knights arrive changes the whole engagement."};yt.sable={id:"sable",name:"Sable",title:"Last of the Dragonkin",age:"Looks 30",classId:"manakete",height:"170 cm",side:"ally",origin:"One of the dragonkin who slept under Highmoor long before there was a kingdom on top of it. Morwen's diggers woke her on Malrec's orders so that he could bind her. She heard his call and refused it, and joins Kael after Highmoor falls. She has not decided what she thinks of the present century.",personality:"Courteous, remote and very old. Treats the war as weather. Fiercely protective of the few people she has bothered to learn the names of.",appearance:"Violet-black hair, two small curved horns, pale skin, and a dark robe. She carries her dragonstone in her hand like a lantern.",combat:"Cannot fight in human form. Spending a dragonstone makes her a violet dragon for three turns, with far higher strength and defence and fire breath that reaches two tiles.",likes:"High places, silence, warm stone.",dislikes:"Being woken. Being ridden.",quote:"I was old when your first king was a rumour. Do try to keep up.",design:"A limited resource: three dragonstones a battle is nine turns of the strongest unit in the army, and a liability the rest of the time."};yt.osric={id:"osric",name:"Osric Hale",title:"Woodward of the Whispering Wood",age:"39",classId:"soldier",height:"184 cm",side:"ally",origin:"A sergeant of the old royal levy who took a woodward's post after the border war and has kept the Whispering Wood for twelve years. He only joins if someone knocks on his door.",personality:"Dry, unhurried, and allergic to speeches. Counts everything: paces, arrows, the days since he last had to kill anyone.",appearance:"Greying cropped hair, a scar through one brow, and his old levy breastplate worn over forester's green.",combat:"A steady lance on foot. No mount, no tricks; he holds a line and is hard to move off it.",likes:"Split oak, quiet mornings, a well-kept edge.",dislikes:"Banners, and the men who wave them.",quote:"Twelve years I kept this wood. Suppose I can keep you lot alive for a few weeks.",design:"The only companion who is not met in the story: he waits in a house on the edge of the Chapter 3 map and is missed entirely if no one visits."};yt.nerys={id:"nerys",name:"Nerys",title:"Warden of Saltmere",age:"Looks 28",classId:"manakete",height:"172 cm",side:"ally",origin:"A water dragonkin who has guarded Saltmere's fishing fleet for a century without the town ever learning her name. When Malrec's call came she held on by staying in the cold deep water, where his voice is faint.",personality:"Dry, private and allergic to gratitude. Shows affection by fixing things nobody asked her to fix.",appearance:"Sea-blue hair worn loose, small pale horns, and a deep-blue robe that is always a little damp at the hem.",combat:"Cannot fight in human form. As a water dragon her Tide Breath reaches two tiles and almost never misses, though it hits less hard than fire.",likes:"Cold water, quiet harbours, salted fish.",dislikes:"Being thanked. Shallow water.",quote:"Don't thank me. Just stop sinking.",design:"Cool blues beside Sable's violet. The accurate dragon: lower might, very high hit."};yt.garrow={id:"garrow",name:"Garrow",title:"Stone-Keeper of Deepforge",age:"Looks 45",classId:"manakete",height:"196 cm",side:"ally",origin:"An earth dragonkin who lived under the Deepforge hills before there were miners in them. Bound by Malrec and made to dig toward the Dark Dragon's seal, he worked for a year before he found the will to put the pick down.",personality:"Slow to speak, slower to anger, impossible to move once decided. Carries the guilt of every tunnel he dug.",appearance:"The broadest of the dragonkin: weathered brown skin, earth-brown hair and beard, short horns like chipped stone, and a miner's leather apron.",combat:"Cannot fight in human form. As an earth dragon his Stone Breath hits harder than any other breath and breaks armour, but reaches only one tile.",likes:"Warm stone, honest work, long silences.",dislikes:"Tunnels. Being hurried.",quote:"I dug for him for a year. I'll spend the rest of my life filling it in.",design:"A heavy, grounded silhouette among the dragonkin. Short range and huge damage: he has to be walked into position."};yt.kestrel={id:"kestrel",name:"Kestrel",title:"Sky-Born of Galewatch",age:"Looks 25",classId:"manakete",height:"168 cm",side:"ally",origin:"A wind dragonkin from the peaks above Galewatch who spent decades flying behind the Sky Guard's formations for fun. Malrec's voice cannot reach far above the clouds, so Kestrel simply refused to come down.",personality:"Restless, talkative and allergic to standing still. Jokes through fear. Fiercely loyal to anyone who can keep up.",appearance:"Pale mint hair blown permanently sideways, swept-back horns, and light green flying leathers.",combat:"Cannot fight in human form. As a wind dragon the Gale Breath reaches three tiles and is deadly to fliers, but hits lighter than the others.",likes:"Storms, races, Ilse's formations.",dislikes:"Ceilings. Waiting.",quote:"Keep up or get out of my sky.",design:"Light and quick-looking; the hair and horns lean back as if always in a headwind."};yt.aurelie={id:"aurelie",name:"Aurelie",title:"Goddess of Solenne",age:"Looks 22",classId:"manakete",height:"165 cm",side:"ally",origin:"A light dragonkin found as an infant on the temple steps of Solenne and raised as its living goddess. Nobody in Solenne knew what she was, Aurelie least of all. Malrec wants her light to complete his hold over the dragonkin.",personality:"Serene in public, endlessly curious in private. Has never been allowed to be bad at anything, and finds it thrilling.",appearance:"Pale gold hair to the waist, small ivory horns, and a white and gold temple robe she keeps trying to swap for something practical.",combat:"Cannot fight in human form. As a light dragon her Radiant Breath reaches two tiles and hits hard and true.",likes:"Bread, questions, being called by her name.",dislikes:"Kneeling. Being kept safe.",quote:"Please stop kneeling. I'd much rather you passed the bread.",design:"White and gold, the brightest figure in the cast. In dragon form she is the light dragon."};const Ur=Object.fromEntries([["brigand","Ashen Brigand","Raiders paid in Malrec's coin to hunt the prince. Mostly deserters and desperate farmers.","Axes. Strong and inaccurate; swords beat them. They carry torches, and they are the only enemies who burn houses."],["fighter","Imperial Axeman","Shock infantry recruited from the Empire's mining provinces.","Heavy axes. They break lance lines."],["soldier","Imperial Soldier","The backbone of the Ashen Legion: conscripts in red tabards, many of them Aldmere-born.","Lances. Dangerous to sword users."],["knight","Imperial Knight","Armoured veterans who hold gates and bridges.","Very high defense, slow. Use axes or forged weapons."],["myrmidon","Ashen Blade","Duelists from the Empire's fencing schools, lent to Malrec.","Fast swords with high critical rates."],["archer","Imperial Archer","Tower garrison bowmen.","Range 1–2. Keep fliers away from them."],["cavalier","Imperial Cavalier","Mounted raiders who run down stragglers.","Swords and lances, high movement."],["thief","Ashen Cutpurse","Camp followers who slip into a castle ahead of the army for whatever is not nailed down.","They head straight for the treasure chests and empty them. Defeat one that has looted and it drops everything it took."],["manakete","Bound Dragonkin","One of the old dragon-blooded, its mind bound to Malrec's will by the stolen power of the Dark Dragon.","Harmless until it ch
