",2,["iron_bow"],9,3,{ai:"guard"}),ne("fighter",3,["iron_axe"],10,5),ne("soldier",3,["iron_lance"],10,8,{ai:"guard"}),ne("myrmidon",3,["iron_sword"],11,1),ne("archer",3,["iron_bow"],12,3,{ai:"guard"}),ne("soldier",7,["steel_lance"],12,6,{ai:"hold",isBoss:!0,name:"Varn",lookId:"varn",statBonus:{hp:6,str:2,skl:3,def:3}})],reward:1500,pre:[{speaker:"narrator",text:"The Ironvale runs swift and cold. Its two stone bridges are the only crossing for fifty leagues, and the Empire knows it."},{speaker:"varn",text:"Archers to the far bank. Shields on the bridges. Nobody crosses."},{speaker:"tomas",text:"Captain. That man is Aldmere's heir. We were Aldmere's knights, once."},{speaker:"varn",text:"We are the Empire's knights now, Tomas. Or we are corpses. Choose quickly.",mood:"angry"},{speaker:"tomas",text:"I already have.",mood:"angry"},{speaker:"narrator",text:"Tomas, a knight of old Aldmere pressed into Imperial service, breaks ranks and rides to meet you."},{speaker:"tomas",text:"Tomas of Brenmoor. I served your father. Let me serve you, with lance and shield."},{speaker:"kael",text:"Welcome back to Aldmere, Sir Tomas.",mood:"happy"},{speaker:"tomas",text:"Varn holds the fort on the east bank. Bring him down and his men will scatter. Mind the lances: our swords will struggle against them. Brann's axe will not."}],post:[{speaker:"varn",text:"The Regent... will burn you all... just like the capital...",mood:"angry"},{speaker:"tomas",text:"Malrec. The Ash Regent. He opened the gates of Caer Valen from the inside."},{speaker:"kael",text:"A traitor wearing my father's crown.",mood:"angry"},{speaker:"lyra",text:"Then we take it back. The Whispering Wood lies between us and Highmoor. We cross it tonight."},{speaker:"seren",text:"Bad idea. Nothing in that wood is friendly after dark.",mood:"sad"},{speaker:"kael",text:"Neither are we.",mood:"happy"}]},{number:3,title:"Whispering Wood",backdrop:"night",map:["FF..F...FF..FFF..FF..F","F..FFF.....F.F..F....F","..F...FF.F.........F..",".F..H....FF.F....F....","...FF..F...F.....V..F.","F.....FFF....F........","..FF.H....F....F...FF.",".F....F..FF.F.....F...","FF..F...F...FFF......F","F..FF.FF..F..FFF..F..F",".F...F....F..F.....F.F","F..F....F......F.....F","..F...F....F.......F..","FF..F....F......F...FF"],houses:[{x:17,y:4,text:'A grey-haired man opens the door with a lance already in his hand. "Heard you coming a mile off. You fight like you mean it, though. Give me a minute to find my boots."',recruit:"osric"}],objective:{type:"survive",turns:8},objectiveText:"Survive until the end of turn 8",playerStarts:[{x:6,y:4},{x:6,y:3},{x:7,y:3},{x:5,y:4},{x:8,y:4},{x:5,y:6},{x:6,y:6},{x:7,y:6},{x:5,y:5},{x:4,y:5}],recruits:["rei"],enemies:[ne("myrmidon",4,["iron_sword"],0,2),ne("brigand",4,["iron_axe"],1,4),ne("archer",4,["iron_bow"],0,6),ne("fighter",4,["iron_axe"],13,2),ne("soldier",4,["iron_lance"],13,4),ne("myrmidon",5,["iron_sword"],12,6)],reinforcements:[{turn:3,units:[ne("brigand",4,["iron_axe"],0,4),ne("archer",4,["iron_bow"],1,1),ne("fighter",5,["iron_axe"],2,9)]},{turn:5,units:[ne("myrmidon",5,["iron_sword"],13,3),ne("soldier",5,["iron_lance"],12,1),ne("cavalier",5,["iron_sword","iron_lance"],12,9)]},{turn:7,units:[ne("brigand",5,["steel_axe"],6,0),ne("archer",5,["iron_bow"],7,9)]}],reward:1800,pre:[{speaker:"narrator",text:"Midnight. Mist curls between the trees. Somewhere ahead, steel rings against steel."},{speaker:"seren",text:"Someone's out there. Fighting alone.",mood:"surprised"},{speaker:"rei",text:"You're the Valen heir. The Empire has hunters in this wood, and they have found you too. I am Rei. I've been following them for a week."},{speaker:"kael",text:"Following them? Why?"},{speaker:"rei",text:"They burned my master's school. I intend to repay them, one at a time. Tonight, it seems, we share enemies.",mood:"angry"},{speaker:"brann",text:"They're closing from both sides. We can't punch through in the dark."},{speaker:"kael",text:"Then we hold until dawn. Form a ring. Protect Mira, and don't let anyone get surrounded."},{speaker:"narrator",text:"More hunters will arrive from the edges of the wood. Forests and forts make the difference here."}],post:[{speaker:"narrator",text:"Dawn breaks over the treetops. The Imperial hunters melt back into the mist."},{speaker:"rei",text:"You held. I'm... impressed. I'll walk with you as far as Highmoor.",mood:"happy"},{speaker:"mira",text:"Only as far as Highmoor?",mood:"surprised"},{speaker:"rei",text:"We'll see. I don't make promises I can't keep."},{speaker:"tomas",text:"Highmoor is under siege. Lady Morwen commands the garrison inside. If the castle has fallen, our last hope fell with it."},{speaker:"kael",text:"Then we take it back ourselves."}]},{number:4,title:"Siege of Highmoor",backdrop:"castle",map:["######################","#.H.#.T.#.H.#.........","#C..#...#..C#..bVb.bb.","##d###.###d##..b.b.b..","......................",".FF....hh...F...F.....","......FF...........bVb",".h..r.....r........b.b","....rrrrrrr..F..F.....","..FF...r..............","..F....r.......F......",".......r....hh........",".F.....rr.............","........r.....F......."],houses:[{x:16,y:2,text:`The castle smith bars the door behind you. "Morwen's men commissioned this. I'd rather you had it."`,weapon:"killer_axe"},{x:20,y:6,text:"A merchant, stranded by the siege, pays you to make the road safe again.",gold:600}],objective:{type:"seize",x:6,y:1},objectiveText:"Seize the throne with Kael",playerStarts:[{x:7,y:8},{x:6,y:8},{x:8,y:8},{x:5,y:8},{x:9,y:8},{x:6,y:9},{x:7,y:9},{x:8,y:9},{x:5,y:9},{x:9,y:9}],recruits:["ilse","sable"],chests:[{x:1,y:2,text:"The garrison pay chest.",gold:1e3},{x:11,y:2,text:"A lance wrapped in oilcloth, kept for a captain who never came back.",weapon:"silver_lance"}],enemies:[ne("myrmidon",8,["killing_edge"],6,1,{ai:"hold",isBoss:!0,name:"Morwen",lookId:"morwen",statBonus:{hp:8,str:2,def:4,skl:2}}),ne("knight",6,["steel_lance"],6,3,{ai:"hold",key:!0}),ne("archer",6,["iron_bow"],2,1,{ai:"guard"}),ne("archer",6,["iron_bow"],10,1,{ai:"guard"}),ne("soldier",6,["iron_lance"],2,2,{ai:"guard"}),ne("fighter",6,["steel_axe"],10,2,{ai:"guard"}),ne("wyvern",6,["iron_axe"],12,4),ne("skyknight",6,["iron_lance"],1,4),ne("cavalier",6,["iron_sword","iron_lance"],9,5,{key:!0}),ne("thief",6,["dagger"],13,5,{ai:"loot",name:"Cutpurse"})],reward:2200,pre:[{speaker:"narrator",text:"Highmoor Castle. Its walls still stand, but the Ashen banner flies above the keep."},{speaker:"ilse",text:"Hold! Who rides under Valen colours?",mood:"surprised"},{speaker:"kael",text:"Kael of House Valen. Who asks?"},{speaker:"ilse",text:"Ilse, last rider of the Highmoor Sky Guard. When the castle fell my wing scattered. I've been striking their patrols from the clouds ever since."},{speaker:"ilse",text:"Morwen holds the throne room. Archers in the towers, a knight at the inner gate, and riders like me in the air."},{speaker:"seren",text:"Riders in the air are my favourite targets. Arrows bite fliers twice as hard.",mood:"happy"},{speaker:"ilse",text:"...Please aim carefully, then.",mood:"sad"},{speaker:"morwen",text:"So the exiled prince comes knocking. Come in, then. Highmoor will make a fine tomb.",mood:"happy"},{speaker:"kael",text:"Lyra, Tomas, break the gate. I'll take the throne."}],post:[{speaker:"narrator",text:"The Ashen banner falls. Above Highmoor, the blue stag of Valen flies again."},{speaker:"tomas",text:"Riders are already coming down from the hills. The north remembers its oaths.",mood:"happy"},{speaker:"ilse",text:"Malrec will hear of this within the day. He'll come himself."},{speaker:"kael",text:"No. We go to him. The capital, before he can gather his full army."},{speaker:"lyra",text:"Caer Valen. Home.",mood:"sad"},{speaker:"kael",text:"What's left of it.",mood:"sad"}]},{number:5,title:"The Ashen Throne",backdrop:"ash",map:["MM.#########.MMMMMMMMM","M..#C##T##C#.....MMMMM","..H#G##.##G#H..xxx..MM","......#.#......x.x....",".FF...................","....W.....W......DDDD.","..F.WW...WW.F...DDDDD.","....W.....W.....DDDD..","..h...rrr...h.....D...","......r.r.............","......r.r.........F...","..F...rrr.........xVx.",".......r..........x.x.",".......r....F........."],chests:[{x:4,y:1,text:"The regent's war chest.",gold:1500},{x:10,y:1,text:"An axe of pale metal, taken from the royal armoury.",weapon:"silver_axe"}],houses:[{x:19,y:11,text:`A knight of the old guard, too wounded to fight, unbuckles his sword among the ruins. "It was the king's gift. Take it home."`,weapon:"silver_sword"}],objective:{type:"boss"},objectiveText:"Defeat Malrec, the Ash Regent",playerStarts:[{x:7,y:8},{x:6,y:8},{x:8,y:8},{x:5,y:8},{x:9,y:8},{x:6,y:9},{x:7,y:9},{x:8,y:9},{x:5,y:9},{x:9,y:9}],enemies:[ne("ashlord",10,["ashen_blade"],7,1,{ai:"hold",isBoss:!0,name:"Malrec",lookId:"malrec",statBonus:{hp:4}}),ne("knight",8,["steel_lance"],7,3,{ai:"hold",key:!0}),ne("archer",8,["steel_bow"],2,2,{ai:"guard"}),ne("archer",8,["steel_bow"],12,2,{ai:"guard"}),ne("skyknight",8,["steel_lance"],1,4),ne("wyvern",8,["steel_axe"],11,4),ne("myrmidon",8,["killing_edge"],3,3),ne("fighter",8,["steel_axe"],10,3,{key:!0}),ne("cavalier",8,["steel_sword","steel_lance"],5,4),ne("manakete",8,["fire_breath"],12,3,{ai:"guard",name:"Ashen Dragonkin"})],reward:0,pre:[{speaker:"narrator",text:"Caer Valen. The once-white city is grey with ash. In the great hall, a man sits upon the throne of Aldmere."},{speaker:"malrec",text:"Kael. You have your father's stubbornness. It killed him, you know.",mood:"happy"},{speaker:"kael",text:"You opened the gates. You killed him.",mood:"angry"},{speaker:"malrec",text:"I ended a dynasty of dreamers. The Empire brings order. Aldmere brought only songs."},{speaker:"mira",text:"Order built on ashes isn't order. It's a graveyard.",mood:"angry"},{speaker:"malrec",text:"Then let it be yours. Guards!",mood:"angry"},{speaker:"brann",text:"This is it, then. No purse in the world is worth this... and I'm staying anyway."},{speaker:"kael",text:"Stay together, everyone. We end this today.",mood:"angry"}],post:[{speaker:"malrec",text:"Impossible... a garrison captain... and a band of strays...",mood:"surprised"},{speaker:"kael",text:"Not strays. Friends.",mood:"happy"},{speaker:"narrator",text:"With the Ash Regent fallen, the Imperial occupation crumbled within the month. Aldmere was free."}]}],xe=(e,t,n,r,s,a)=>({hp:e,str:t,skl:n,spd:r,lck:s,def:a}),gg=[{id:"lord",name:"Lord",weapons:["sword"],moveType:"foot",mov:5,base:xe(18,5,5,7,5,5),growth:xe(80,45,45,50,55,30),desc:"Noble swordsman. If the Lord falls, the battle is lost."},{id:"cavalier",name:"Cavalier",weapons:["sword","lance"],moveType:"horse",mov:7,base:xe(19,5,4,5,3,5),growth:xe(75,40,40,40,35,30),desc:"Mounted knight. Swords and lances; slowed by forests, blocked by mountains."},{id:"fighter",name:"Fighter",weapons:["axe"],moveType:"foot",mov:5,base:xe(22,6,2,3,1,3),growth:xe(90,55,30,30,25,20),desc:"Hard-hitting axe user."},{id:"brigand",name:"Brigand",weapons:["axe"],moveType:"foot",mov:5,raids:!0,base:xe(20,5,1,3,0,2),growth:xe(85,50,20,30,15,20),desc:"Axe-wielding raider with a torch. The only class that burns houses."},{id:"soldier",name:"Soldier",weapons:["lance"],moveType:"foot",mov:5,base:xe(18,4,3,3,1,4),growth:xe(75,40,35,30,20,30),desc:"Imperial footman with a lance."},{id:"knight",name:"Knight",weapons:["lance"],moveType:"armor",mov:4,base:xe(20,6,3,1,1,9),growth:xe(85,45,30,15,20,55),desc:"Heavily armored lancer. Slow but sturdy."},{id:"myrmidon",name:"Myrmidon",weapons:["sword"],moveType:"foot",mov:5,base:xe(17,4,7,9,3,2),growth:xe(65,35,55,55,40,20),desc:"Swift swordmaster with a keen eye for criticals."},{id:"archer",name:"Archer",weapons:["bow"],moveType:"foot",mov:5,base:xe(17,4,5,4,2,2),growth:xe(60,40,55,45,35,20),desc:"Attacks from 1–2 tiles. Deadly against fliers."},{id:"cleric",name:"Cleric",weapons:["staff"],moveType:"foot",mov:5,base:xe(16,1,5,6,7,2),growth:xe(55,15,50,45,60,15),desc:"Heals adjacent allies. Cannot attack."},{id:"skyknight",name:"Sky Knigh ouette that reads at map scale. Blue and gold anchor the player palette. Idle: weight on the back foot, blade held forward and low."},lyra:{id:"lyra",name:"Lyra Ashford",title:"Sworn Knight",age:"32",classId:"cavalier",height:"175 cm",side:"ally",origin:"Daughter of the royal stablemaster. She grew up beside Kael, beat him in five childhood tourneys, and took her knight's oath to his father at sixteen.",personality:"Blunt, loud when she laughs, fiercely protective and secretly sentimental. Has no patience for courtiers or for waiting.",appearance:"Long copper-red hair, freckles, a crimson tabard over light mail. Rides Ember, a chestnut warhorse with a black mane.",combat:"Mounted lancer who can swap between sword and lance to win the weapon triangle. Covers huge distances, but forests slow her and mountains stop her.",likes:"Horses, dawn sparring, sour apples.",dislikes:"Idle waiting, flattery.",quote:"Point me at the problem, my lord.",design:"The horse makes her the widest silhouette in the party. Red against Kael's blue keeps the two leads distinct side by side. The horse's legs gallop during every charge."},brann:{id:"brann",name:"Brann Holt",title:"Sellsword",age:"38",classId:"fighter",height:"191 cm",side:"ally",origin:"Dunmarch-born. Twenty years of contracts across three kingdoms. Every coin he earns goes south to his widowed sister and her three children.",personality:"Gruff, frugal and allergic to speeches. Plays the greedy mercenary so nobody notices how soft he is with children and wounded people.",appearance:"The broadest frame in the company. Thick brown beard, weathered skin, a sleeveless leather jerkin and forearms crossed with old scars.",combat:"Overhead axe chops that hit harder than anyone else. Slow and easy to hit, so he leans on a large health pool. Shreds lance users.",likes:"Honest pay, thick stew, his sister's letters.",dislikes:"Nobles who don't pay, boats.",quote:"Everyone counts something.",design:"A heavyweight silhouette with bare arms. His attack is the longest wind-up in the game, sold with a full-body lean into the chop."},seren:{id:"seren",name:"Seren Vale",title:"Hunter of the Vale",age:"33",classId:"archer",height:"168 cm",side:"ally",origin:"The unofficial guardian of a hill village since her father's death. She has tracked deer, wolves and bandits through the same woods for twenty years.",personality:"Sharp-tongued, patient and practical. Says little, notices everything, and keeps a running count of every arrow she has ever wasted.",appearance:"Dark green hair tied back in a tail, olive hunting leathers, a short hood, and a quiver of grey-fletched arrows on her back.",combat:"Shoots from one or two tiles away, so melee units can't answer her at range. Arrows deal double might to flying units.",likes:"Quiet, honey cakes, fresh tracks.",dislikes:"Wasted arrows, loud men (Brann excepted).",quote:"Breathe out. Then loose.",design:"Lean and vertical, the quiver breaking her outline from behind. Her attack is a full draw and release, followed by a visible arrow crossing the stage."},mira:{id:"mira",name:"Mira Edda",title:"Cleric of Saint Edda",age:"30",classId:"cleric",height:"163 cm",side:"ally",origin:"Twelve years in the cloister of Saint Edda, two of them as a field healer in the border war. She left the cloister when the wounded stopped being brought to her.",personality:"Warm until someone is hurt, then entirely in command. Scolds her patients, sings hymns off-key and laughs at Kael's jokes only when he isn't looking.",appearance:"Pale blonde hair under a white hood, ivory robes with a blue hem, a simple oak staff with a pale crystal.",combat:"Cannot attack. Heals an adjacent ally each turn and must be kept behind the line.",likes:"Herb gardens, hymns, quiet mornings.",dislikes:"Stubborn patients, cruelty.",quote:"Hold still. This will only hurt the first time.",design:"A long robe gives her a soft bell silhouette, the only one without visible legs. Her action raises the staff overhead while the crystal glows."},tomas:{id:"tomas",name:"Tomas of Brenmoor",title:"Knight of Brenmoor",age:"39",classId:"knight",height:"186 cm",side:"ally",origin:"Served Kael's father for fifteen years, was pressed into Imperial service when Brenmoor surrendered, and broke ranks at Ironvale Bridge.",personality:"Steady, formal and quietly ashamed of the year he wore the Empire's colours. Tells terrible jokes with a perfectly straight face.",appearance:"Grey-streaked hair under an open helm with a blue plume, a square stubbled jaw, full plate with a Valen-blue tabard.",combat:"The party's wall. Very high defense and low speed, four tiles of movement. Holds chokepoints and soaks hits for everyone else.",likes:"Polished armour, routine, a good pipe.",dislikes:"Bridges, these days.",quote:"A shield is a promise, too.",design:"Pauldrons widen the shoulders into a blocky silhouette. His lance thrust is short and heavy rather than fast."},rei:{id:"rei",name:"Rei Kasane",title:"Wandering Blade",age:"34",classId:"myrmidon",height:"170 cm",side:"ally",origin:"Senior student of an eastern hill sword school. When the Empire burned her master's school she started hunting the unit responsible, one soldier at a time.",personality:"Laconic, precise and impatient with wasted motion, including wasted words. Her warmth comes out in actions, rarely in speech.",appearance:"Black hair in a high ponytail, a violet fighting gi with a silver sash, and a Killing Edge worn at the hip.",combat:"The fastest unit in the party. Almost always strikes twice and has a high critical rate. Fragile if she gets caught.",likes:"Whetstones, plum tea, silence.",dislikes:"Heights, bragging.",quote:"One clean cut is worth ten wild ones.",design:"The ponytail trails her movement and the diagonal sash reads clearly at small sizes. Her slash is the snappiest swing in the game."},ilse:{id:"ilse",name:"Ilse Marrow",title:"Highmoor Sky Guard",age:"35",classId:"skyknight",height:"172 cm",side:"ally",origin:"Last rider of the Highmoor Sky Guard. When the castle fell, her wing scattered and she spent months raiding Imperial patrols alone from the clouds.",personality:"Cheerful, reckless and loud, with a lot of grief tucked behind the jokes. Trusts her pegasus Gale more than most people.",appearance:"Pale blue hair pinned in a bun, white-and-blue light armour, riding Gale, a white pegasus with a frost-blue mane.",combat:"Flies over water, mountains and forests. Strikes isolated targets, but bows deal double damage to her and she gains no terrain bonus.",likes:"Storm clouds, apples for Gale, racing.",dislikes:"Archers, being grounded.",quote:"The sky doesn't care whose banner is flying. I do.",design:"Wings flap continuously and the whole model hovers, so she always reads as airborne. The pale palette stands out against the darker cast."},gorran:{id:"gorran",name:"Gorran",title:"Brigand Chief",age:"37",classId:"brigand",height:"188 cm",side:"enemy",origin:"A deserter from the border war who turned raider. He sells villages, roads and rumours to whoever pays, lately the Empire.",personality:"Cheerful in the way of a man who has never been punished for anything. Cowardly when cornered.",appearance:"Shaggy black hair and beard, a red sash over patched leathers, a notched steel axe.",combat:"Holds the fort in Chapter 1. Hits hard but is clumsy, and swords have the advantage against him.",likes:"Easy marks.",dislikes:"Fair fights.",quote:"Coin's coin, princeling.",design:"A darker, rougher echo of Brann, deliberately: what a sellsword becomes without anyone to send the money to."},varn:{id:"varn",name:"Captain Varn",title:"Imperial Captain",age:"36",classId:"soldier",height:"183 cm",side:"enemy",origin:"Aldmere-born career officer who chose the winning side the week the Empire crossed the border. Commanded Tomas for a year.",personality:"Pragmatic and contemptuous of sentiment. Believes loyalty is something you rent.",appearance:"Closed helm with a red plume, crimson Imperial tabard over plate, a steel lance.",combat:"Holds the east-bank fort at Ironvale. Lances punish sword users; bring axes.",likes:"Order, promotion.",dislikes:"Deserters.",quote:"We are the Empire's knights now. Or we are corpses.",design:"Palette-swapped mirror of Tomas's armour in Imperial red, to make the defection read visually."},morwen:{id:"morwen",name:"Lady Morwen",title:"Warden of Highmoor",age:"34",classId:"myrmidon",height:"174 cm",side:"enemy",origin:"An Imperial duelist rewarded with Highmoor after it fell. She has never lost a formal duel and considers sieges beneath her.",personality:"Cold, theatrical and very patient. Enjoys making her enemies come to her.",appearance:"Long black hair, a plum duelling coat with a crimson cape, and a Killing Edge.",combat:"Never leaves the throne. Fast and crit-heavy; lances and high defense blunt her.",likes:"Ceremony, ultimatums.",dislikes:"Being hurried.",quote:"Highmoor will make a fine tomb.",design:"Same swordmaster frame as Rei, dressed in court colours: the two are meant to feel like a mirror match."},malrec:{id:"malrec",name:"Malrec",title:"The Ash Regent",age:"39",classId:"ashlord",height:"185 cm",side:"enemy",origin:"Royal chancellor of Aldmere for eight years. He opened the gates of Caer Valen from the inside and now rules as the Empire's regent.",personality:"Calm, articulate and certain he is the only adult in the room. Thinks of Aldmere's old kings as dreamers.",appearance:"Prematurely silver hair swept back, a thin scar over one brow, an iron crown, a black coat over armour with an ember-red cape.",combat:"Final boss. Very high stats and the Ashen Blade. Holds the throne; only one tile of approach.",likes:"Order, silence, being right.",dislikes:"Songs.",quote:"I ended a dynasty of dreamers.",design:"Black and ember against Kael's blue and gold. The crown is the only gold on any enemy, so he reads as a usurper at a glance."}};Zt.pip={id:"pip",name:"Pip Marlowe",title:"Lockpick of Dunmarch",age:"30",classId:"thief",height:"163 cm",side:"ally",origin:"Grew up in the Dunmarch rookeries opening doors for people who did not own them. Was in Varn's stockade for exactly that when the bridge fell, and decided the winning side had better locks to practise on.",personality:"Quick, cheerful and entirely unembarrassed. Returns most of what gets borrowed.",appearance:"Small and wiry under a moss-green hooded cloak, a cloth mask pulled up over the nose, and a belt hung with picks and pouches.",combat:"Fast and frail. Steals weapons and vulneraries from any adjacent enemy that is not quicker, and opens chests, doors and gates with lockpicks, no key needed.",likes:"Complicated locks, other people's lunches.",dislikes:"Dogs. Honest work before noon.",quote:"I didn't take it. I relocated it. To me.",design:"A utility unit: weak in a straight fight, but disarming a dangerous enemy before the knights arrive changes the whole engagement."};Zt.sable={id:"sable",name:"Sable",title:"Last of the Dragonkin",age:"Looks 30",classId:"manakete",height:"170 cm",side:"ally",origin:"One of the dragonkin who slept under Highmoor long before there was a kingdom on top of it. Morwen's garrison woke her by digging too deep. She has not decided what she thinks of the present century.",personality:"Courteous, remote and very old. Treats the war as weather. Fiercely protective of the few people she has bothered to learn the names of.",appearance:"Violet-black hair, two small curved horns, pale skin, and a dark robe. She carries her dragonstone in her hand like a lantern.",combat:"Cannot fight in human form. Spending a dragonstone makes her a violet dragon for three turns, with far higher strength and defence and fire breath that reaches two tiles.",likes:"High places, silence, warm stone.",dislikes:"Being woken. Being ridden.",quote:"I was old when your first king was a rumour. Do try to keep up.",design:"A limited resource: three dragonstones a battle is nine turns of the strongest unit in the army, and a liability the rest of the time."};Zt.osric={id:"osric",name:"Osric Hale",title:"Woodward of the Whispering Wood",age:"39",classId:"soldier",height:"184 cm",side:"ally",origin:"A sergeant of the old royal levy who took a woodward's post after the border war and has kept the Whispering Wood for twelve years. He only joins if someone knocks on his door.",personality:"Dry, unhurried, and allergic to speeches. Counts everything: paces, arrows, the days since he last had to kill anyone.",appearance:"Greying cropped hair, a scar through one brow, and his old levy breastplate worn over forester's green.",combat:"A steady lance on foot. No mount, no tricks; he holds a line and is hard to move off it.",likes:"Split oak, quiet mornings, a well-kept edge.",dislikes:"Banners, and the men who wave them.",quote:"Twelve years I kept this wood. Suppose I can keep you lot alive for a few weeks.",design:"The only companion who is not met in the story: he waits in a house on the edge of the Chapter 3 map and is missed entirely if no one visits."};const Wr=Object.fromEntries([["brigand","Ashen Brigand","Raiders who follow the Imperial army for its leftovers. Mostly deserters and desperate farmers.","Axes. Strong and inaccurate; swords beat them. They carry torches, and they are the only enemies who burn houses."],["fighter","Imperial Axeman","Shock infantry recruited from the Empire's mining provinces.","Heavy axes. They break lance lines."],["soldier","Imperial Soldier","The backbone of the occupation: conscripts in red tabards, many of them Aldmere-born.","Lances. Dangerous to sword users."],["knight","Imperial Knight","Armoured veterans who hold gates and bridges.","Very high defense, slow. Use axes or forged weapons."],["myrmidon","Ashen Blade","Duelists trained in the Regent's own school.","Fast swords with high critical rates."],["archer","Imperial Archer","Tower garrison bowmen.","Range 1–2. Keep fliers away from them."],["cavalier","Imperial Cavalier","Mounted raiders who run down stragglers
