d into Imperial service, breaks ranks and rides to meet you."},{speaker:"tomas",text:"Tomas of Brenmoor. I served your father. Let me serve you, with lance and shield."},{speaker:"kael",text:"Welcome back to Aldmere, Sir Tomas.",mood:"happy"},{speaker:"tomas",text:"Varn holds the fort on the east bank. Bring him down and his men will scatter. Mind the lances: our swords will struggle against them. Brann's axe will not."}],post:[{speaker:"varn",text:"The Regent... will burn you all... just like the capital...",mood:"angry"},{speaker:"tomas",text:"Malrec. The Ash Regent. He opened the gates of Caer Valen from the inside."},{speaker:"kael",text:"A traitor wearing my father's crown.",mood:"angry"},{speaker:"lyra",text:"Then we take it back. The Whispering Wood lies between us and Highmoor. We cross it tonight."},{speaker:"seren",text:"Bad idea. Nothing in that wood is friendly after dark.",mood:"sad"},{speaker:"kael",text:"Neither are we.",mood:"happy"}]},{number:3,title:"Whispering Wood",backdrop:"night",map:["FF..F...FF..FF","F..FFF.....F.F","..F...FF.F....",".F..H....FF.F.","...FF..F...F..","F.....FFF....F","..FF.H....F...",".F....F..FF.F.","FF..F...F...FF","F..FF.FF..F..F"],objective:{type:"survive",turns:8},objectiveText:"Survive until the end of turn 8",playerStarts:[{x:6,y:4},{x:6,y:3},{x:7,y:3},{x:5,y:4},{x:8,y:4},{x:5,y:6},{x:6,y:6},{x:7,y:6}],recruits:["rei"],enemies:[q("myrmidon",4,["iron_sword"],0,2),q("brigand",4,["iron_axe"],1,4),q("archer",4,["iron_bow"],0,6),q("fighter",4,["iron_axe"],13,2),q("soldier",4,["iron_lance"],13,4),q("myrmidon",5,["iron_sword"],12,6)],reinforcements:[{turn:3,units:[q("brigand",4,["iron_axe"],0,4),q("archer",4,["iron_bow"],1,1),q("fighter",5,["iron_axe"],2,9)]},{turn:5,units:[q("myrmidon",5,["iron_sword"],13,3),q("soldier",5,["iron_lance"],12,1),q("cavalier",5,["iron_sword","iron_lance"],12,9)]},{turn:7,units:[q("brigand",5,["steel_axe"],6,0),q("archer",5,["iron_bow"],7,9)]}],reward:1800,pre:[{speaker:"narrator",text:"Midnight. tle:"Sellsword",age:"38",classId:"fighter",height:"191 cm",side:"ally",origin:"Dunmarch-born. Twenty years of contracts across three kingdoms. Every coin he earns goes south to his widowed sister and her three children.",personality:"Gruff, frugal and allergic to speeches. Plays the greedy mercenary so nobody notices how soft he is with children and wounded people.",appearance:"The broadest frame in the company. Thick brown beard, weathered skin, a sleeveless leather jerkin and forearms crossed with old scars.",combat:"Overhead axe chops that hit harder than anyone else. Slow and easy to hit, so he leans on a large health pool. Shreds lance users.",likes:"Honest pay, thick stew, his sister's letters.",dislikes:"Nobles who don't pay, boats.",quote:"Everyone counts something.",design:"A heavyweight silhouette with bare arms. His attack is the longest wind-up in the game, sold with a full-body lean into the chop."},seren:{id:"seren",name:"Seren Vale",title:"Hunter of the Vale",age:"33",classId:"archer",height:"168 cm",side:"ally",origin:"The unofficial guardian of a hill village since her father's death. She has tracked deer, wolves and bandits through the same woods for twenty years.",personality:"Sharp-tongued, patient and practical. Says little, notices everything, and keeps a running count of every arrow she has ever wasted.",appearance:"Dark green hair tied back in a tail, olive hunting leathers, a short hood, and a quiver of grey-fletched arrows on her back.",combat:"Shoots from one or two tiles away, so melee units can't answer her at range. Arrows deal double might to flying units.",likes:"Quiet, honey cakes, fresh tracks.",dislikes:"Wasted arrows, loud men (Brann excepted).",quote:"Breathe out. Then loose.",design:"Lean and vertical, the quiver breaking her outline from behind. Her attack is a full draw and release, followed by a visible arrow crossing the stage."},mira:{id:"mira",name:"Mira Edda",title:"Cleric of Saint Edda",age:"30",classId:"cleric",height:"163 cm",side:"ally",origin:"Twelve years in the cloister of Saint Edda, two of them as a field healer in the border war. She left the cloister when the wounded stopped being brought to her.",personality:"Warm until someone is hurt, then entirely in command. Scolds her patients, sings hymns off-key and laughs at Kael's jokes only when he isn't looking.",appearance:"Pale blonde hair under a white hood, ivory robes with a blue hem, a simple oak staff with a pale crystal.",combat:"Cannot attack. Heals an adjacent ally each turn and must be kept behind the line.",likes:"Herb gardens, hymns, quiet mornings.",dislikes:"Stubborn patients, cruelty.",quote:"Hold still. This will only hurt the first time.",design:"A long robe gives her a soft bell silhouette, the only one without visible legs. Her action raises the staff overhead while the crystal glows."},tomas:{id:"tomas",name:"Tomas of Brenmoor",title:"Knight of Brenmoor",age:"39",classId:"knight",height:"186 cm",side:"ally",origin:"Served Kael's father for fifteen years, was pressed into Imperial service when Brenmoor surrendered, and broke ranks at Ironvale Bridge.",personality:"Steady, formal and quietly ashamed of the year he wore the Empire's colours. Tells terrible jokes with a perfectly straight face.",appearance:"Grey-streaked hair under an open helm with a blue plume, a square stubbled jaw, full plate with a Valen-blue tabard.",combat:"The party's wall. Very high defense and low speed, four tiles of movement. Holds chokepoints and soaks hits for everyone else.",likes:"Polished armour, routine, a good pipe.",dislikes:"Bridges, these days.",quote:"A shield is a promise, too.",design:"Pauldrons widen the shoulders into a blocky silhouette. His lance thrust is short and heavy rather than fast."},rei:{id:"rei",name:"Rei Kasane",title:"Wandering Blade",age:"34",classId:"myrmidon",height:"170 cm",side:"ally",origin:"Senior student of an eastern hill sword school. When the Empire burned her master's school she started hunting the unit responsible, one soldier at a time.",personality:"Laconic, precise and impatient with wasted motion, including wasted words. Her warmth comes out in actions, rarely in speech.",appearance:"Black hair in a high ponytail, a violet fighting gi with a silver sash, and a Killing Edge worn at the hip.",combat:"The fastest unit in the party. Almost always strikes twice and has a high critical rate. Fragile if she gets caught.",likes:"Whetstones, plum tea, silence.",dislikes:"Heights, bragging.",quote:"One clean cut is worth ten wild ones.",design:"The ponytail trails her movement and the diagonal sash reads clearly at small sizes. Her slash is the snappiest swing in the game."},ilse:{id:"ilse",name:"Ilse Marrow",title:"Highmoor Sky Guard",age:"35",classId:"skyknight",height:"172 cm",side:"ally",origin:"Last rider of the Highmoor Sky Guard. When the castle fell, her wing scattered and she spent months raiding Imperial patrols alone from the clouds.",personality:"Cheerful, reckless and loud, with a lot of grief tucked behind the jokes. Trusts her pegasus Gale more than most people.",appearance:"Pale blue hair pinned in a bun, white-and-blue light armour, riding Gale, a white pegasus with a frost-blue mane.",combat:"Flies over water, mountains and forests. Strikes isolated targets, but bows deal double damage to her and she gains no terrain bonus.",likes:"Storm clouds, apples for Gale, racing.",dislikes:"Archers, being grounded.",quote:"The sky doesn't care whose banner is flying. I do.",design:"Wings flap continuously and the whole model hovers, so she always reads as airborne. The pale palette stands out against the darker cast."},gorran:{id:"gorran",name:"Gorran",title:"Brigand Chief",age:"37",classId:"brigand",height:"188 cm",side:"enemy",origin:"A deserter from the border war who turned raider. He sells villages, roads and rumours to whoever pays, lately the Empire.",personality:"Cheerful in the way of a man who has never been punished for anything. Cowardly when cornered.",appearance:"Shaggy black hair and beard, a red sash over patched leathers, a notched steel axe.",combat:"Holds the fort in Chapter 1. Hits hard but is clumsy, and swords have the advantage against him.",likes:"Easy marks.",dislikes:"Fair fights.",quote:"Coin's coin, princeling.",design:"A darker, rougher echo of Brann, deliberately: what a sellsword becomes without anyone to send the money to."},varn:{id:"varn",name:"Captain Varn",title:"Imperial Captain",age:"36",classId:"soldier",height:"183 cm",side:"enemy",origin:"Aldmere-born career officer who chose the winning side the week the Empire crossed the border. Commanded Tomas for a year.",personality:"Pragmatic and contemptuous of sentiment. Believes loyalty is something you rent.",appearance:"Closed helm with a red plume, crimson Imperial tabard over plate, a steel lance.",combat:"Holds the east-bank fort at Ironvale. Lances punish sword users; bring axes.",likes:"Order, promotion.",dislikes:"Deserters.",quote:"We are the Empire's knights now. Or we are corpses.",design:"Palette-swapped mirror of Tomas's armour in Imperial red, to make the defection read visually."},morwen:{id:"morwen",name:"Lady Morwen",title:"Warden of Highmoor",age:"34",classId:"myrmidon",height:"174 cm",side:"enemy",origin:"An Imperial duelist rewarded with Highmoor after it fell. She has never lost a formal duel and considers sieges beneath her.",personality:"Cold, theatrical and very patient. Enjoys making her enemies come to her.",appearance:"Long black hair, a plum duelling coat with a crimson cape, and a Killing Edge.",combat:"Never leaves the throne. Fast and crit-heavy; lances and high defense blunt her.",likes:"Ceremony, ultimatums.",dislikes:"Being hurried.",quote:"Highmoor will make a fine tomb.",design:"Same swordmaster frame as Rei, dressed in court colours: the two are meant to feel like a mirror match."},malrec:{id:"malrec",name:"Malrec",title:"The Ash Regent",age:"39",classId:"ashlord",height:"185 cm",side:"enemy",origin:"Royal chancellor of Aldmere for eight years. He opened the gates of Caer Valen from the inside and now rules as the Empire's regent.",personality:"Calm, articulate and certain he is the only adult in the room. Thinks of Aldmere's old kings as dreamers.",appearance:"Prematurely silver hair swept back, a thin scar over one brow, an iron crown, a black coat over armour with an ember-red cape.",combat:"Final boss. Very high stats and the Ashen Blade. Holds the throne; only one tile of approach.",likes:"Order, silence, being right.",dislikes:"Songs.",quote:"I ended a dynasty of dreamers.",design:"Black and ember against Kael's blue and gold. The crown is the only gold on any enemy, so he reads as a usurper at a glance."}},wr=Object.fromEntries([["brigand","Ashen Brigand","Raiders who follow the Imperial army for its leftovers. Mostly deserters and desperate farmers.","Axes. Strong and inaccurate; swords beat them."],["fighter","Imperial Axeman","Shock infantry recruited from the Empire's mining provinces.","Heavy axes. They break lance lines."],["soldier","Imperial Soldier","The backbone of the occupation: conscripts in red tabards, many of them Aldmere-born.","Lances. Dangerous to sword users."],["knight","Imperial Knight","Armoured veterans who hold gates and bridges.","Very high defense, slow. Use axes or forged weapons."],["myrmidon","Ashen Blade","Duelists trained in the Regent's own school.","Fast swords with high critical rates."],["archer","Imperial Archer","Tower garrison bowmen.","Range 1–2. Keep fliers away from them."],["cavalier","Imperial Cavalier","Mounted raiders who run down stragglers.","Swords and lances, high movement."],["skyknight","Imperial Sky Knight","Pegasus riders taken from conquered kingdoms' stables.","Fly over terrain. Weak to bows."]].map(([e,t,n,r])=>[e,{id:e,name:t,title:"Enemy unit",age:"Late 20s to 30s",classId:e,height:"Varies",side:"archetype",origin:n,personality:"Professional, tired, far from home.",appearance:"Imperial
