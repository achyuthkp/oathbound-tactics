r..r.bVb..",".r...hh...F.r..r......","rr..hhh..FF.rrrr...hh.","r.......F....rr....hh.","r..FF......F..rr......","rr......hh.....r..FF..",".r...F..hh.....rr.....",".rr.........F...r....."],houses:[{x:17,y:3,text:`A farmer's wife pushes a stoppered bottle into your hands. "For the road. Give those raiders my regards."`,potion:!0},{x:18,y:6,text:`An old man counts coins onto the table. "They'd only take it anyway. Better it buys you steel."`,gold:300}],objective:{type:"rout"},objectiveText:"Defeat all enemies. Raiders will come for the village to the east",playerStarts:[{x:1,y:7},{x:0,y:8},{x:2,y:8},{x:0,y:9},{x:1,y:9},{x:2,y:9},{x:3,y:9},{x:2,y:6},{x:1,y:6},{x:3,y:8}],recruits:["kael","lyra","brann","seren","mira"],reinforcements:[{turn:3,units:[Y("brigand",1,["iron_axe"],21,13,{ai:"raid",name:"Raider"}),Y("brigand",2,["iron_axe"],20,13,{ai:"raid",name:"Raider"})]}],enemies:[Y("brigand",1,["iron_axe"],5,2),Y("brigand",1,["iron_axe"],7,4),Y("brigand",2,["iron_axe"],10,3),Y("archer",1,["iron_bow"],6,1),Y("brigand",2,["iron_axe"],12,7,{ai:"guard"}),Y("soldier",1,["iron_lance"],10,7,{ai:"guard"}),Y("brigand",4,["steel_axe"],9,5,{ai:"hold",isBoss:!0,name:"Gorran",lookId:"gorran",statBonus:{hp:6,str:2,skl:3,def:2}})],reward:1200,pre:[{speaker:"narrator",text:"Caer Valen, the night of the harvest feast. King Aldric raised a cup to his son Kael, home at last from the northern frontier."},{speaker:"narrator",text:"Before the cup was empty the king was dead. The chancellor's men barred the doors of the great hall, and the queen and the young princess died beside him."},{speaker:"malrec",text:"Long live King Malrec. Find the boy."},{speaker:"narrator",text:"Lyra Ashford, the prince's sworn knight, cut a way out through the kitchens. By dawn Imperial banners flew beside Malrec's on the walls. He had sold the kingdom to buy its crown."},{speaker:"lyra",text:"Keep your head down, my lord. Malrec has put a price on it, and every cutthroat between here and the coast can read."},{speaker:"kael",text:"Let them come. I watched him kill my father, Lyra. I'm done running.",mood:"angry"},{speaker:"lyra",text:`You've been "done running" four times since midnight. We can't take back a crown with two swords. We need people who will stand with you.`},{speaker:"kael",text:"Then we find them. Town by town, if that's what it takes."},{speaker:"lyra",text:"...Start here, then. The village ahead is burning, and those aren't Imperials.",mood:"surprised"},{speaker:"brann",text:"Bandits. Gorran's lot. They follow Malrec's coin like crows follow a plough."},{speaker:"kael",text:"And who are you?"},{speaker:"brann",text:"Brann. Sellsword. I fight for whoever pays, and the losing side usually pays best."},{speaker:"seren",text:"Or you could fight because they're torching my home. I'm Seren. I hunt these hills. Clear the road and my arrows are yours.",mood:"angry"},{speaker:"mira",text:"Please, there are wounded in the chapel. I'm Mira, of Saint Edda's cloister. Keep them off me and I'll keep you all breathing.",mood:"sad"},{speaker:"kael",text:"Then it's settled. We hold the road. Lyra, with me."},{speaker:"narrator",text:"Swords beat axes. Axes beat lances. Lances beat swords. Bows strike from one or two tiles away and pierce flying units."}],post:[{speaker:"seren",text:"The road is clear. The village will live.",mood:"happy"},{speaker:"brann",text:'Gorran had a letter on him. Royal seal. "Find the Valen boy. Alive, if convenient."'},{speaker:"kael",text:"My father's seal, on my death warrant.",mood:"angry"},{speaker:"mira",text:"You can't take back a kingdom with five people, my lord.",mood:"sad"},{speaker:"kael",text:"No. But every village we help is one more that won't sell us to him. Highmoor still remembers my father. If we reach it, the north will rally. That means crossing the Ironvale."},{speaker:"lyra",text:"Then we rest tonight. Tomorrow, the bridge."}]},{number:2,title:"Ironvale Bridge",backdrop:"river",map:["..F...WW...MM...FF..MM",".FF...WW....M......MMM","......BB..F..........M","..H...WW....H.........","......WW..FF..........","..F...WW........F..F..","......BB....H.........",".FF...WW...FF..FF.....","......WW..h.......hh..","..h...WW..........hh..","......WW.....F........","......WW..........FF..","......BB....F.........","......WW.............."],houses:[],objective:{type:"boss"},objectiveText:"Defeat Captain Varn",playerStarts:[{x:1,y:5},{x:0,y:4},{x:1,y:4},{x:0,y:5},{x:0,y:6},{x:1,y:6},{x:2,y:4},{x:2,y:6},{x:0,y:3},{x:1,y:3}],recruits:["tomas","pip"],enemies:[Y("soldier",2,["iron_lance"],6,2,{ai:"guard"}),Y("knight",3,["iron_lance"],7,2,{ai:"guard"}),Y("soldier",2,["iron_lance"],7,6,{ai:"guard"}),Y("archer",2,["iron_bow"],9,3,{ai:"guard"}),Y("fighter",3,["iron_axe"],10,5),Y("soldier",3,["iron_lance"],10,8,{ai:"guard"}),Y("myrmidon",3,["iron_sword"],11,1),Y("archer",3,["iron_bow"],12,3,{ai:"guard"}),Y("soldier",7,["steel_lance"],12,6,{ai:"hold",isBoss:!0,name:"Varn",lookId:"varn",statBonus:{hp:6,str:2,skl:3,def:3}})],reward:1500,pre:[{speaker:"narrator",text:"The Ironvale runs swift and cold. The town on its banks lives off two stone bridges, and Malrec's captain has made it a prison: every family owes a son to the garrison."},{speaker:"varn",text:"Archers to the far bank. Shields on the bridges. Nobody crosses."},{speaker:"tomas",text:"Captain. That man is Aldmere's heir. We were Aldmere's knights, once."},{speaker:"varn",text:"We are King Malrec's knights now, Tomas. Or we are corpses. Choose quickly.",mood:"angry"},{speaker:"tomas",text:"I already have.",mood:"angry"},{speaker:"narrator",text:"Tomas, a knight of old Aldmere pressed into the usurper's service, breaks ranks and rides to meet you."},{speaker:"tomas",text:"Tomas of Brenmoor. I served your father. Let me serve you, with lance and shield."},{speaker:"kael",text:"Welcome back to Aldmere, Sir Tomas.",mood:"happy"},{speaker:"pip",text:"Don't mind me. Varn's stockade had a very bad lock, and I've fixed that for him. Pip. You're the prince nobody's allowed to talk about? I'm coming with you. It's safer than staying.",mood:"happy"},{speaker:"tomas",text:"Varn holds the fort on the east bank. Bring him down and the town's sons go home. Mind the lances: our swords will struggle against them. Brann's axe will not."}],post:[{speaker:"varn",text:"King Malrec... will burn you... the way he burned your family...",mood:"angry"},{speaker:"tomas",text:"Malrec was your father's chancellor for eight years. He let the Empire in so its spears would hold him on the throne."},{speaker:"kael",text:"A murderer wearing my father's crown, propped up by foreign spears.",mood:"angry"},{speaker:"narrator",text:"The people of Ironvale open their gates. Their sons come home, and a dozen of them stay to carry spears for the prince."},{speaker:"lyra",text:"That's how it starts. The Whispering Wood lies between us and Highmoor. We cross it tonight."},{speaker:"seren",text:"Bad idea. Nothing in that wood is friendly after dark.",mood:"sad"},{speaker:"kael",text:"Neither are we.",mood:"happy"}]},{number:3,title:"Whispering Wood",backdrop:"night",map:["FF..F...FF..FFF..FF..F","F..FFF.....F.F..F....F","..F...FF.F.........F..",".F..H....FF.F....F....","...FF..F...F.....V..F.","F.....FFF....F........","..FF.H....F....F...FF.",".F....F..FF.F.....F...","FF..F...F...FFF......F","F..FF.FF..F..FFF..F..F",".F...F....F..F.....F.F","F..F....F......F.....F","..F...F....F.......F..","FF..F....F......F...FF"],houses:[{x:17,y:4,text:'A grey-haired man opens the door with a lance already in his hand. "Heard you coming a mile off. You fight like you mean it, though. Give me a minute to find my boots."',recruit:"osric"}],objective:{type:"survive",turns:8},objectiveText:"Survive until the end of turn 8",playerStarts:[{x:6,y:4},{x:6,y:3},{x:7,y:3},{x:5,y:4},{x:8,y:4},{x:5,y:6},{x:6,y:6},{x:7,y:6},{x:5,y:5},{x:4,y:5}],recruits:["rei"],enemies:[Y("myrmidon",4,["iron_sword"],0,2),Y("brigand",4,["iron_axe"],1,4),Y("archer",4,["iron_bow"],0,6),Y("fighter",4,["iron_axe"],13,2),Y("soldier",4,["iron_lance"],13,4),Y("myrmidon",5,["iron_sword"],12,6)],reinforcements:[{turn:3,units:[Y("brigand",4,["iron_axe"],0,4),Y("archer",4,["iron_bow"],1,1),Y("fighter",5,["iron_axe"],2,9)]},{turn:5,units:[Y("myrmidon",5,["iron_sword"],13,3),Y("soldier",5,["iron_lance"],12,1),Y("cavalier",5,["iron_sword","iron_lance"],12,9)]},{turn:7,units:[Y("brigand",5,["steel_axe"],6,0),Y("archer",5,["iron_bow"],7,9)]}],reward:1800,pre:[{speaker:"narrator",text:"Midnight in the Whispering Wood. The charcoal-burners who live here have hidden their children in the hollow oaks, because Malrec's hunters are searching every tree for the prince."},{speaker:"seren",text:"Someone's out there. Fighting alone.",mood:"surprised"},{speaker:"rei",text:"You're the Valen heir. Malrec's hunters are in this wood, and now they have found you too. I am Rei. I've been following them for a week."},{speaker:"kael",text:"Following them? Why?"},{speaker:"rei",text:"They burned my master's school for sheltering your father's soldiers. I intend to repay them, one at a time. Tonight, it seems, we share enemies.",mood:"angry"},{speaker:"brann",text:"They're closing from both sides. We can't punch through in the dark."},{speaker:"kael",text:"Then we hold until dawn. Form a ring. Protect Mira, and don't let anyone get surrounded."},{speaker:"narrator",text:"More hunters will arrive from the edges of the wood. Forests and forts make the difference here. A light still burns in a lone cabin to the east."}],post:[{speaker:"narrator",text:"Dawn breaks over the treetops. The hunters melt back into the mist, and the charcoal-burners come down from the oaks to thank you."},{speaker:"rei",text:"You held. I'm... impressed. I'll walk with you as far as Highmoor.",mood:"happy"},{speaker:"mira",text:"Only as far as Highmoor?",mood:"surprised"},{speaker:"rei",text:"We'll see. I don't make promises I can't keep."},{speaker:"tomas",text:"Highmoor fell to Lady Morwen, the Empire's duelist. If the town under the castle still remembers your father, it may rise for you."},{speaker:"kael",text:"Then we give it a reason."}]},{number:4,title:"Siege of Highmoor",backdrop:"castle",map:["######################","#.H.#.T.#.H.#.........","#C..#...#..C#..bVb.bb.","##d###.###d##..b.b.b..","......................",".FF....hh...F...F.....","......FF...........bVb",".h..r.....r........b.b","....rrrrrrr..F..F.....","..FF...r..............","..F....r.......F......",".......r....hh........",".F.....rr.............","........r.....F......."],houses:[{x:16,y:2,text:`The castle smith bars the door behind you. "Morwen's men commissioned this. I'd rather you had it."`,weapon:"killer_axe"},{x:20,y:6,text:"A merchant, stranded by the siege, pays you to make the road safe again.",gold:600}],objective:{type:"seize",x:6,y:1},objectiveText:"Seize the throne with Kael",playerStarts:[{x:7,y:8},{x:6,y:8},{x:8,y:8},{x:5,y:8},{x:9,y:8},{x:6,y:9},{x:7,y:9},{x:8,y:9},{x:5,y:9},{x:9,y:9}],recruits:["ilse"],chests:[{x:1,y:2,text:"The garrison pay chest.",gold:1e3},{x:11,y:2,text:"A lance wrapped in oilcloth, kept for a captain who never came back.",weapon:"silver_lance"}],enemies:[Y("myrmidon",8,["killing_edge"],6,1,{ai:"hold",isBoss:!0,name:"Morwen",lookId:"morwen",statBonus:{hp:8,str:2,def:4,skl:2}}),Y("knight",6,["steel_lance"],6,3,{ai:"hold",key:!0}),Y("archer",6,["iron_bow"],2,1,{ai:"guard"}),Y("archer",6,["iron_bow"],10,1,{ai:"guard"}),Y("soldier",6,["iron_lance"],2,2,{ai:"guard"}),Y("fighter",6,["steel_axe"],10,2,{ai:"guard"}),Y("wyvern",6,["iron_axe"],12,4),Y("skyknight",6,["iron_lance"],1,4),Y("cavalier",6,["iron_sword","iron_lance"],9,5,{key:!0}),Y("thief",6,["dagger"],13,5,{ai:"loot",name:"Cutpurse"})],reward:2200,pre:[{speaker:"narrator",text:"Highmoor Castle. Its walls still stand, but the Ashen banner flies above the keep, and the town below pays for every day of it."},{speaker:"ilse",text:"Hold! Who rides under Valen colours?",mood:"surprised"},{speaker:"kael",text:"Kael of House Valen. Who asks?"},{speaker:"ilse",text:"Ilse, last rider of the Highmoor Sky Guard. When the castle fell my wing scattered. I've been striking their patrols from the clouds ever since."},{speaker:"ilse",text:"Morwen holds the throne room. Archers in the towers, a knight at the inner gate, and riders like me in the air. And her men have been digging under the keep for weeks. Nobody knows why."},{speaker:"seren",text:"Riders in the air are my favourite targets. Arrows bite fliers twice as hard.",mood:"happy"},{speaker:"ilse",text:"...Please aim carefully, then.",mood:"sad"},{speaker:"morwen",text:"So the exiled prince comes knocking. Come in, then. Highmoor will make a fine tomb.",mood:"happy"},{speaker:"kael",text:"Lyra, Tomas, break the gate. I'll take the throne."}],post:[{speaker:"narrator",text:"The Ashen banner falls. Above Highmoor, the blue stag of Valen flies again."},{speaker:"tomas",text:"Riders are already coming down from the hills. The north remembers its oaths.",mood:"happy"},{speaker:"narrator",text:"In the cellars beneath the keep, Morwen's diggers had broken into a sealed vault. Something in it had been sleeping."},{speaker:"sable",text:"So you're the ones making all the noise upstairs. Good. Someone had to."},{speaker:"kael",text:"Who are you?"},{speaker:"sable",text:"Sable. Dragonkin. Your Morwen dug me up on Malrec's orders. He has a voice now that dragons can hear, and it tells us to kneel.",mood:"angry"},{speaker:"sable",text:`I didn't. If you're going after him, I'd like to be there when he learns what "no" sounds like.`},{speaker:"ilse",text:"Malrec will hear of this within the day."},{speaker:"kael",text:"Then we go to him. The capital, before he can gather his full army."},{speaker:"lyra",text:"Caer Valen. Home.",mood:"sad"},{speaker:"kael",text:"What's left of it.",mood:"sad"}]},{number:5,title:"The Ashen Throne",backdrop:"ash",map:["MM.#########.MMMMMMMMM","M..#C##T##C#.....MMMMM","..H#G##.##G#H..xxx..MM","......#.#......x.x....",".FF...................","....W.....W......DDDD.","..F.WW...WW.F...DDDDD.","....W.....W.....DDDD..","..h...rrr...h.....D...","......r.r.............","......r.r.........F...","..F...rrr.........xVx.",".......r..........x.x.",".......r....F........."],chests:[{x:4,y:1,text:"Malrec's war chest.",gold:1500},{x:10,y:1,text:"An axe of pale metal, taken from the royal armoury.",weapon:"silver_axe"}],houses:[{x:19,y:11,text:`A knight of the old guard, too wounded to fight, unbuckles his sword among the ruins. "It was the king's gift. Take it home."`,weapon:"silver_sword"}],objective:{type:"survive",turns:6},objectiveText:"Survive until the end of turn 6 while the south gate is cleared. Bound dragonkin will keep coming",playerStarts:[{x:7,y:8},{x:6,y:8},{x:8,y:8},{x:5,y:8},{x:9,y:8},{x:6,y:9},{x:7,y:9},{x:8,y:9},{x:5,y:9},{x:9,y:9}],recruits:["sable"],enemies:[Y("knight",8,["steel_lance"],7,3,{ai:"hold",key:!0}),Y("archer",8,["steel_bow"],2,2,{ai:"guard"}),Y("archer",8,["steel_bow"],12,2,{ai:"guard"}),Y("skyknight",8,["steel_lance"],1,4),Y("wyvern",8,["steel_axe"],11,4),Y("myrmidon",8,["killing_edge"],3,3),Y("fighter",8,["steel_axe"],10,3,{key:!0}),Y("manakete",8,["fire_breath"],7,1,{ai:"guard",name:"Bound Dragonkin"}),Y("manakete",8,["fire_breath"],12,3,{ai:"guard",name:"Bound Dragonkin"})],reinforcements:[{turn:3,units:[Y("manakete",7,["fire_breath"],7,2,{name:"Bound Dragonkin"}),Y("cavalier",8,["steel_sword","steel_lance"],0,4)]},{turn:5,units:[Y("manakete",8,["fire_breath"],7,2,{name:"Bound Dragonkin"})]}],reward:2500,pre:[{speaker:"narrator",text:"Caer Valen. The once-white city is grey with ash. In the great hall, a man sits upon the throne of Aldmere."},{speaker:"malrec",text:"Kael. You came home. I hoped you would.",mood:"happy"},{speaker:"kael",text:"You murdered my family at their own table.",mood:"angry"},{speaker:"malrec",text:"I ended a dynasty of dreamers. Your father sat on the oldest power in this world and used it to keep the peace. I intend to use it."},{speaker:"sable",text:"He means what sleeps under this city. Kael, whatever you do, don't let him call.",mood:"surprised"},{speaker:"malrec",text:"Too late, little sister. Kneel.",mood:"happy"},{speaker:"narrator",text:"The floor shudders. Through the hall doors come shapes with scales and burning eyes: dragonkin, their minds no longer their own."},{speaker:"sable",text:"I can hear it too. It's... loud. I'm holding. Don't ask me how long.",mood:"sad"},{speaker:"malrec",text:"Burn them. I have a kingdom to finish."},{speaker:"lyra",text:"Kael, we can't win this. Hold them here until the south gate is clear, then we run."},{speaker:"kael",text:"...Fine. Everyone stays alive. That is the only order.",mood:"angry"}],post:[{speaker:"narrator",text:"The south gate gives way. Under cover of smoke, Kael's army breaks out of Caer Valen and scatters into the hills."},{speaker:"brann",text:"Dragons. He has dragons. Nobody pays me enough for dragons... and I'm staying anyway."},{speaker:"sable",text:"They aren't his. He's only borrowed their minds. Some of my kin are still fighting him: the sea-wardens, the stone-keepers, the sky-born. Find them before he does."},{speaker:"mira",text:"And the towns between here and there?"},{speaker:"kael",text:"We help every one of them. Malrec rules by fear and foreign spears. We'll win with people who choose us."},{speaker:"lyra",text:"Then we start with the coast. Saltmere."}]},{number:6,title:"Saltmere",backdrop:"river",map:["WWWWWWWWW....FF...hhMM","WWWWWWWW.....F......hM","WWWWBBBH..bVb..rr....h","WWWWWWW...b.b..r......","WWWWWWW......rr...F...","WWBBBB.rrrrrr.....FF..","WWWWWW.r..bVb.........","WWWWWW.r..b.b...hh....","WWWWBBBr.........h..F.","WWWWWWW.r....F...bVb..","WWWWWWWW.r.......b.b..","WWWWWWWWW.rrrrrr......","WWWWWWWWWW.....rrrrrrr","WWWWWWWWWWW.....F....."],houses:[{x:11,y:2,text:'A net-mender presses a bottle into your hand. "Salt and kelp and something worse. It works, though."',potion:!0},{x:11,y:6,text:`The harbourmaster's widow takes a bow down from the wall. "He shot gulls with it. Shoot something worse."`,weapon:"killer_bow"},{x:18,y:9,text:`The fishermen have pooled what the Legion didn't take. "For the boats you'll bring home."`,gold:800}],objective:{type:"boss"},objectiveText:"Defeat Commodore Hesk. Keep the three Saltmere guards alive: heal them, or hand them vulneraries",allies:[Y("soldier",9,["steel_lance"],14,1,{name:"Saltmere Guard",lookId:"saltguard",statBonus:{hp:8,def:3}}),Y("soldier",9,["steel_lance"],13,6,{name:"Saltmere Guard",lookId:"saltguard",statBonus:{hp:8,def:3}}),Y("soldier",9,["steel_lance"],12,12,{name:"Saltmere Guard",lookId:"saltguard",statBonus:{hp:8,def:3}})],allyReward:{gold:3e3,flag:"saltmere_guards"},playerStarts:[{x:20,y:4},{x:21,y:4},{x:20,y:3},{x:21,y:3},{x:20,y:5},{x:21,y:5},{x:19,y:4},{x:19,y:3},{x:18,y:3},{x:21,y:6}],recruits:["nerys"],reinforcements:[{turn:3,units:[Y("brigand",9,["steel_axe"],11,13,{ai:"raid",name:"Ashen Marine"}),Y("brigand",9,["iron_axe"],12,13,{ai:"raid",name:"Ashen Marine"})]},{turn:4,units:[Y("manakete",9,["water_breath"],4,2,{name:"Bound Dragonkin"})]}],enemies:[Y("wyvern",11,["steel_axe"],7,2,{ai:"hold",isBoss:!0,name:"Hesk",lookId:"hesk",statBonus:{hp:8,str:2,skl:2,def:2}}),Y("manakete",9,["water_breath"],4,5,{ai:"guard",name:"Bound Dragonkin"}),Y("manakete",9,["water_breath"],5,8,{ai:"guard",name:"Bound Dragonkin"}),Y("archer",9,["steel_bow"],6,2,{ai:"guard"}),Y("soldier",9,["steel_lance"],7,5,{ai:"guard"}),Y("knight",9,["steel_lance"],8,4,{ai:"guard"}),Y("fighter",9,["steel_axe"],12,4),Y("myrmidon",9,["steel_sword"],9,9),Y("archer",9,["steel_bow"],13,10),Y("cavalier",9,["steel_sword","steel_lance"],14,8)],reward:2600,pre:[{speaker:"narrator",text:"Saltmere clings to the western cliffs. For a month no fishing boat has come home: something under the waves drags them down, and Imperial sails fill the harbour."},{speaker:"hesk",text:"Keep the nets in the water. If the sea-witch surfaces again, I want her on a chain."},{speaker:"lyra",text:"The Ashen Legion holds the piers. Malrec's own men, not the Empire's."},{speaker:"nerys",text:"You're standing in my harbour."},{speaker:"kael",text:"We've come to take it back from them.",mood:"surprised"},{speaker:"nerys",text:"Good. I've been pulling sailors out of the water for a hundred years, and I would like a day off."},{speaker:"sable",text:"Nerys. You held out.",mood:"happy"},{speaker:"nerys",text:"Sable. You look terrible. The ones on the piers are our kin. Malrec's voice has them now. If we have to put them down, be quick about it.",mood:"sad"},{speaker:"kael",text:"Then we end it fast. Commodore Hesk holds the harbour fort. Brann, Seren, watch the south road: they'll go for the fishermen."},{speaker:"narrator",text:"Three of Saltmere's own guards still hold out along the shore, in green. They fight on their own after your turn. Keep every one of them alive."}],post:[{speaker:"narrator",text:"The Ashen ships cut their anchors and run for open sea. By evening the first fishing boats are back on the water."},{speaker:"kael",text:"Nerys. Thank you."},{speaker:"nerys",text:"Don't. If you thank me I'll have to stay and be thanked properly."},{speaker:"kael",text:"Stay anyway.",mood:"happy"},{speaker:"nerys",text:"...Fine. No speeches."},{speaker:"tomas",text:"Hesk's orders. The Legion's ships carried iron from Deepforge, and the mines there are digging east."},{speaker:"sable",text:"East is Caer Valen. They're digging toward the seal.",mood:"surprised"},{speaker:"nerys",text:"Then they'll have met Garrow. The stone-keeper. He's stubborn as his mountain, and about as chatty."},{speaker:"narrator",when:"saltmere_guards",text:"The harbour guards you kept alive bring the town's thanks, and a warning: someone is still fighting in the sea caves under the cliffs, where the Legion has been hauling out books."},{speaker:"nerys",when:"saltmere_guards",text:"The Drowned Archive. I thought it was abandoned.",mood:"surprised"},{speaker:"kael",when:"saltmere_guards",text:"Then we go down before we go inland."}]},{number:6,title:"The Drowned Archive",backdrop:"night",requires:"saltmere_guards",map:["######################","#C.x..#.......x#.....#","#.....#..WWW...#..H..#","#..x.....WWW.....x...#","###..##..WW...##...C.#","WW#..#...BB...#..x...#","WW...x...WW.......####","WWW......WW..x.......W","WWW..x...WW......x..WW","WWWW.....BB...x.....WW","WWWW..x..WW.........WW","WWWWW....WW...x....WWW","WWWWWW...WW.......WWWW","WWWWWWW..WWWW....WWWWW"],houses:[],chests:[{x:1,y:1,text:'A tome bound in frost-white leather, shelved under "Weather, Hostile".',weapon:"blizzard_tome"},{x:19,y:4,text:"The archive's endowment, centuries of it, in a sealed coffer.",gold:1500}],objective:{type:"boss"},objectiveText:"Defeat the Legion's archmage in the reading room",playerStarts:[{x:7,y:12},{x:8,y:12},{x:6,y:12},{x:7,y:13},{x:8,y:13},{x:7,y:11},{x:8,y:11},{x:6,y:11},{x:5,y:11},{x:8,y:10}],recruits:["vesper"],reinforcements:[{turn:4,units:[Y("mage",10,["fire_tome"],8,1),Y("fighter",10,["steel_axe"],10,1)]}],enemies:[Y("mage",12,["thunder_tome"],18,2,{ai:"hold",isBoss:!0,name:"Archmage",statBonus:{hp:8,str:2,skl:3,def:2}}),Y("mage",10,["fire_tome"],12,3,{ai:"guard"}),Y("mage",10,["thunder_tome"],3,2,{ai:"guard"}),Y("archer",10,["steel_bow"],4,4,{ai:"guard"}),Y("fighter",10,["steel_axe"],13,7),Y("myrmidon",10,["steel_sword"],15,9),Y("soldier",10,["steel_lance"],11,5),Y("knight",10,["steel_lance"],17,6,{ai:"guard"}),Y("manakete",10,["water_breath"],12,10,{name:"Bound Dragonkin"}),Y("thief",10,["dagger"],16,1,{ai:"loot",name:"Cutpurse"})],reward:2e3,pre:[{speaker:"narrator",text:"Under Saltmere's cliffs the sea has eaten deep into the rock. In its caves the old kings of Aldmere kept the Drowned Archive: everything ever written about dragons."},{speaker:"nerys",text:"The Legion's been carrying books out of here all week, and burning the ones they don't want.",mood:"angry"},{speaker:"vesper",text:"Not all of them. Not while I'm still down here.",mood:"angry"},{speaker:"vesper",text:"Vesper. Keeper of the archive, the last one. Your guards said a prince was asking about dragons. So am I."},{speaker:"kael",text:"Malrec is binding the dragonkin. If anything in here says how..."},{speaker:"vesper",text:"There's a whole shelf about nothing else. It is currently on fire.",mood:"sad"},{speaker:"vesper",text:"Their archmage holds the reading room at the back. Clear him out and I'll show you everything we have left. And I can cast, so don't hide me behind anyone."},{speaker:"narrator",text:"Legion mages cast from one or two tiles and sit outside the weapon triangle. Close in on them fast."}],post:[{speaker:"vesper",text:"Saved: about three hundred volumes. Lost: rather more. One of them was about the Dark Dragon's seal.",mood:"sad"},{speaker:"vesper",text:"But I read it first. The binding needs every kind of dragon at once: fire, water, earth, wind and light. Malrec has fire. He'll want the rest."},{speaker:"sable",text:"Then he'll want us.",mood:"angry"},{speaker:"vesper",text:"I'm coming with you. Someone has to write all this down."},{speaker:"kael",text:"Welcome, Vesper.",mood:"happy"}]},{number:7,title:"Deepforge",backdrop:"ash",map:["MMMM###############MMM","MMMM#C.#...T...#.C#MMM","MMM.#..d.......d..#.MM","MM..####.......####.hM","M....h.....rrr.....h.M","M..F......rr.....F...M","..FF..H...r...hh......",".....bVb..r..bVb..F...",".....b.b..r..b.b......","..h.......rr......F...",".F.....F...r..........","...........rr.....hh..","..F..hh......r....hh..",".............r........"],houses:[{x:6,y:7,text:`A miner's wife hands over her husband's hammer. "He'd want it to break something of theirs."`,weapon:"hammer"},{x:14,y:7,text:`The miners' guild opens its strongbox. "Wages they never paid us. Spend them on the men who did this."`,gold:1e3}],chests:[{x:5,y:1,text:"The overseer's pay chest.",gold:2e3},{x:17,y:1,text:"A lance with a wicked barbed head, kept for the overseer's own guard.",weapon:"killer_lance"}],objective:{type:"seize",x:11,y:1},objectiveText:"Seize the overseer's chair in the lift-hall with Kael",playerStarts:[{x:13,y:12},{x:12,y:13},{x:13,y:13},{x:14,y:13},{x:12,y:12},{x:14,y:12},{x:11,y:13},{x:15,y:13},{x:11,y:12},{x:15,y:12}],recruits:["garrow"],awaken:{id:"vesper",classId:"dragonsage",stones:1},reinforcements:[{turn:4,units:[Y("manakete",10,["earth_breath"],9,2,{name:"Bound Dragonkin"})]},{turn:6,units:[Y("manakete",10,["earth_breath"],13,2,{name:"Bound Dragonkin"}),Y("fighter",10,["steel_axe"],0,6)]}],enemies:[Y("knight",12,["silver_lance"],11,1,{ai:"hold",isBoss:!0,name:"Druss",lookId:"druss",statBonus:{hp:8,str:2,skl:2,def:3}}),Y("knight",10,["steel_lance"],11,3,{ai:"hold",key:!0}),Y("archer",10,["steel_bow"],9,1,{ai:"guard"}),Y("archer",10,["steel_bow"],13,1,{ai:"guard"}),Y("manakete",10,["earth_breath"],9,4,{ai:"guard",name:"Bound Dragonkin"}),Y("manakete",10,["earth_breath"],14,5,{ai:"guard",name:"Bound Dragonkin"}),Y("fighter",10,["steel_axe"],6,6,{ai:"guard"}),Y("fighter",10,["steel_axe"],8,3,{key:!0}),Y("wyvern",10,["steel_axe"],19,2),Y("thief",10,["dagger"],2,3,{ai:"loot",name:"Cutpurse"})],reward:2800,pre:[{speaker:"narrator",text:"Deepforge's mines once gave Aldmere its iron. Now every miner in the town digs one tunnel, east under the mountains, toward Caer Valen and what sleeps beneath it."},{speaker:"druss",text:"Dig, or the children go without bread again. The king wants his tunnel, and I want my bonus."},{speaker:"pip",text:"There's a dragonkin chained at the shaft-head. They've been whipping him for a week and he still won't lift a pick.",mood:"sad"},{speaker:"pip",text:"Chains are only locks that think they're clever. Give me a minute.",mood:"happy"},{speaker:"garrow",text:"...Took you long enough."},{speaker:"garrow",text:"They want me to dig my own kin's prison. I said no. I'll say it again. Slower. With you.",mood:"angry"},{speaker:"nerys",text:"Garrow. You've not changed.",mood:"happy"},{speaker:"garrow",text:"Mountains don't."},{speaker:"narrator",when:"vesper",text:"At the mouth of the mine, Vesper picks something out of the spoil heap: a raw dragonstone, dug up and thrown away by miners who didn't know what it was."},{speaker:"vesper",when:"vesper",text:"The archive says these only answer to dragon blood. It's warm. It's... listening to me.",mood:"surprised"},{speaker:"sable",when:"vesper",text:"Vesper, put it down. Stones don't do that for-",mood:"surprised"},{speaker:"narrator",when:"vesper",text:"Light pours out of the stone. For one long moment a dragon stands where Vesper stood, scaled in every colour but gold. Then she is herself again, laughing."},{speaker:"vesper",when:"vesper",text:"Any shape I ask for. Fire, water, stone, wind. I can choose!",mood:"happy"},{speaker:"garrow",when:"vesper",text:"...Never seen that."},{speaker:"narrator",when:"vesper",text:"Vesper is now a Dragon Sage. She carries the stone she found, and can hold up to three. Each time she transforms, she chooses the kind of dragon."},{speaker:"garrow",text:"Overseer sits in the lift-hall. Take his chair and the mine stops. His guards keep the strongroom keys."},{speaker:"narrator",text:"Bound dragonkin are coming up the shafts. Stone breath reaches only one tile, but it breaks armour."}],post:[{speaker:"narrator",text:"The great lift groans to a halt. One by one, the miners of Deepforge climb up into daylight."},{speaker:"garrow",text:"Three miles of tunnel. Another month and they'd have reached the seal."},{speaker:"sable",text:"He doesn't need the tunnel to reach it. The binding is only half done. To finish it he needs light, and I know of only one light dragon left.",mood:"sad"},{speaker:"nerys",text:"Solenne's goddess."},{speaker:"kael",text:"A goddess?",mood:"surprised"},{speaker:"nerys",text:"The temple city calls her one. She doesn't know what she is."},{speaker:"lyra",text:"Then Malrec will go for Solenne next. We have to get there first."}]}],xe=(e,t,n,r,s,a)=>({hp:e,str:t,skl:n,spd:r,lck:s,def:a}),Wy=[{id:"lord",name:"Lord", l=`${t}-${a}-${s}-${o}`;let c=Ef.get(l);c||(c=jk(t,a,s,o).map(p=>p.paths(3)),Ef.set(l,c));const[d,...u]=c;return i.jsxs("svg",{viewBox:"0 0 48 48",shapeRendering:"crispEdges",children:[i.jsx(ur,{paths:d}),u.map((p,f)=>i.jsx("g",{style:{visibility:"hidden",animation:`fl2 1.8s step-end ${f*.9}s infinite`},children:i.jsx(ur,{paths:p})},f))]})}),kt={kael:{id:"kael",name:"Kael Valen",title:"Heir of House Valen",age:"31",classId:"lord",height:"180 cm",side:"ally",origin:"Second son of King Aldric. He became heir when his brother died in the border war, then spent his twenties as a garrison captain on the northern frontier. Recalled for the harvest feast, he watched the chancellor's men murder his father, mother and sister, and escaped only because Lyra cut a way out.",personality:"Dry-humoured, stubborn and quietly guilty that he lived when they did not. Listens more than he talks, then decides fast. Treats his companions as equals, which unsettles the knights.",appearance:"Untamed dark-brown hair, a week of stubble and a healed scar through the left eyebrow. Valen-blue coat with gold trim and a navy field cape that has seen better years.",combat:"Footwork duelist with the Valen Rapier. Light, accurate and fast enough to strike twice. He is the one unit that must not fall.",likes:"Early mornings, old maps, plain bread.",dislikes:"Ceremony, and being protected.",quote:"A crown is just a promise with a weight to it.",design:"The cape gives him a strong triangular silhouette that reads at map scale. Blue and gold anchor the player palette. Idle: weight on the back foot, blade held forward and low."},lyra:{id:"lyra",name:"Lyra Ashford",title:"Sworn Knight",age:"32",classId:"cavalier",height:"175 cm",side:"ally",origin:"Daughter of the royal stablemaster. She grew up beside Kael, beat him in five childhood tourneys, and took her knight's oath to his father at sixteen.",personality:"Blunt, loud when she laughs, fiercely protective and secretly sentimental. Has no patience for courtiers or for waiting.",appearance:"Long copper-red hair, freckles, a crimson tabard over light mail. Rides Ember, a chestnut warhorse with a black mane.",combat:"Mounted lancer who can swap between sword and lance to win the weapon triangle. Covers huge distances, but forests slow her and mountains stop her.",likes:"Horses, dawn sparring, sour apples.",dislikes:"Idle waiting, flattery.",quote:"Point me at the problem, my lord.",design:"The horse makes her the widest silhouette in the party. Red against Kael's blue keeps the two leads distinct side by side. The horse's legs gallop during every charge."},brann:{id:"brann",name:"Brann Holt",title:"Sellsword",age:"38",classId:"fighter",height:"191 cm",side:"ally",origin:"Dunmarch-born. Twenty years of contracts across three kingdoms. Every coin he earns goes south to his widowed sister and her three children.",personality:"Gruff, frugal and allergic to speeches. Plays the greedy mercenary so nobody notices how soft he is with children and wounded people.",appearance:"The broadest frame in the company. Thick brown beard, weathered skin, a sleeveless leather jerkin and forearms crossed with old scars.",combat:"Overhead axe chops that hit harder than anyone else. Slow and easy to hit, so he leans on a large health pool. Shreds lance users.",likes:"Honest pay, thick stew, his sister's letters.",dislikes:"Nobles who don't pay, boats.",quote:"Everyone counts something.",design:"A heavyweight silhouette with bare arms. His attack is the longest wind-up in the game, sold with a full-body lean into the chop."},seren:{id:"seren",name:"Seren Vale",title:"Hunter of the Vale",age:"33",classId:"archer",height:"168 cm",side:"ally",origin:"The unofficial guardian of a hill village since her father's death. She has tracked deer, wolves and bandits through the same woods for twenty years.",personality:"Sharp-tongued, patient and practical. Says little, notices everything, and keeps a running count of every arrow she has ever wasted.",appearance:"Dark green hair tied back in a tail, olive hunting leathers, a short hood, and a quiver of grey-fletched arrows on her back.",combat:"Shoots from one or two tiles away, so melee units can't answer her at range. Arrows deal double might to flying units.",likes:"Quiet, honey cakes, fresh tracks.",dislikes:"Wasted arrows, loud men (Brann excepted).",quote:"Breathe out. Then loose.",design:"Lean and vertical, the quiver breaking her outline from behind. Her attack is a full draw and release, followed by a visible arrow crossing the stage."},mira:{id:"mira",name:"Mira Edda",title:"Cleric of Saint Edda",age:"30",classId:"cleric",height:"163 cm",side:"ally",origin:"Twelve years in the cloister of Saint Edda, two of them as a field healer in the border war. She left the cloister when the wounded stopped being brought to her.",personality:"Warm until someone is hurt, then entirely in command. Scolds her patients, sings hymns off-key and laughs at Kael's jokes only when he isn't looking.",appearance:"Pale blonde hair under a white hood, ivory robes with a blue hem, a simple oak staff with a pale crystal.",combat:"Cannot attack. Heals an adjacent ally each turn and must be kept behind the line.",likes:"Herb gardens, hymns, quiet mornings.",dislikes:"Stubborn patients, cruelty.",quote:"Hold still. This will only hurt the first time.",design:"A long robe gives her a soft bell silhouette, the only one without visible legs. Her action raises the staff overhead while the crystal glows."},tomas:{id:"tomas",name:"Tomas of Brenmoor",title:"Knight of Brenmoor",age:"39",classId:"knight",height:"186 cm",side:"ally",origin:"Served Kael's father for fifteen years, was pressed into Imperial service when Brenmoor surrendered, and broke ranks at Ironvale Bridge.",personality:"Steady, formal and quietly ashamed of the year he wore the Empire's colours. Tells terrible jokes with a perfectly straight face.",appearance:"Grey-streaked hair under an open helm with a blue plume, a square stubbled jaw, full plate with a Valen-blue tabard.",combat:"The party's wall. Very high defense and low speed, four tiles of movement. Holds chokepoints and soaks hits for everyone else.",likes:"Polished armour, routine, a good pipe.",dislikes:"Bridges, these days.",quote:"A shield is a promise, too.",design:"Pauldrons widen the shoulders into a blocky silhouette. His lance thrust is short and heavy rather than fast."},rei:{id:"rei",name:"Rei Kasane",title:"Wandering Blade",age:"34",classId:"myrmidon",height:"170 cm",side:"ally",origin:"Senior student of an eastern hill sword school. When the Empire burned her master's school she started hunting the unit responsible, one soldier at a time.",personality:"Laconic, precise and impatient with wasted motion, including wasted words. Her warmth comes out in actions, rarely in speech.",appearance:"Black hair in a high ponytail, a violet fighting gi with a silver sash, and a Killing Edge worn at the hip.",combat:"The fastest unit in the party. Almost always strikes twice and has a high critical rate. Fragile if she gets caught.",likes:"Whetstones, plum tea, silence.",dislikes:"Heights, bragging.",quote:"One clean cut is worth ten wild ones.",design:"The ponytail trails her movement and the diagonal sash reads clearly at small sizes. Her slash is the snappiest swing in the game."},ilse:{id:"ilse",name:"Ilse Marrow",title:"Highmoor Sky Guard",age:"35",classId:"skyknight",height:"172 cm",side:"ally",origin:"Last rider of the Highmoor Sky Guard. When the castle fell, her wing scattered and she spent months raiding Imperial patrols alone from the clouds.",personality:"Cheerful, reckless and loud, with a lot of grief tucked behind the jokes. Trusts her pegasus Gale more than most people.",appearance:"Pale blue hair pinned in a bun, white-and-blue light armour, riding Gale, a white pegasus with a frost-blue mane.",combat:"Flies over water, mountains and forests. Strikes isolated targets, but bows deal double damage to her and she gains no terrain bonus.",likes:"Storm clouds, apples for Gale, racing.",dislikes:"Archers, being grounded.",quote:"The sky doesn't care whose banner is flying. I do.",design:"Wings flap continuously and the whole model hovers, so she always reads as airborne. The pale palette stands out against the darker cast."},vesper:{id:"vesper",name:"Vesper",title:"Keeper of the Drowned Archive",age:"26",classId:"mage",height:"168 cm",side:"ally",origin:"The last keeper of the archive in the sea caves under Saltmere, where the old kingdom kept everything it knew about dragons. The Ashen Legion came to burn it. At Deepforge she learns that a dragonstone answers her, and that she can make it into almost any dragon she likes. Light is beyond her.",personality:"Precise, bookish and quietly reckless. Asks questions nobody wants to answer, and writes the answers down.",appearance:"Plum hair tied back with a quill through it, ink-stained violet robes, freckles, sea-green eyes, a satchel of tomes.",combat:"Casts Fire, Thunder and Blizzard at one or two tiles, outside the weapon triangle. From chapter 7 a Dragon Sage: each dragonstone becomes whichever dragon the fight needs. Carries at most three stones.",likes:"Footnotes, rainstorms, being right about dragons.",dislikes:"Fire near books, people who skim.",quote:"Every dragon in the archive is a chapter. I intend to read them all.",design:"Violet against the cast's blues and reds, so the only magic user reads at a glance. In dragon form she takes the chosen element's colours."},gorran:{id:"gorran",name:"Gorran",title:"Brigand Chief",age:"37",classId:"brigand",height:"188 cm",side:"enemy",origin:"A deserter from the border war who turned raider. He sells villages, roads and rumours to whoever pays, lately Malrec.",personality:"Cheerful in the way of a man who has never been punished for anything. Cowardly when cornered.",appearance:"Shaggy black hair and beard, a red sash over patched leathers, a notched steel axe.",combat:"Holds the fort in Chapter 1. Hits hard but is clumsy, and swords have the advantage against him.",likes:"Easy marks.",dislikes:"Fair fights.",quote:"Coin's coin, princeling.",design:"A darker, rougher echo of Brann, deliberately: what a sellsword becomes without anyone to send the money to."},varn:{id:"varn",name:"Captain Varn",title:"Imperial Captain",age:"36",classId:"soldier",height:"183 cm",side:"enemy",origin:"Aldmere-born career officer who chose the winning side the night Malrec took the crown. Holds Ironvale for him with Imperial support. Commanded Tomas for a year.",personality:"Pragmatic and contemptuous of sentiment. Believes loyalty is something you rent.",appearance:"Closed helm with a red plume, crimson Imperial tabard over plate, a steel lance.",combat:"Holds the east-bank fort at Ironvale. Lances punish sword users; bring axes.",likes:"Order, promotion.",dislikes:"Deserters.",quote:"We are King Malrec's knights now. Or we are corpses.",design:"Palette-swapped mirror of Tomas's armour in Imperial red, to make the defection read visually."},morwen:{id:"morwen",name:"Lady Morwen",title:"Warden of Highmoor",age:"34",classId:"myrmidon",height:"174 cm",side:"enemy",origin:"An Imperial duelist lent to Malrec and rewarded with Highmoor after it fell. She has never lost a formal duel and considers sieges beneath her. Her men dig beneath the keep on Malrec's orders.",personality:"Cold, theatrical and very patient. Enjoys making her enemies come to her.",appearance:"Long black hair, a plum duelling coat with a crimson cape, and a Killing Edge.",combat:"Never leaves the throne. Fast and crit-heavy; lances and high defense blunt her.",likes:"Ceremony, ultimatums.",dislikes:"Being hurried.",quote:"Highmoor will make a fine tomb.",design:"Same swordmaster frame as Rei, dressed in court colours: the two are meant to feel like a mirror match."},malrec:{id:"malrec",name:"Malrec",title:"The Usurper King",age:"39",classId:"ashlord",height:"185 cm",side:"enemy",origin:"Royal chancellor of Aldmere for eight years. He murdered King Aldric's family at the harvest feast and took the crown, with the Ashen Empire's spears to hold it. He has stolen part of the power of the Dark Dragon sealed beneath Caer Valen, and with it he binds the minds of dragonkin.",personality:"Calm, articulate and certain he is the only adult in the room. Thinks of Aldmere's old kings as dreamers.",appearance:"Prematurely silver hair swept back, a thin scar over one brow, an iron crown, a black coat over armour with an ember-red cape.",combat:"The story's final enemy. Very high stats and the Ashen Blade. In the throne room at Caer Valen he does not fight: he looses the bound dragonkin and leaves.",likes:"Order, silence, being right.",dislikes:"Songs.",quote:"I ended a dynasty of dreamers.",design:"Black and ember against Kael's blue and gold. The crown is the only gold on any enemy, so he reads as a usurper at a glance."},hesk:{id:"hesk",name:"Commodore Hesk",title:"Commodore of the Ashen Legion",age:"44",classId:"wyvern",height:"180 cm",side:"enemy",origin:"A smuggler Malrec made an admiral. He holds Saltmere's harbour for the Legion and ships Deepforge's iron down the coast.",personality:"Loud, superstitious and quick to blame the sea for his own mistakes.",appearance:"Weathered face, salt-stiff leathers in Legion black and ember, a steel axe and a scarred red wyvern.",combat:"Holds the harbour fort in Chapter 6. A flier: bows and wind breath bring him down.",likes:"Fair winds, other people's cargo.",dislikes:"Things under the water.",quote:"If the sea-witch surfaces again, I want her on a chain.",design:"The Legion's black and ember rather than Imperial red, so Malrec's own men read apart from the Empire's."},druss:{id:"druss",name:"Overseer Druss",title:"Overseer of Deepforge",age:"51",classId:"knight",height:"178 cm",side:"enemy",origin:"A mine foreman who sold his own town to Malrec for a title. He drives Deepforge's miners to dig east toward the Dark Dragon's seal.",personality:"Petty, greedy and careful never to be anywhere dangerous.",appearance:"A closed helm, soot-black plate with ember trim, a silver lance he has never had to use.",combat:"Sits in the lift-hall chair in Chapter 7. Armoured: hammers and stone breath break him.",likes:"Quotas, bonuses.",dislikes:"Daylight, complaints.",quote:"The king wants his tunnel, and I want my bonus.",design:"A Legion knight in soot black, the same armour template as Varn so the Legion reads as one force."}};kt.pip={id:"pip",name:"Pip Marlowe",title:"Lockpick of Dunmarch",age:"30",classId:"thief",height:"163 cm",side:"ally",origin:"Grew up in the Dunmarch rookeries opening doors for people who did not own them. Was in Varn's stockade for exactly that when the bridge fell, and decided the winning side had better locks to practise on.",personality:"Quick, cheerful and entirely unembarrassed. Returns most of what gets borrowed.",appearance:"Small and wiry under a moss-green hooded cloak, a cloth mask pulled up over the nose, and a belt hung with picks and pouches.",combat:"Fast and frail. Steals weapons and vulneraries from any adjacent enemy that is not quicker, and opens chests, doors and gates with lockpicks, no key needed.",likes:"Complicated locks, other people's lunches.",dislikes:"Dogs. Honest work before noon.",quote:"I didn't take it. I relocated it. To me.",design:"A utility unit: weak in a straight fight, but disarming a dangerous enemy before the knights arrive changes the whole engagement."};kt.sable={id:"sable",name:"Sable",title:"Last of the Dragonkin",age:"Looks 30",classId:"manakete",height:"170 cm",side:"ally",origin:"One of the dragonkin who slept under Highmoor long before there was a kingdom on top of it. Morwen's diggers woke her on Malrec's orders so that he could bind her. She heard his call and refused it, and joins Kael after Highmoor falls. She has not decided what she thinks of the present century.",personality:"Courteous, remote and very old. Treats the war as weather. Fiercely protective of the few people she has bothered to learn the names of.",appearance:"Violet-black hair, two small curved horns, pale skin, and a dark robe. She carries her dragonstone in her hand like a lantern.",combat:"Cannot fight in human form. Spending a dragonstone makes her a violet dragon for three turns, with far higher strength and defence and fire breath that reaches two tiles.",likes:"High places, silence, warm stone.",dislikes:"Being woken. Being ridden.",quote:"I was old when your first king was a rumour. Do try to keep up.",design:"A limited resource: three dragonstones a battle is nine turns of the strongest unit in the army, and a liability the rest of the time."};kt.osric={id:"osric",name:"Osric Hale",title:"Woodward of the Whispering Wood",age:"39",classId:"soldier",height:"184 cm",side:"ally",origin:"A sergeant of the old royal levy who took a woodward's post after the border war and has kept the Whispering Wood for twelve years. He only joins if someone knocks on his door.",personality:"Dry, unhurried, and allergic to speeches. Counts everything: paces, arrows, the days since he last had to kill anyone.",appearance:"Greying cropped hair, a scar through one brow, and his old levy breastplate worn over forester's green.",combat:"A steady lance on foot. No mount, no tricks; he holds a line and is hard to move off it.",likes:"Split oak, quiet mornings, a well-kept edge.",dislikes:"Banners, and the men who wave them.",quote:"Twelve years I kept this wood. Suppose I can keep you lot alive for a few weeks.",design:"The only companion who is not met in the story: he waits in a house on the edge of the Chapter 3 map and is missed entirely if no one visits."};kt.nerys={id:"nerys",name:"Nerys",title:"Warden of Saltmere",age:"Looks 28",classId:"manakete",height:"172 cm",side:"ally",origin:"A water dragonkin who has guarded Saltmere's fishing fleet for a century without the town ever learning her name. When Malrec's call came she held on by staying in the cold deep water, where his voice is faint.",personality:"Dry, private and allergic to gratitude. Shows affection by fixing things nobody asked her to fix.",appearance:"Sea-blue hair worn loose, small pale horns, and a deep-blue robe that is always a little damp at the hem.",combat:"Cannot fight in human form. As a water dragon her Tide Breath reaches two tiles and almost never misses, though it hits less hard than fire.",likes:"Cold water, quiet harbours, salted fish.",dislikes:"Being thanked. Shallow water.",quote:"Don't thank me. Just stop sinking.",design:"Cool blues beside Sable's violet. The accurate dragon: lower might, very high hit."};kt.garrow={id:"garrow",name:"Garrow",title:"Stone-Keeper of Deepforge",age:"Looks 45",classId:"manakete",height:"196 cm",side:"ally",origin:"An earth dragonkin who lived under the Deepforge hills before there were miners in them. Bound by Malrec and made to dig toward the Dark Dragon's seal, he worked for a year before he found the will to put the pick down.",personality:"Slow to speak, slower to anger, impossible to move once decided. Carries the guilt of every tunnel he dug.",appearance:"The broadest of the dragonkin: weathered brown skin, earth-brown hair and beard, short horns like chipped stone, and a miner's leather apron.",combat:"Cannot fight in human form. As an earth dragon his Stone Breath hits harder than any other breath and breaks armour, but reaches only one tile.",likes:"Warm stone, honest work, long silences.",dislikes:"Tunnels. Being hurried.",quote:"I dug for him for a year. I'll spend the rest of my life filling it in.",design:"A heavy, grounded silhouette among the dragonkin. Short range and huge damage: he has to be walked into position."};kt.kestrel={id:"kestrel",name:"Kestrel",title:"Sky-Born of Galewatch",age:"Looks 25",classId:"manakete",height:"168 cm",side:"ally",origin:"A wind dragonkin from the peaks above Galewatch who spent decades flying behind the Sky Guard's formations for fun. Malrec's voice cannot reach far above the clouds, so Kestrel simply refused to come down.",personality:"Restless, talkative and allergic to standing still. Jokes through fear. Fiercely loyal to anyone who can keep up.",appearance:"Pale mint hair blown permanently sideways, swept-back horns, and light green flying leathers.",combat:"Cannot fight in human form. As a wind dragon the Gale Breath reaches three tiles and is deadly to fliers, but hits lighter than the others.",likes:"Storms, races, Ilse's formations.",dislikes:"Ceilings. Waiting.",quote:"Keep up or get out of my sky.",design:"Light and quick-looking; the hair and horns lean back as if always in a headwind."};kt.aurelie={id:"aurelie",name:"Aurelie",title:"Goddess of Solenne",age:"Looks 22",classId:"manakete",height:"165 cm",side:"ally",origin:"A light dragonkin found as an infant on the temple steps of Solenne and raised as its living goddess. Nobody in Solenne knew what she was, Aurelie least of all. Malrec wants her light to complete his hold over the dragonkin.",personality:"Serene in public, endlessly curious in private. Has never been allowed to be bad at anything, and finds it thrilling.",appearance:"Pale gold hair to the waist, small ivory horns, and a white and gold temple robe she keeps trying to swap for something practical.",combat:"Cannot fight in human form. As a light dragon her Radiant Breath reaches two tiles and hits hard and true.",likes:"Bread, questions, being called by her name.",dislikes:"Kneeling. Being kept safe.",quote:"Please stop kneeling. I'd much rather you passed the bread.",design:"White and gold, the brightest figure in the cast. In dragon form she is the light dragon."};const Kr=Object.fromEntries([["brigand","Ashen Brigand","Raiders paid in Malrec's coin to hunt the prince. Mostly deserters and desperate farmers.","Axes. Strong and inaccurate; swords beat them. They carry torches, and they are the only enemies who burn houses."],["fighter","Imperial Axeman","Shock infantry re
